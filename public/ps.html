    return e("span", { className: "grade" + (size ? " grade-" + size : ""),
                       "data-of-grade": g.letter,
                       style: { color: g.color, background: g.band, borderColor: g.color + "40" },
                       title: g.says + " — " + (basis || (ramp === "feature" ? FEATURE_GRADE_BASIS : GRADE_BASIS)) },
      g.letter,
      showSays ? e("i", null, g.says) : null);
  }
  function ScoreBar({ pct }) {
    if (pct == null) return e("span", { className: "zero" }, "not on rec");
    return e("span", { className: "scorebar" },
      e("i", { style: { width: pct + "%", background: scoreColor(pct), opacity: .25 } }),
      e("b", null, pct + "%"));
  }
  /* ---------------- ONE DERIVATION, N READERS ----------------
     The list, the drill-in and the printed report all have to agree about a
     score, a tracked set and a category's membership. Three components each
     computing their own is how the PDF handed to a Director comes back with a
     different percentage from the screen it was generated off — the same rule
     that sends the Programs autopay column through `progAutopayShare` in the
     sibling project.

     Everything here is settings-scoped: `hiddenFeatures` leaves the tracked
     set and `excludedOrgs` leaves the fleet, so no reader can widen either. */
  function ofDerive(d, cfg) {
    d = d || {};
    cfg = cfg || {};
    const hidden = new Set(cfg.hiddenFeatures || []);
    const excluded = new Set(cfg.excludedOrgs || []);
    const byKey = {};
    (d.features || []).forEach(f => { byKey[f.key || f.id || f.name] = f; });
    const label = k => (byKey[k] && (byKey[k].name || byKey[k].label)) || k;
    const allMeasured = d.measuredFeatures || [];
    const shown = allMeasured.filter(k => !hidden.has(k));
    const adoptedIn = (slug, k) => {
      const v = ((d.adoption || {})[slug] || {})[k];
      return !!(v && (v === true || v.adopted === true || Number(v.count) > 0));
    };
    const scoreOf = (slug) => {
      const a = (d.adoption || {})[slug];
      if (!a) return null;                      // unmeasured is not zero
      if (!shown.length) return null;           // nothing ticked is not 0%
      return Math.round((shown.filter(k => adoptedIn(slug, k)).length / shown.length) * 100);
    };
    const orgName = o => o.displayName || o.name || o.slug;
    const everyOrg = (d.orgs || []).slice().sort((a, b) => orgName(a).localeCompare(orgName(b)));
    const all = everyOrg.filter(o => !excluded.has(o.slug));
    const groups = (d.featureCategories || [])
      .map(cat => ({ cat, keys: shown.filter(k => byKey[k] && byKey[k].category === cat) }))
      .filter(g => g.keys.length > 0);
    /* THE CURRENT SET'S KEY, so the trend can drop history points scored over
       a different one. Hashed exactly as the bake does it — see
       scripts/refresh/merge-snapshot.js — and taken over `shown`, so
       UNTICKING A FEATURE INVALIDATES THE WHOLE SERIES rather than plotting
       stored scores against a denominator the reader has just changed. That is
       the honest answer: those points really were measured over a set the page
       is no longer using. */
    const setKey = (() => {
      const joined = shown.slice().sort().join(",");
      let h = 0;
      for (let i = 0; i < joined.length; i++) { h = (h * 31 + joined.charCodeAt(i)) | 0; }
      return shown.length + ":" + (h >>> 0).toString(36);
    })();
    return {
      hidden, excluded, byKey, label, allMeasured, shown, adoptedIn, scoreOf,
      orgName, everyOrg, all, groups, setKey, history: ofSeriesHistory(d),
      backfilled: ofBackfilledKeys(d),
      backfillFrom: ((d.backfillMeta || {}).from) || null,
      trendOf: (slug) => ofTrend(d.history || [], slug, setKey),
      total: (d.features || []).length,
      notUsing: (s2) => shown.filter(k => !adoptedIn(s2, k)),
      detailOf: (s2, k) => (((d.adoption || {})[s2] || {})[k] || {}).detail || "",
    };
  }

  /* HOW MANY LIVE ORGS ALREADY USE EACH FEATURE. This is the ranking signal
     for "what should we turn on next", and it is the one argument a Director
     cannot wave away: "62 of 73 organizations live on rec.us use this, and you
     do not" is a fact about the fleet rather than our opinion about the
     feature.

     PRE-LAUNCH ORGS ARE OUT OF THE DENOMINATOR. Half the fleet is mid-setup
     and has configured almost nothing, so counting them makes every feature
     look unpopular — the same reason the row already says "live" or
     "pre-launch". */
  function ofFleetUse(d, dv, keys) {
    const live = (dv.all || []).filter(o => o.launched);
    const out = { liveOrgs: live.length, used: {} };
    /* `keys` is optional and defaults to the tracked set, so every existing
       caller is unchanged. The per-feature page passes ONE key — both because
       57 x 145 adoption lookups to answer a question about one feature is
       waste, and because that page must work for a feature the settings have
       HIDDEN, which is not in `shown` and would otherwise come back
       undefined and render as a blank where a real count belongs. */
    (keys || dv.shown || []).forEach(k => {
      out.used[k] = live.filter(o => dv.adoptedIn(o.slug, k)).length;
    });
    return out;
  }

  /* ---------------- the adoption TREND ----------------
     Dan: "can we add sparklines to each org, you know I love those", with a
     screenshot of a catalyst table — a signed 30-day delta over a small
     sparkline, green up, red down.

     ONLY COMPARABLE POINTS COUNT, and this is the whole reason it can be
     trusted. Every history point carries the `setKey` of the feature set it
     was scored over (see scripts/refresh/merge-snapshot.js), and points from
     a different set are DROPPED rather than plotted. The one older bake in
     this repo measured FOURTEEN features against today's fifty-six: Apex
     reads 86% there and 89% here, which looks like +3 and is a denominator
     that quadrupled. Plotting it would publish a definition change as org
     behaviour.

     NULL UNTIL THERE ARE TWO, and the column says so rather than drawing a
     flat line. One point is not a trend; a flat line is a claim that nothing
     changed, which is not the same fact as "we have only started measuring".
     Same absent-is-not-zero rule as everywhere else here. */
  /* ── THE RECONSTRUCTED HALF OF THE SERIES ─────────────────────────────
     The nightly bake accrues one point a morning and started on 2026-09-07,
     so the chart had eleven days on it. `data.backfill` is the same shape
     rebuilt from the production database back to 2026-01-19 — see
     scripts/refresh/backfill-history.js for how, and for the two things that
     bound it: a metric whose predicate reads an untimestamped column cannot
     be reconstructed at all, and the live denominator is only real from the
     day `organization.published_at` was populated.

     THEY ARE ONE ARRAY FROM HERE ON, and that is safe rather than convenient.
     A backfilled point carries ONLY the 36 reconstructable features, so
     `ofFeatureTrend` — which skips any point missing the key it is asked for
     — picks them up for those and leaves the other 24 starting at the bake,
     with no filtering to write and none to forget. It carries no per-org
     `scores` and no `setKey`, so `ofTrend` drops it twice over: a score over
     36 features is not the same measurement as a score over 60, and the
     per-organization series must not silently mix the two. */
  function ofSeriesHistory(d) {
    const back = (d && d.backfill) || [], live = (d && d.history) || [];
    return back.concat(live).sort((a, b) => String(a.date).localeCompare(String(b.date)));
  }
  function ofBackfilledKeys(d) {
    return new Set(((d && d.backfillMeta && d.backfillMeta.features) || []));
  }
  /* AND THE CHART SAYS WHICH HALF IT IS DRAWING. Two lines on one axis, one
     reaching back eight months and one starting three weeks ago, is a picture
     that invites the reader to compare their slopes — so the difference has
     to be on screen rather than in a commit message. It returns null once
     nothing is reconstructed, so a future where every feature is measured
     from the start does not carry a permanent footnote about it. */
  function ofChartProvenance(keys, backfilled, from) {
    const all = (keys || []), bf = all.filter(k => backfilled && backfilled.has(k));
    if (!bf.length || bf.length === all.length) return null;
    return bf.length + " reconstructed from the database back to " + from
      + ", " + (all.length - bf.length) + " measured from the first bake";
  }

  const TREND_MIN_POINTS = 2;
  function ofTrend(history, slug, setKey) {
    const pts = (history || [])
      .filter(h => h && (!setKey || h.setKey === setKey))
      .map(h => ({ date: h.date, v: (h.scores || {})[slug] }))
      .filter(x => x.v != null && isFinite(x.v));
    if (pts.length < TREND_MIN_POINTS) {
      return { points: pts, ready: false, delta: null, first: null, last: pts.length ? pts[pts.length - 1].v : null };
    }
    const first = pts[0].v, last = pts[pts.length - 1].v;
    return { points: pts, ready: true, first, last, delta: last - first,
             from: pts[0].date, to: pts[pts.length - 1].date };
  }
  /* THE DELTA IS IN POINTS, NOT PERCENT. Both readings are percentages, so
     "+12%" is ambiguous — 50 to 56 is +6 points and +12 percent, and the two
     are different sentences about the same move. Points is the one a reader
     can check against the two numbers on screen. */
  function ofTrendLabel(t) {
    if (!t || !t.ready || t.delta == null) return null;
    const d2 = Math.round(t.delta);
    return (d2 > 0 ? "+" : d2 < 0 ? "\u2212" : "") + Math.abs(d2) + " pts";
  }
  /* ── THE SEARCH BOX ───────────────────────────────────────────────────
     Dan: "we need a text search box here to focus on a feature, if I know the
     name, like 'calendar', should match against everything that it filters
     down on."

     SO IT MATCHES EVERY FIELD THE ROW CARRIES, not just the displayed name —
     the key, the short label, the category and the one-line description as
     well. Typing "sync" finds Calendar Sync, "money" finds nothing and
     "payments" finds the whole Payments & Pricing group. A box that silently
     searched the name alone would make half of those reads look like the
     feature is missing.

     AND over whitespace-separated terms, so "auto pay" and "pay auto" find
     the same row. The fields are joined with a separator no query can
     contain, or a term could match across the boundary between two of them
     and "sync calendar" would hit something that is neither. */
  function ofFeatureMatch(row, q) {
    const terms = String(q || "").toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return true;
    const hay = [row.key, row.name, row.short, row.cat, catShort(row.cat), row.description]
      .filter(Boolean).join("\u0001").toLowerCase();
    return terms.every(t => hay.indexOf(t) >= 0);
  }

  /* ── A FEATURE'S OWN TREND ─────────────────────────────────────────────
     NOT the org trend with a different argument. Each history point's
     `scores` map is per ORGANIZATION, and no amount of averaging it answers
     "how many organizations use calendar sync" — so the series had to be
     recorded separately (see merge-snapshot.js) and backfilled from the
     bakes this repo has already committed.

     TWO WAYS A POINT IS DROPPED, and BOTH are about the DENOMINATOR rather
     than the feature set the org trend guards on:

       * NO LIVE DENOMINATOR. The 25 snapshots committed before 2026-09-07
         carry 61-69 organizations with NONE flagged launched, so their live
         count is zero. There is no percentage to take, and taking one anyway
         would publish a change in who we measure as a change in adoption —
         the same trap the org trend's setKey guard exists for, one level up.
       * THE FEATURE IS NOT IN THAT POINT. It was not measured yet, so there
         is no zero to plot. Plotting one would draw a month of 0% under a
         feature added yesterday and invent a rise that never happened.

     The shape matches `ofTrend` exactly, so TrendCell and Trendline render
     both without knowing which they were handed. */
  function ofFeatureTrend(history, key) {
    const pts = (history || [])
      .filter(h => h && h.liveOrgs > 0 && h.featureLive && h.featureLive[key] != null)
      .map(h => ({ date: h.date, v: Math.round((h.featureLive[key] / h.liveOrgs) * 100) }));
    if (pts.length < TREND_MIN_POINTS) {
      return { points: pts, ready: false, delta: null, first: null,
               last: pts.length ? pts[pts.length - 1].v : null };
    }
    const first = pts[0].v, last = pts[pts.length - 1].v;
    return { points: pts, ready: true, first, last, delta: last - first,
             from: pts[0].date, to: pts[pts.length - 1].date };
  }

  /* ONE ROW PER TRACKED FEATURE, and ONE reducer behind every surface that
     shows one — the table, the KPI row above it and the per-feature page all
     read this, so none of them can disagree about a percentage.

     THE LIVE HALF GOES THROUGH `ofFleetUse`, which is the existing single
     definition of "live organizations using X". Recomputing it here would be
     a second definition of the number this whole tab is about. */
  function ofFeatureRows(d, dv) {
    const keys = dv.shown || [];
    const fleet = ofFleetUse(d, dv, keys);
    const orgs = dv.all || [];
    return keys.map(k => {
      const live = fleet.used[k] || 0;
      const all = orgs.filter(o => dv.adoptedIn(o.slug, k)).length;
      const f = dv.byKey[k] || {};
      return {
        key: k, name: dv.label(k),
        cat: f.category || "",
        /* THE SEARCHABLE TEXT IS BUILT HERE, in the same reducer that builds
           the row, so the box can never be searching a different set of
           fields from the one the table is showing. */
        short: f.short || "", description: f.description || "",
        live, liveOrgs: fleet.liveOrgs, all, allOrgs: orgs.length,
        /* NULL, NEVER 0%, WITH NO DENOMINATOR. A view scoped to nothing but
           pre-launch orgs has no live fleet to be a share of, and "0% of
           nobody" is a statement about the filter rather than the feature. */
        pct: fleet.liveOrgs ? Math.round((live / fleet.liveOrgs) * 100) : null,
        pctAll: orgs.length ? Math.round((all / orgs.length) * 100) : null,
        trend: ofFeatureTrend(dv.history, k),
      };
    });
  }

  function ofTrendColor(t) {
    if (!t || !t.ready || t.delta == null) return "var(--faint)";
    return t.delta > 0 ? "var(--good)" : t.delta < 0 ? "var(--bad)" : "var(--faint)";
  }
  /* The line. Scaled to the SERIES, not to 0-100 — an org moving 61 to 64
     over a month is a real move and would be a flat line against a full
     axis, which is the whole point of a sparkline. A single flat series still
     draws a mid-height line rather than dividing by zero. */
  function Trendline({ t, w, h }) {
    if (!t || !t.ready) return null;
    w = w || 62; h = h || 20;
    const vs = t.points.map(x => x.v);
    const lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || 1;
    const step = vs.length > 1 ? (w - 2) / (vs.length - 1) : 0;
    const pt = (v, i) => (1 + i * step).toFixed(1) + "," +
      (h - 2 - ((v - lo) / span) * (h - 4)).toFixed(1);
    const d2 = vs.map(pt).join(" ");
    const col = ofTrendColor(t);
    return e("svg", { className: "trendline", width: w, height: h, viewBox: "0 0 " + w + " " + h,
                      "aria-hidden": "true", focusable: "false" },
      e("polyline", { points: d2, fill: "none", stroke: col, strokeWidth: 1.5,
                      strokeLinecap: "round", strokeLinejoin: "round" }),
      /* The endpoint is emphasised, because "where is it now" is the first
         thing anyone asks of a sparkline. */
      e("circle", { cx: (1 + (vs.length - 1) * step).toFixed(1),
                    cy: (h - 2 - ((vs[vs.length - 1] - lo) / span) * (h - 4)).toFixed(1),
                    r: 2, fill: col }));
  }
  function TrendCell({ t, why }) {
    if (!t || !t.ready) {
      /* NOT A DASH IN A COLUMN HEADED "TREND" WITH NO EXPLANATION. The
         history starts at the first bake carrying it, so for the first day
         this is every row, and a bare — reads as broken data. */
      return e("span", { className: "trendnone", "data-of-trend": "",
                         title: (t && t.points.length === 1)
                           ? "Only one measurement so far. The daily bake adds a point every "
                             + "morning, so this fills in from tomorrow."
                           /* THE REASON IS THE CALLER'S, because the two series
                              drop points for different reasons and a tooltip
                              naming the wrong one sends the reader looking in
                              the wrong place. */
                           : (why || "No comparable measurement history yet. Points scored over a "
                             + "different feature set are deliberately not plotted.") },
        "\u00b7");
    }
    return e("span", { className: "trendcell", "data-of-trend": Math.round(t.delta),
                       title: t.first + "% on " + t.from + " \u2192 " + t.last + "% on " + t.to
                            + " \u00b7 " + t.points.length + " measurements" },
      e("b", { style: { color: ofTrendColor(t) } }, ofTrendLabel(t)),
      e(Trendline, { t }));
  }

  /* WHERE THIS ORG SITS AMONG ITS PEERS, by rank rather than by a gap to an
     average. "12th of 73" is readable; "18 points below the mean" invites an
     argument about the mean. Ranked among LIVE orgs only, and NULL for an org
     that is not live yet — a pre-launch org ranked against launched ones is a
     comparison nobody asked for. */
  function ofRank(org, dv) {
    if (!org || !org.launched) return null;
    const mine = dv.scoreOf(org.slug);
    if (mine == null) return null;
    const peers = (dv.all || []).filter(o => o.launched)
      .map(o => dv.scoreOf(o.slug)).filter(v => v != null);
    if (peers.length < 5) return null;          // a rank out of four is noise
    peers.sort((a, b) => b - a);
    return { rank: peers.filter(v => v > mine).length + 1, of: peers.length,
             median: peers[Math.floor((peers.length - 1) / 2)] };
  }

  /* ── ADOPTION OVER TIME ───────────────────────────────────────────────
     Dan: "I want a fill rate chart similar to this one from our reporting
     project. what lets me track the adoption rate of rec features."

     The table below this answers "where has each feature got to". This
     answers "which way is it going", which is the question a table of
     percentages cannot be read for — the Moving card above already counts
     the features whose share has changed, and this is that card's contents
     drawn out.

     IT READS `ofFeatureTrend` AND DERIVES NOTHING. That helper is already
     the one definition of a feature's adoption series, and it is what the
     sparkline in the table's Trend column plots — so a line here and the
     dot on its own row cannot disagree about the same feature. Two
     derivations of one series is how a chart comes to contradict the table
     it sits above.

     DEFAULTS TO THE MOVERS, and that is measured rather than preferred.
     On 2026-09-16, of the 60 tracked features, exactly TEN had moved at all
     over the ten days of history; the top eight by adoption are all flat.
     Opening on "most adopted" therefore draws five ruler-straight lines and
     teaches nothing, while opening on "moved most" draws ai_assistant
     climbing 59→66. One ordering does both: by movement, then by adoption,
     then by name — so a fleet where nothing has moved yet still opens on
     its biggest features rather than on an empty chart. */
  /* THE SLOTS ARE TOKENS, NOT HEXES, so the chart themes itself. var()
     resolves in an SVG presentation attribute as well as in a style object
     — measured in this project's own Chromium, not assumed — so the line's
     `stroke` and the pill's `background` can both be the same token and
     there is no JS palette to keep in step with the stylesheet. */
  const OF_SERIES_COLORS = ["var(--series-1)", "var(--series-2)", "var(--series-3)",
                            "var(--series-4)", "var(--series-5)", "var(--series-6)"];
  /* SIX, BECAUSE SIX IS WHAT WAS VALIDATED, in BOTH modes. The light column is
     the first six slots of the categorical order against this page's white
     card (worst adjacent colour-vision ΔE 9.1, worst normal-vision ΔE 19.6);
     the dark column is the palette's own dark steps re-validated against this
     page's own dark card (ΔE 8.4 / 19.3, every slot inside the dark
     lightness band). BOTH RUNS PASS. A seventh series would be a hue nobody
     checked in either mode, so the pills refuse rather than inventing one.

     Three light slots sit below 3:1 on white and one dark slot (green, 2.96)
     sits just below it on slate — which is why every line is labelled at its
     end and every pill carries its name. That relief is the condition the
     sub-3:1 slots are legal under; colour is never the only channel here. */
  const OF_CHART_MAX = OF_SERIES_COLORS.length;
  const OF_CHART_OPEN = 5;

  /* ── HOW FAR BACK ─────────────────────────────────────────────────────
     Dan: "any way we can change the time range here? Don't need a date
     range, just a last 30, last 3 months, 6 months, etc."

     Presets rather than two date fields, because every question anyone asks
     of this chart is "recently" or "over the year" — a From/To pair makes the
     reader compose a window before they can look at anything, and the page
     already has a date-free story to tell. */
  const OF_CHART_RANGES = [
    { id: "30d", label: "30 days", days: 30 },
    { id: "3m", label: "3 months", days: 91 },
    { id: "6m", label: "6 months", days: 182 },
    { id: "12m", label: "12 months", days: 365 },
    { id: "all", label: "All", days: null },
  ];
  /* THE CUTOFF IS COMPUTED IN UTC FROM THE PARTS, and that is deliberate
     rather than a violation of this file's own never-parse-a-bare-ISO rule.
     That rule exists because `new Date("2026-09-07")` is parsed as UTC
     midnight and then READ BACK in local time, which lands a day early west
     of UTC. Date.UTC on explicit parts, read back with getUTC*, never touches
     the local zone in either direction, so it is the one safe way to do date
     ARITHMETIC — and there is no way to subtract 91 days from a string. */
  function ofChartCutoff(iso, days) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
    if (!m || !days) return null;
    const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]) - (days - 1) * 86400000);
    const pad = n => (n < 10 ? "0" : "") + n;
    return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
  }
  /* MEASURED BACK FROM THE LAST BAKE, not from today's clock. The bake can
     miss a morning — it missed three in September — and counting back from
     "now" would then quietly drop the newest points out of a 30-day window on
     the days it matters most. ISO dates compare correctly as strings. */
  function ofChartWindow(history, days) {
    const h = history || [];
    if (!days || !h.length) return h;
    const cut = ofChartCutoff(h[h.length - 1].date, days);
    return cut ? h.filter(x => x && x.date >= cut) : h;
  }
  /* ONLY THE RANGES THAT CHANGE SOMETHING ARE OFFERED, because a row of
     buttons that all draw the same chart is a control that looks broken. The
     bake has recorded history since 2026-09-07, so today every preset is the
     whole series and only All can be picked — they enable themselves as the
     history grows past each one, with no code change and nothing to remember.

     THEY ARE SHOWN DISABLED RATHER THAN HIDDEN, which is the narrow exception
     to this project's absent-not-greyed rule and is the same call Dan made on
     the Musco button one project over: hiding a control he asked for makes
     "was this built?" unanswerable, and a disabled button that says why it is
     disabled answers it. */
  function ofChartRangeOptions(history) {
    const n = (history || []).length;
    return OF_CHART_RANGES.map(r => Object.assign({}, r, {
      enabled: !r.days || ofChartWindow(history, r.days).length < n,
    }));
  }
  /* AND IT SAYS WHY, ON SCREEN. Dan, on the greyed row: "how come this isn't
     clickable?" — which is the disabled control answering nothing, for the
     second time in this repo family.

     THE EXPLANATION WAS ALREADY THERE AND UNREACHABLE. Each gated button
     carries a `title` saying how much history the bake has. A disabled button
     DOES still fire mouseover in Chrome (measured — the first theory here was
     that it does not, and that was wrong), so the tooltip works; nobody
     hovers a greyed-out button to find out why it is grey. The chart's
     footnote states the same fact and sits six hundred pixels below the
     thing it explains.

     So the reason goes NEXT TO THE BUTTONS, and only while it is true: once
     the bake has more than a year of history nothing is gated, this returns
     null and the note disappears on its own. A permanent note is noise, and
     noise is what the next reader learns to skip. */
  function ofChartRangeNote(history, ranges) {
    const gated = (ranges || []).filter(r => !r.enabled);
    if (!gated.length) return null;
    const n = (history || []).length;
    return n + " day" + (n === 1 ? "" : "s") + " of history so far \u2014 "
      + (gated.length === 1 ? gated[0].label + " unlocks" : "longer ranges unlock")
      + " as the bake fills in";
  }

  /* ONE DERIVATION, WINDOWED. The trend is re-taken over the sliced history
     through `ofFeatureTrend` — the same function the table's Trend column
     reads — rather than recomputed here, so the delta on a pill is the delta
     over the window on screen and the two surfaces still cannot disagree
     about how a series is built. The table keeps passing the full history;
     only the chart narrows its input. */
  function ofChartRows(rows, hist) {
    return (rows || []).map(r => Object.assign({}, r, { trend: ofFeatureTrend(hist, r.key) }));
  }

  /* THREE BANDS, AND THE MIDDLE ONE IS NEW. Dan: "if a feature is too new
     then just put a dot where it started on the timeline."

     A feature with ONE measurement in the window used to be dropped from this
     chart entirely — `ofFeatureTrend` returns ready:false for it and the
     filter here was `r.trend.ready` — so the features most worth noticing,
     the ones that have just appeared, were the ones it hid. They are plotted
     now as a single dot at the date they start, which is the honest mark: a
     line between one point and nothing is a claim about a direction nobody
     has measured yet.

     Movers first, then the new arrivals, then the flat — because a feature
     appearing IS change, and ranking it below a line that has not moved in a
     month buries the thing this chart is for. A feature with NO measurement
     in the window is not offered at all; there is nothing to draw. */
  /* ── RANKING COMPARES LIKE WITH LIKE ──────────────────────────────────
     "Moved most" has to be measured over a window every feature HAS, and
     after the backfill they no longer share one: 36 features reach back to
     January and 24 start at the first bake. Ranking on each series' own span
     puts "+18 points over eight months" above "+3 points over three weeks"
     and calls the first the bigger mover, which is not a comparison at all —
     and the effect is not subtle. Measured on the real feed it pushed every
     one of the 24 off the chart entirely: 14 pills, all reconstructed.

     SO THE RANK IS TAKEN FROM THE FIRST MEASURED BAKE ONWARD, which every
     feature has by construction — that is the day the nightly bake started
     recording all of them. The LINE still draws its whole history; only the
     ordering is scoped. With no backfill at all this is the entire series and
     the ranking is exactly what it was. */
  function ofChartRankFrom(history) {
    const live = (history || []).filter(h => h && !h.backfill);
    return live.length ? live[0].date : null;
  }
  function ofChartRankDelta(t, since) {
    if (!t || !t.points) return null;
    const pts = since ? t.points.filter(p => p.date >= since) : t.points;
    if (pts.length < TREND_MIN_POINTS) return null;
    return pts[pts.length - 1].v - pts[0].v;
  }

  function ofChartBand(t) {
    if (!t || !t.points.length) return 3;               // nothing in this window
    if (t.ready && t.delta !== 0) return 0;             // moved
    if (!t.ready) return 1;                             // too new to say
    return 2;                                           // measured, flat
  }
  function ofChartOrder(rows, since) {
    return (rows || []).filter(r => r && r.trend && r.trend.points.length)
      .slice().sort((a, b) => {
        const ba = ofChartBand(a.trend), bb = ofChartBand(b.trend);
        if (ba !== bb) return ba - bb;
        const da = Math.abs(ofChartRankDelta(a.trend, since) || 0);
        const db = Math.abs(ofChartRankDelta(b.trend, since) || 0);
        if (db !== da) return db - da;
        const pa = a.pct == null ? -1 : a.pct, pb = b.pct == null ? -1 : b.pct;
        if (pb !== pa) return pb - pa;
        return String(a.name).localeCompare(String(b.name));
      });
  }
  function ofChartDefault(rows, since) {
    return ofChartOrder(rows, since).slice(0, OF_CHART_OPEN).map(r => r.key);
  }

  /* COLOUR FOLLOWS THE FEATURE, NOT ITS RANK. The slot list is positional and
     a removed feature leaves a HOLE rather than closing the gap, so taking
     one line off the chart cannot repaint the ones that stay — a reader who
     unticks Payment Plans must not find that SMS has silently become orange.
     That is the whole reason this is not `sel.indexOf(key)` over a dense
     array, which is the obvious implementation and repaints on every
     removal. */
  function ofChartToggle(slots, key) {
    const next = (slots || []).slice();
    const at = next.indexOf(key);
    if (at >= 0) {
      next[at] = null;
      while (next.length && next[next.length - 1] == null) next.pop();
      return next;
    }
    const hole = next.indexOf(null);
    if (hole >= 0) { next[hole] = key; return next; }
    if (next.length >= OF_CHART_MAX) return next;   // full: refuse, never cycle
    next.push(key);
    return next;
  }
  function ofChartCount(slots) { return (slots || []).filter(Boolean).length; }

  function ofChartSeries(rows, slots) {
    const byKey = {};
    (rows || []).forEach(r => { if (r && r.key) byKey[r.key] = r; });
    return (slots || []).map((k, i) => {
      const r = k ? byKey[k] : null;
      /* ONE POINT IS ENOUGH TO PLOT — it draws a dot rather than a line.
         `ofFeatureTrend` still sets `last` for a single point, so the mark and
         its label have a value without anything being inferred. */
      if (!r || !r.trend || !r.trend.points.length) return null;
      return { key: r.key, name: r.name, color: OF_SERIES_COLORS[i % OF_SERIES_COLORS.length],
               points: r.trend.points, last: r.trend.last, delta: r.trend.delta,
               ready: r.trend.ready };
    }).filter(Boolean);
  }
  /* THE X DOMAIN IS THE UNION OF THE DATES THE SELECTED SERIES ACTUALLY
     CARRY — never a generated range. A feature first measured on the 11th has
     six points against everything else's ten, and it must START on the 11th
     rather than being given four zeroes to sit on; the repo has already
     shipped that bug once and the guard against it is that a line's vertex
     count equals its point count. */
  function ofChartDates(series) {
    const seen = {};
    (series || []).forEach(s => (s.points || []).forEach(p => { seen[p.date] = 1; }));
    return Object.keys(seen).sort();
  }
  /* Label about eight of them, whatever the history has grown to — the axis
     gains a date every morning and an unthinned axis collides with itself
     inside a fortnight. Always the last one, so "where it ends" is readable. */
  function ofChartTicks(dates, max) {
    const n = (dates || []).length, cap = max || 10;
    if (!n) return [];
    if (n <= cap) return dates.map((_, i) => i);
    const step = (n - 1) / (cap - 1), out = [];
    for (let i = 0; i < cap; i++) out.push(Math.round(i * step));
    return out.filter((v, i, a) => a.indexOf(v) === i);
  }
  function ofChartDateLabel(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
    if (!m) return String(iso || "");
    /* FROM THE PARTS, never `new Date(iso)` — a bare ISO date is UTC midnight
       and renders as the day before across the Americas, which would put every
       point on this axis one day early. */
    const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return MON[Number(m[2]) - 1] + " " + Number(m[3]);
  }
  /* PUSH OVERLAPPING END LABELS APART rather than letting them collide. Two
     features three points apart put their labels on top of each other and
     both become unreadable; the line still ends where the data says, only the
     text is nudged. */
  function ofChartLabelY(ys, minGap, lo, hi) {
    const gap = minGap || 13;
    const order = ys.map((y, i) => ({ y, i })).sort((a, b) => a.y - b.y);
    let prev = -Infinity;
    order.forEach(o => { o.y = Math.max(o.y, prev + gap); prev = o.y; });
    const over = order.length ? order[order.length - 1].y - hi : 0;
    if (over > 0) {
      let p = Infinity;
      for (let j = order.length - 1; j >= 0; j--) {
        order[j].y = Math.min(order[j].y, p - gap);
        p = order[j].y;
      }
      order.forEach(o => { o.y = Math.max(o.y, lo); });
    }
    const out = ys.slice();
    order.forEach(o => { out[o.i] = o.y; });
    return out;
  }

  /* THE RIGHT GUTTER IS SIZED TO THE LABELS THAT LIVE IN IT. At 150 the
     longest name plus its percentage ran off the viewBox and "Store Credit /
     Accoun… 82%" lost the per-cent sign — nothing throws, the SVG just crops
     it, and only a screenshot shows it. The render case measures each
     label's real getBBox against this width now. */
  const OF_CHART_BOX = { w: 960, h: 264, l: 38, r: 190, t: 14, b: 30 };
  const OF_CHART_NAME_MAX = 20;

  function FeatureAdoptionChart({ rows, history, backfilled, backfillFrom }) {
    const [range, setRange] = React.useState("all");
    const [cq, setCq] = React.useState("");
    const ranges = ofChartRangeOptions(history);
    const rangeNote = ofChartRangeNote(history, ranges);
    /* AN UNAVAILABLE RANGE RESOLVES TO ALL rather than emptying the chart —
       which ranges are offered depends on how much history exists, so one
       that was pickable yesterday is not a state to get stranded in. */
    const pick = ranges.find(r => r.id === range && r.enabled) || ranges[ranges.length - 1];
    const hist = ofChartWindow(history, pick.days);
    const wrows = ofChartRows(rows, hist);
    const rankFrom = ofChartRankFrom(history);
    const plottable = ofChartOrder(wrows, rankFrom);
    const [slots, setSlots] = React.useState(() =>
      ofChartDefault(ofChartRows(rows, history), ofChartRankFrom(history)));
    const [showAll, setShowAll] = React.useState(false);
    const [hoverIdx, setHoverIdx] = React.useState(null);
    const svgRef = React.useRef(null);

    const series = ofChartSeries(wrows, slots);
    const dates = ofChartDates(series);
    const B = OF_CHART_BOX;
    const pw = B.w - B.l - B.r, ph = B.h - B.t - B.b;
    const xAt = i => dates.length > 1 ? B.l + (i / (dates.length - 1)) * pw : B.l + pw / 2;
    const yAt = v => B.t + ((100 - v) / 100) * ph;
    const idxOf = {};
    dates.forEach((d2, i) => { idxOf[d2] = i; });

    const full = ofChartCount(slots) >= OF_CHART_MAX;
    const PILLS_SHOWN = 14;
    /* THE SEARCH NARROWS THE LIST, NEVER THE CHART. Typing must not pull a
       plotted line off the axis — the reader is looking for something to ADD,
       and a series vanishing mid-keystroke is the opposite of that. So a
       selected feature is always listed whatever the search says, or its own
       pill would be the thing that disappeared and there would be no way to
       switch it off.

       A SEARCH SHOWS EVERY MATCH. The 14-pill cap exists so sixty chips do
       not bury the chart; once somebody has typed a term, the whole point is
       to see what matched, so the cap lifts. */
    const matched = cq ? plottable.filter(r => ofFeatureMatch(r, cq)) : plottable;
    const picked = new Set(slots.filter(Boolean));
    const pills = cq
      ? plottable.filter(r => picked.has(r.key) || matched.indexOf(r) >= 0)
      : (showAll ? plottable : plottable.slice(0, PILLS_SHOWN));
    const colorOf = k => { const i = slots.indexOf(k); return i < 0 ? null : OF_SERIES_COLORS[i]; };

    /* THE READER AIMS AT A DATE, NOT AT A 2px LINE — the hairline snaps to the
       nearest bake and the readout lists every series at it, so a value never
       has to be chased by landing the pointer on a stroke. */
    const onMove = (ev) => {
      const el = svgRef.current;
      if (!el || dates.length < 2) return;
      const box = el.getBoundingClientRect();
      if (!box.width) return;
      const x = ((ev.clientX - box.left) / box.width) * B.w;
      const t = (x - B.l) / (pw || 1);
      setHoverIdx(Math.max(0, Math.min(dates.length - 1, Math.round(t * (dates.length - 1)))));
    };

    const endYs = ofChartLabelY(series.map(s => yAt(s.last)), 13, B.t + 4, B.t + ph);

    return e("div", { className: "panel", "data-of-chart": series.length,
                      "data-of-chart-plottable": plottable.length },
      e("h2", null, "Adoption over time",
        e("span", { className: "hint" },
          "share of the " + (rows && rows[0] ? rows[0].liveOrgs : 0)
          + " live organizations using each feature · click a feature to add or remove its line")),

      plottable.length === 0
        /* NOT AN EMPTY AXIS. Two comparable bakes is the floor, and on the
           morning after a catalog change most features are below it — an
           empty grid with no explanation reads as a broken chart. */
        ? e("div", { className: "qvnote", "data-of-chart-empty": "nohistory" },
            "No feature has two comparable measurements yet. The nightly bake adds a point "
            + "every morning, so this fills in from tomorrow.")
        : e(React.Fragment, null,
            e("div", { className: "fchart-ranges", "data-of-chart-range": pick.id },
              e("span", { className: "fchart-rangelab" }, "Range"),
              ranges.map(r => e("button", {
                key: r.id,
                className: "qvchip fchart-range" + (r.id === pick.id ? " on" : ""),
                "data-of-chart-rangeopt": r.id,
                "data-of-chart-rangeon": r.enabled ? "1" : "0",

            .map(([label, value], i, arr) =>
              e("div", { key: label, style: { display: "flex", borderBottom: i < arr.length - 1 ? "1px solid #1e293b" : "none" } },
                e("div", { style: { width: 176, minWidth: 176, padding: "10px 14px", fontSize: 12, fontWeight: 600, color: "#64748b", textTransform: "uppercase", letterSpacing: "0.06em", borderRight: "1px solid #1e293b" } }, label),
                e("div", { style: { flex: 1, padding: "10px 14px", fontSize: 13, color: "#e2e8f0" } }, value))))),

        // ACV by pipeline stage
        e("div", null,
          e("div", { style: { fontSize: 13, fontWeight: 600, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 8, display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" } },
            "ACV by Pipeline Stage",
            e("span", { style: { fontSize: 11, fontWeight: 400, color: "#64748b", textTransform: "none", letterSpacing: 0 } },
              "follows the filters above · " + data.length + " service" + (data.length !== 1 ? "s" : "") + " · " + fmtACV(stageTotalACV) + " total")),
          e("div", { style: { background: "#1e293b", borderRadius: 12, border: "1px solid #334155", overflow: "auto" } },
            e("table", { style: { width: "100%", borderCollapse: "collapse", fontSize: 12 } },
              e("thead", null, e("tr", { style: { borderBottom: "1px solid #334155" } },
                e("th", { style: thCell("left") }, "Stage"),
                e("th", { style: thCell("right", 84) }, "Services"),
                e("th", { style: thCell("right", 96) }, "ACV"),
                e("th", { style: thCell("right", 72) }, "Share"))),
              e("tbody", null,
                stageRollup.map((r, ri) =>
                  e("tr", { key: r.stage, style: { borderBottom: "1px solid #1e293b", background: ri % 2 === 0 ? "transparent" : "rgba(255,255,255,0.02)" } },
                    e("td", { style: tdCell("left") },
                      e("div", { style: { display: "flex", alignItems: "center", gap: 7 } },
                        e("div", { style: { width: 8, height: 8, borderRadius: 2, background: r.color, flexShrink: 0 } }),
                        e("span", { style: { fontSize: 12, color: "#cbd5e1", fontWeight: 500 } }, r.stage))),
                    e("td", { style: { ...tdCell("right"), color: "#94a3b8", fontVariantNumeric: "tabular-nums" } }, r.count),
                    e("td", { style: { ...tdCell("right"), fontSize: 13, fontWeight: 700, color: r.acv ? "#34d399" : "#334155" } }, fmtACV(r.acv)),
                    e("td", { style: { ...tdCell("right"), color: "#cbd5e1", fontVariantNumeric: "tabular-nums" } }, Math.round(pctOfPipeline(r.acv)) + "%"))),
                e("tr", { style: { borderTop: "1px solid #334155", background: "rgba(255,255,255,0.03)" } },
                  e("td", { style: { ...tdCell("left"), fontSize: 11, fontWeight: 600, color: "#64748b", textTransform: "uppercase", letterSpacing: "0.06em" } }, "Total"),
                  e("td", { style: { ...tdCell("right"), color: "#e2e8f0", fontWeight: 600, fontVariantNumeric: "tabular-nums" } }, data.length),
                  e("td", { style: { ...tdCell("right"), fontSize: 13, fontWeight: 700, color: "#f8fafc" } }, fmtACV(stageTotalACV)),
                  e("td", { style: { ...tdCell("right"), color: "#94a3b8", fontWeight: 600, fontVariantNumeric: "tabular-nums" } }, stageTotalACV ? "100%" : "—")))),
            stageRollup.length === 0 ? e("div", { style: { padding: "18px 16px", textAlign: "center", color: "#64748b", fontSize: 12.5 } }, "No services match the current filters.") : null)))),

      // Tooltip
      tooltip ? e("div", { style: { position: "fixed", left: Math.min(tooltip.x + 12, window.innerWidth - 260), top: Math.max(8, tooltip.y - 160), background: "#0f172a", border: "1px solid #334155", borderRadius: 10, padding: "12px 14px", zIndex: 100, width: 250, boxShadow: "0 8px 32px rgba(0,0,0,0.5)", pointerEvents: "none" } },
        e("div", { style: { fontWeight: 600, fontSize: 13, color: "#f8fafc", marginBottom: 8, lineHeight: 1.3 } }, tooltip.row.name),
        e("div", { style: { display: "grid", gridTemplateColumns: "auto 1fr", gap: "4px 10px", fontSize: 12 } },
          [["Owner", tooltip.row.owner || "Unassigned"], ["Stage", tooltip.row.stage], ["Category", tooltip.row.category || "—"],
           ["Start", fmtDay(tooltip.row.start)], ["Reg. Launch", fmtDay(tooltip.row.regLaunch)], ["End", fmtDay(tooltip.row.end)],
           ["LOE", tooltip.row.loe || "—"], ["ACV", fmtMoney(tooltip.row.acv)], ["Status", tooltip.row.status || "—"]]
          .flatMap(([k, v]) => [
            e("span", { key: k + "k", style: { color: "#64748b" } }, k),
            e("span", { key: k + "v", style: { color: k === "Status" ? (tooltip.row.status === "On Track" ? "#10b981" : "#ef4444") : "#e2e8f0", fontWeight: k === "Status" ? 600 : 400 } }, v)]))) : null);
  }

  // ---------------- Remittance · per-org Item Log exports ----------------
  // Finance used to re-run the product's Item Log export by hand once per
  // billing period, for every org. Here: pick the ending remittance date, then
  // click any org's date to download that org's CSV.
  //
  // Downloads go through fetch rather than following the link so a slow
  // Metabase query can show a per-row "Building…" state and any error stays
  // inline — a plain <a> would navigate the dashboard away to an error page.
  // The href is still a real URL so the row is copyable / open-in-new-tab-able.
  function Remittance() {
    const [snap, setSnap] = useState(null);
    const [end, setEnd] = useState("");
    const [q, setQ] = useState("");
    const [busy, setBusy] = useState({});   // orgId → true while building
    const [errs, setErrs] = useState({});   // orgId → message
    const [sent, setSent] = useState({});   // orgId → "Sent to N · $total"
    const [loadErr, setLoadErr] = useState("");

    useEffect(() => {
      fetch("/api/remittance")
        .then(r => r.ok ? r.json() : r.json().then(d => Promise.reject(new Error(d.error || "request failed"))))
        .then(d => { setSnap(d); setEnd(d.currentPeriodEnd || (d.periods[0] && d.periods[0].end) || ""); })
        .catch(err => setLoadErr(String(err.message || err)));
    }, []);

    if (loadErr) return e("div", { className: "note", style: { color: "var(--bad)" } }, "Could not load remittance data: " + loadErr);
    if (!snap) return e("div", { className: "note" }, "Loading…");

    const period = snap.periods.find(p => p.end === end) || snap.periods[0];
    const STATUS = {
      due:  { label: "Export due", cls: "p2" },
      paid: { label: "Payment issued", cls: "pos" },
      open: { label: "Still in progress", cls: "p0" },
    };
    const st = (period && STATUS[period.status]) || STATUS.open;

    const orgs = snap.orgs.filter(o =>
      !q || (o.displayName + " " + o.name + " " + o.slug).toLowerCase().indexOf(q.toLowerCase()) !== -1);

    const reports = snap.reports || [{ key: "itemlog", label: "Item log", configured: snap.configured }];
    const unconfigured = reports.filter(r => !r.configured);

    function filenameFrom(resp) {
      const m = /filename="([^"]+)"/.exec(resp.headers.get("Content-Disposition") || "");
      return m ? m[1] : "";
    }
    // Busy/error state is keyed per org+report so the two columns don't
    // clobber each other's spinner when both are clicked.
    function cellKey(org, report) { return org.id + ":" + report.key; }

    function csvUrl(org, report) {
      return "/api/remittance/csv?org=" + encodeURIComponent(org.id)
           + "&end=" + encodeURIComponent(period.end)
           + "&report=" + encodeURIComponent(report.key);
    }

    // One implementation for every download on this page — the CSV links and
    // the workbook button. The server names the file; the fallback only covers
    // a response that arrived without a Content-Disposition.
    function pull(k, url, fallbackName) {
      if (busy[k]) return;
      setBusy(b => Object.assign({}, b, { [k]: true }));
      setErrs(x => Object.assign({}, x, { [k]: "" }));
      fetch(url)
        .then(r => r.ok ? r.blob().then(b => ({ b: b, name: filenameFrom(r) }))
                        : r.text().then(t => Promise.reject(new Error(t))))
        .then(function (out) {
          const href = URL.createObjectURL(out.b);
          const a = document.createElement("a");
          a.href = href;
          a.download = out.name || fallbackName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(href);
        })
        .catch(err => setErrs(x => Object.assign({}, x, { [k]: String(err.message || err).slice(0, 180) })))
        .then(() => setBusy(b => Object.assign({}, b, { [k]: false })));
    }

    function download(org, report) {
      if (!report.configured || !period) return;
      pull(cellKey(org, report), csvUrl(org, report),
           report.key + "-" + org.slug + "-" + period.start + "-to-" + period.end + ".csv");
    }

    function xlsxUrl(org) {
      return "/api/remittance/xlsx?org=" + encodeURIComponent(org.id)
           + "&end=" + encodeURIComponent(period.end);
    }

    // WHAT'S ON THAT ORG'S REMITTANCE — read off their own most recent sheet,
    // not off what this report can build. The two differ for eleven orgs, and
    // that is the point: a "tickets" pill beside a dashed Remittance column is
    // the reason the button isn't there.
    //
    // No pills at all means NO SHEET ON FILE, which is not the same as being on
    // the plain template — most of the fleet has never had a remittance, and
    // printing "normal" for them would be a claim the row cannot support.
    function templateCell(org) {
      const meta = snap.templateMeta || {};
      return e("td", { key: "tmpl", className: "l", "data-rm-tmpl": (org.templates || []).join("+") },
        !org.templates
          ? e("span", { className: "zero", title: "No remittance on file for this organization yet" }, "—")
          : e("span", { className: "tmpl-pills" }, org.templates.map(function (k) {
              const m = meta[k] || { label: k, title: k };
              return e("span", { key: k, className: "tmpl-pill tmpl-" + k, title: m.title }, m.label);
            })));
    }

    // Emailing builds the SAME workbook on the server and attaches it, so there
    // is nothing to download first. The confirm is not ceremony: this sends to
    // real people the moment it is clicked, and the recipients are not on screen
    // anywhere else, so the dialog is where you find out who is about to get it.
    function emailRemit(org) {
      const k = org.id + ":email";
      if (busy[k]) return;
      const who = (snap.emailTo || []).join(", ");
      if (!window.confirm(
            "Email " + org.displayName + "'s remittance for " + period.label + "?\n\n"
            + (who ? "It will be sent to: " + who : "Recipients are configured on the server.")
            + (org.remittanceDraft ? "\n\nNOTE: this organization is on DRAFT placeholder rates." : "")))
        return;
      setBusy(b => Object.assign({}, b, { [k]: true }));
      setErrs(x => Object.assign({}, x, { [k]: "" }));
      setSent(x => Object.assign({}, x, { [k]: "" }));
      fetch("/api/remittance/email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ org: org.id, end: period.end }),
      })
        .then(r => r.json().catch(() => ({ ok: false, error: "Server returned " + r.status })))
        .then(function (out) {
          if (!out.ok) throw new Error(out.error || "Send failed");
          setSent(x => Object.assign({}, x, { [k]: "Sent to " + (out.to || []).length + " · $" + out.total }));
        })
        .catch(err => setErrs(x => Object.assign({}, x, { [k]: String(err.message || err).slice(0, 180) })))
        .then(() => setBusy(b => Object.assign({}, b, { [k]: false })));
    }

    // The workbook needs the org's own fee schedule, so the buttons appear only
    // where one exists. An org without one gets a dash and a reason on hover —
    // a button that generated a remittance from guessed rates would produce a
    // plausible wrong number, which is worse than no button.
    function remitCell(org) {
      const k = org.id + ":xlsx", ek = org.id + ":email";
      return e("td", { key: "xlsx", className: "l",
                       "data-rm-org": org.slug, "data-rm": org.remittance ? "on" : "off" },
        !org.remittance || !period
          ? e("span", { className: "zero", title: "No fee schedule on file for this organization yet" }, "—")
          : e("span", { className: "rm-actions" },
              e("button", {
                className: "rm-gen" + (org.remittanceDraft ? " rm-draft" : ""),
                disabled: !!busy[k],
                onClick: () => pull(k, xlsxUrl(org),
                  "remittance-" + org.slug + "-" + period.start + "-to-" + period.end + ".xlsx"),
                title: (org.remittanceDraft ? "Draft rates — " : "")
                     + "Generate " + org.displayName + "'s remittance workbook for " + period.label
                     + " (summary + both logs)"
              }, busy[k] ? "Generating…" : "Generate remittance"),
              e("button", {
                className: "rm-email", "data-rm-email": org.slug,
                disabled: !!busy[ek] || !snap.emailReady,
                onClick: () => emailRemit(org),
                title: !snap.emailReady
                  ? "Email isn't configured on this deploy (no Resend key), so nothing would be sent"
                  : (org.remittanceDraft ? "Draft rates — " : "")
                    + "Email " + org.displayName + "'s remittance for " + period.label
                    + " to " + (snap.emailTo || []).join(", ")
              }, busy[ek] ? "Sending…" : "✉ Email")),
        sent[ek] ? e("div", { className: "rm-sent" }, sent[ek]) : null,
        errs[k] ? e("div", { style: { fontSize: 11.5, color: "var(--bad)" } }, errs[k]) : null,
        errs[ek] ? e("div", { style: { fontSize: 11.5, color: "var(--bad)" } }, errs[ek]) : null);
    }

    // One cell per report: the period's dates as a download link, with the
    // in-flight / error state underneath so it never shifts the table layout.
    function reportCell(org, report) {
      const k = cellKey(org, report);
      return e("td", { key: report.key, className: "l" },
        !report.configured || !period
          ? e("span", { className: "zero" }, period ? period.start + " → " + period.end : "—")
          : e("a", {
              href: csvUrl(org, report),
              onClick: (ev) => { ev.preventDefault(); download(org, report); },
              style: { fontWeight: 600, color: "var(--brand-2)" },
              title: "Download " + org.displayName + "'s " + report.label.toLowerCase() + " for " + period.label
            }, period.start + " → " + period.end),
        busy[k] ? e("div", { style: { fontSize: 11.5, color: "var(--muted)" } }, "Building…") : null,
        errs[k] ? e("div", { style: { fontSize: 11.5, color: "var(--bad)" } }, errs[k]) : null);
    }

    return e("div", null,
      unconfigured.length ? e("div", { className: "panel", style: { borderColor: "var(--warn-edge)", background: "var(--warn-bg)" } },
        e("div", { style: { padding: "12px 16px", fontSize: 13, color: "var(--warn-ink-2)" } },
          e("b", null, unconfigured.map(r => r.label).join(" and ") + (unconfigured.length > 1 ? " aren't" : " isn't") + " connected yet. "),
          "The shared Metabase card needs its public link enabled and its UUID set on this server. ",
          "Until then that column's dates aren't clickable.")) : null,

      e("div", { className: "cards" },
        e("div", { className: "card" },
          e("div", { className: "k" }, "Billing period"),
          e("div", { className: "v", style: { fontSize: 20 } }, period ? period.label : "—"),
          e("div", { className: "d" }, period ? period.start + " → " + period.end : "")),
        e("div", { className: "card" },
          e("div", { className: "k" }, "Rec issues payment by"),
          e("div", { className: "v", style: { fontSize: 20 } }, period && period.payBy ? fmtDay2(period.payBy) : "—"),
          period && !period.payBy
            ? e("div", { className: "d" }, "not in the schedule file yet") : null),
        e("div", { className: "card" },
          e("div", { className: "k" }, "ACH expected"),
          e("div", { className: "v", style: { fontSize: 20 } },
            period && period.achStart ? fmtDay2(period.achStart) + " – " + fmtDay2(period.achEnd) : "—")),
        e("div", { className: "card" },
          e("div", { className: "k" }, "Status"),
          e("div", { className: "v", style: { fontSize: 20 } }, e("span", { className: "pill " + st.cls }, st.label)),
          e("div", { className: "d" }, "Today is " + fmtDay2(snap.today)))),

      e("div", { className: "panel" },
        e("h2", null, "Exports by organization",
          e("span", { className: "hint" }, "click a date to download that CSV — an exact duplicate of the product's own export")),
        e("div", { className: "filters" },
          e("label", { className: "chk" }, "Remittance date",
            e("select", { value: end, onChange: ev => setEnd(ev.target.value) },
              // Newest first (server-ordered): the due period is at the top,
              // prior periods below it.
              snap.periods.map(p => e("option", { key: p.end, value: p.end },
                fmtDay2(p.end) + " · " + p.label
                  + (p.status === "due" ? "  (due)" : p.status === "open" ? "  (in progress)" : ""))))),
          e("input", { type: "text", placeholder: "Filter organizations…", value: q, onChange: ev => setQ(ev.target.value) })),
        e("div", { className: "tablewrap" },
          e("table", null,
            e("thead", null, e("tr", null,
              e("th", { className: "l" }, "Organization"),
              e("th", { className: "l" }, "Template"),
              reports.map(r => e("th", { key: r.key, className: "l" }, r.label)),
              e("th", { className: "l" }, "Remittance"))),
            e("tbody", null, orgs.map(o => e("tr", { key: o.id },
              e("td", { className: "name", title: o.name }, o.displayName),
              templateCell(o),
              reports.map(r => reportCell(o, r)),
              remitCell(o)))))),
        e("div", { style: { padding: "10px 16px", fontSize: 12, color: "var(--muted)", borderTop: "1px solid var(--line)" } },
          orgs.length + " of " + snap.orgs.length + " organizations · billing periods run 1–7, 8–15, 16–22, 23–EOM · payment and ACH dates come from the finance remittance schedule",
          e("div", { style: { marginTop: 4 } },
            "Generate remittance builds the finance workbook — summary, transaction log and item log in one file. ",
            "It needs that organization's card, cash and check rates; orgs without a schedule on file show a dash."),
          e("div", { style: { marginTop: 4 } },
            "Template is what that organization's own remittance contains: ",
            e("span", { className: "tmpl-pill tmpl-normal" }, "normal"), " card, cash and cheque · ",
            e("span", { className: "tmpl-pill tmpl-tech" }, "tech"), " a technology fee on total sales · ",
            e("span", { className: "tmpl-pill tmpl-tickets" }, "tickets"), " the Ticket & Events module · ",
            e("span", { className: "tmpl-pill tmpl-minimum" }, "min"), " a per-transaction minimum. ",
            "The last two aren't computed yet, which is why those rows have no button."))));
  }

  function fmtDay2(iso) {
    if (!iso) return "—";
    const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const p = String(iso).split("-");
    return MON[Number(p[1]) - 1] + " " + Number(p[2]) + ", " + p[0];
  }

  // ---------------- Admin · user management ----------------
  function Admin({ me }) {
    const [users, setUsers] = useState(null);
    const [err, setErr] = useState("");
    const [reset, setReset] = useState(null); // {id, name, url, minutes, copied}
    const load = () => fetch("/api/admin/users").then(r => r.json()).then(d => setUsers(d.users || []));
    useEffect(() => { load(); }, []);
    const update = (id, patch) => {
      setErr("");
      fetch("/api/admin/users/" + id, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch) })
        .then(r => r.json().then(d => { if (!r.ok) setErr(d.error || "update failed"); load(); }));
    };
    const resetPw = (u) => {
      setErr("");
      fetch("/api/admin/users/" + u.id + "/reset-password", { method: "POST" })
        .then(r => r.json().then(d => {
          if (!r.ok) { setErr(d.error || "reset failed"); return; }
          setReset({ id: u.id, name: u.name, email: u.email, url: d.resetUrl, minutes: d.expiresInMinutes, emailSent: d.emailSent, emailError: d.emailError, copied: false });
          load();
        }))
        .catch(() => setErr("network error — try again"));
    };
    const copyReset = () => {
      navigator.clipboard.writeText(reset.url).then(() => setReset({ ...reset, copied: true }));
    };
    if (!users) return e("div", { className: "note" }, "Loading…");
    return e("div", { className: "panel" },
      e("h2", null, "Users", e("span", { className: "hint" }, "admins can view everything and manage users; users can view dashboards")),
      err ? e("div", { className: "note", style: { color: "var(--bad)" } }, err) : null,
      reset ? e("div", { style: { background: "var(--good-bg-2)", border: "1px solid var(--good-edge)", borderRadius: 10, padding: "12px 14px", margin: "0 0 14px", fontSize: 13 } },
        e("div", { style: { marginBottom: 6 } }, e("b", null, "Reset link for " + reset.name),
          reset.emailSent ? " — emailed to " + reset.email + " ✓. Link below in case you'd rather send it yourself."
            : reset.emailError ? " — email failed (" + reset.emailError + "), send the link to them directly."
            : " — send it to them directly.",
          " It works once and expires in " + reset.minutes + " minutes; generating a new one replaces it."),
        e("div", { style: { display: "flex", gap: 8, alignItems: "center" } },
          e("code", { style: { flex: 1, background: "var(--card)", border: "1px solid var(--good-edge)", borderRadius: 7, padding: "6px 9px", fontSize: 11.5, overflowX: "auto", whiteSpace: "nowrap" } }, reset.url),
          e("button", { onClick: copyReset, style: { background: reset.copied ? "var(--good-ink)" : "var(--brand)", color: "var(--card)", border: "none", borderRadius: 7, padding: "6px 14px", fontSize: 12.5, fontWeight: 700, cursor: "pointer", flexShrink: 0 } }, reset.copied ? "Copied ✓" : "Copy"),
          e("button", { onClick: () => setReset(null), title: "Dismiss", style: { background: "transparent", color: "var(--muted)", border: "none", fontSize: 15, cursor: "pointer", flexShrink: 0 } }, "✕"))) : null,
      e("div", { className: "tablewrap" }, e("table", null,
        e("thead", null, e("tr", null, e("th", { className: "l" }, "Name"), e("th", { className: "l" }, "Email"), e("th", { className: "l" }, "Role"), e("th", { className: "l" }, "Status"), e("th", { className: "l" }, "Joined"), e("th", { className: "l" }, "Password"))),
        e("tbody", null, users.map(u => e("tr", { key: u.id },

          e("td", { className: "l" }, u.email),
          e("td", { className: "l" }, e("select", { value: u.role, disabled: u.id === me.id, onChange: ev => update(u.id, { role: ev.target.value }) },
            e("option", { value: "user" }, "user"), e("option", { value: "admin" }, "admin"))),
          e("td", { className: "l" }, e("label", { className: "chk" },
            e("input", { type: "checkbox", checked: u.active, disabled: u.id === me.id, onChange: ev => update(u.id, { active: ev.target.checked }) }), u.active ? "active" : "deactivated")),
          e("td", { className: "l", style: { color: "var(--muted)" } }, (u.createdAt || "").slice(0, 10)),
          e("td", { className: "l" },
            e("button", { onClick: () => resetPw(u), disabled: !u.active, title: u.active ? "Generate a one-time reset link to send to " + u.name : "Reactivate the account first",
              style: { background: u.active ? "var(--card)" : "var(--fill)", color: u.active ? "var(--brand)" : "var(--faint)", border: "1px solid " + (u.active ? "color-mix(in srgb, var(--brand) 33%, transparent)" : "var(--line)"), borderRadius: 7, padding: "4px 10px", fontSize: 12, fontWeight: 600, cursor: u.active ? "pointer" : "default" } }, "Reset password"),

  /* ── ORG FEATURES, IN THE SHELL ──────────────────────────────────────────
     Reads /api/data, the same public snapshot the standalone dashboard reads,
     so there is ONE source and the two surfaces cannot disagree about an
     adoption score. Rows expand in place rather than linking out: the whole
     point of this view is that the nav item stops throwing you out of the
     shell, and a drill-in that navigated away would reintroduce that. */
  /* ── ORG FEATURES SETTINGS ──────────────────────────────────────────────
     SHARED BY EVERY USER (Dan's call), so it lives server-side rather than in
     localStorage and the sheet says so on screen. It is a VIEW preference and
     never a gate: hiding a feature or excluding an org changes what this page
     shows and what its score is taken over, and changes nothing about the
     bake — everything hidden is still in /api/data. That is why the default
     is "show everything" and why a failed load falls back to it rather than
     to empty. Failing the other way would render an empty dashboard and look
     like the snapshot had gone. */
  const OF_DEFAULT_SETTINGS = { hiddenFeatures: [], excludedOrgs: [] };

  function Features({ slug, featureKey, featureList }) {
    const [d, setD] = useState(null);
    const [err, setErr] = useState(null);
    const [cfg, setCfg] = useState(null);        // null until the fetch settles
    const [cfgErr, setCfgErr] = useState(null);
    const [only, setOnly] = useState("");
    const [qv, setQv] = useState("");
    // [key, dir] or null. Null means "whatever the quick view or the default
    // alphabetical order says" — a header click OVERRIDES the order but never
    // the scope, so sorting inside "Top SMS users" still shows only those 20.
    const [sort, setSort] = useState(null);
    // The feature table's own sort, kept apart from the org table's: the two
    // have different columns, so one shared state would carry a key the other
    // cannot resolve and silently fall back to its default order.
    const [fsort, setFsort] = useState(null);
    // The by-feature search. Not in the URL, because nothing else on this
    // page's toolbars is either — a search that deep-linked while the sort
    // and the picker beside it did not would be one control behaving
    // differently from its neighbours for no reason a reader can see.
    const [fq, setFq] = useState("");
    const [cmpA, setCmpA] = useState("");
    const [cmpB, setCmpB] = useState("");
    const [open, setOpen] = useState(null);
    const [showSettings, setShowSettings] = useState(false);

    useEffect(() => {
      fetch("/api/data")
        .then(r => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
        .then(setD).catch(e => setErr(e.message));
      fetch("/api/org-features-settings")
        .then(r => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
        .then(x => setCfg(x))
        .catch(e => { setCfgErr(e.message); setCfg(OF_DEFAULT_SETTINGS); });
    }, []);

    if (err) return e("div", { className: "note" }, "Could not load the features snapshot: " + err);
    if (!d || !cfg) return e("div", { className: "note" }, "Loading feature adoption\u2026");

    /* THROUGH `ofDerive`, so the list, this page's drill-in and the printed
       report cannot disagree about a score or about which features are
       tracked. Excluded orgs leave EVERY surface — the table, the pulldown,
       both compare slots, the fleet average and the count — because they
       leave `all` here, once. */
    const dv = ofDerive(d, cfg);
    const { hidden, excluded, total, byKey, label, allMeasured, shown,
            adoptedIn, scoreOf, orgName, everyOrg, all, groups,
            notUsing, detailOf, trendOf } = dv;

    const adminLink = (o) => {
      const href = ofRecAdminUrl(o.id);
      return href ? e("a", { className: "adminlink", href, target: "_blank", rel: "noopener",
                             title: "Open " + orgName(o) + " in the Rec admin",
                             // The row itself navigates to the drill-in, so a
                             // click on the link must not do both.
                             onClick: ev => ev.stopPropagation() }, "admin \u2197") : null;
    };

    const decorate = o => ({ o, score: scoreOf(o.slug), usage: (d.usage || {})[o.slug] || {} });
    const countOf = (s2, k) => Number((((d.adoption || {})[s2] || {})[k] || {}).count || 0);

    /* THE QUICK VIEW IS APPLIED TO `all`, which is already settings-scoped,
       so no view can widen the page past an excluded org. The default order
       stays ALPHABETICAL — a quick view re-sorts, it does not redefine how
       the list opens. */
    /* HOW MANY ORGANIZATIONS USE EACH TRACKED FEATURE, over `all` and so
       already settings-scoped. It is the number the picker puts in every
       option label, and the same reducer feeds the per-feature page below —
       an option promising "20 orgs" and a page then listing 18 is two
       surfaces disagreeing on one click. */
    const featureOrgs = {};
    shown.forEach(k => { featureOrgs[k] = all.filter(o => adoptedIn(o.slug, k)).length; });

    const view = ofQuickView(qv, label);
    /* ONE STATE, TWO REFLECTIONS. A chip and the picker can both name the
       same feature, so whichever set it, BOTH show it selected. That is not
       the two-controls-one-state trap the chips' own comment warns about —
       that is about two controls each able to set a different half of the
       state. Here there is one active view and it is simply shown twice;
       leaving the picker blank while an SMS chip is lit would be the surface
       lying about its own scope. */
    const activeFeature = view && view.kind === "feature" ? view.key : null;
    const qvOut = ofApplyQuickView(view, all.filter(o => !only || o.slug === only).map(decorate), countOf);

    /* A HEADER CLICK OVERRIDES THE ORDER, NOT THE SCOPE. Sorting inside "Top
       SMS users" re-orders those 20 orgs; it does not bring the other 124
       back. The quick view is applied first and this re-sorts its output. */
    const groupPct = (r, cat) => {
      const g = groups.find(x => x.cat === cat);
      const gs = g && ofGroupScore(g.keys, k => adoptedIn(r.o.slug, k));
      return gs ? gs.pct : null;
    };
    const sortVal = (r, key) =>
      key === "name" ? (r.o.displayName || r.o.name || r.o.slug)
      : key === "score" ? r.score
      : groupPct(r, key);
    const numericCol = (key) => key !== "name";
    const rows = sort
      ? ofSortRows(qvOut.rows, sort[0], sort[1], sortVal, numericCol(sort[0]))
      : qvOut.rows;

    /* One header renderer for all fourteen columns, so the arrow and the
       click cannot drift apart — the same idiom the Account Health table
       already uses, and deliberately identical so the two tables behave the
       same way under a click. */
    const sortTh = (label, key, extra) => e("th", Object.assign({
      onClick: () => setSort(s2 => [key, s2 && s2[0] === key ? -s2[1] : ofFirstDir(numericCol(key))]),
      style: { cursor: "pointer" },
      "data-feat-th": key,
      "data-feat-thdir": sort && sort[0] === key ? (sort[1] < 0 ? "desc" : "asc") : "",
    }, extra || {}), label + (sort && sort[0] === key ? (sort[1] < 0 ? " \u2193" : " \u2191") : ""));

    /* A CHIP WITH NOTHING BEHIND IT IS NOT OFFERED, and one whose feature the
       settings have hidden is not either — the settings scope this page, so a
       chip for an untracked feature would rank orgs on something the score
       ignores. Counts come from the same reducer that does the filtering, or
       the chip promises a number the click does not deliver. */
    const qvChips = OF_QUICK_VIEWS
      .filter(v => v.kind !== "feature" || shown.indexOf(v.key) >= 0)
      .map(v => ({ v, n: ofApplyQuickView(v, all.map(decorate), countOf).total }))
      .filter(x => x.n > 0);

    const scoredAll = all.map(decorate).filter(r => r.score != null);
    const avg = scoredAll.length
      ? Math.round(scoredAll.reduce((s, r) => s + r.score, 0) / scoredAll.length) : null;
    const launched = all.filter(o => o.launched).length;

    const metrics = (d.coreMetrics || []).filter(m => m.key || m.id)
      .map(m => ({ key: m.key || m.id, label: m.label || m.key, icon: m.icon || "", description: m.description || "" }));
    const metricKeys = metrics.map(m => m.key);

    const maxes = window.RecPills.columnMaxes(all.map(decorate), metricKeys, (r, k) => r.usage[k]);
    const pill = (r, k) => e("span", { className: "pill mpill", style: window.RecPills.heat(
      r.usage[k] == null ? null : Number(r.usage[k]), maxes[k]) },
      window.RecPills.fmtNum(r.usage[k] == null ? null : Number(r.usage[k])));

    const scoreCell = r => e("td", { className: "num", "data-feat-score": r.score == null ? "" : r.score },
      r.score == null
        ? e("span", { className: "zero" }, "not measured")

            e(Grade, { pct: r.score }),
            e("b", { style: { color: ofGradeColor(r.score) } }, r.score + "%")));

    const launchTag = o => o.launched
      ? e("span", { className: "chip", style: { background: "var(--good-bg)", borderColor: "var(--good-edge)", color: "var(--good-ink)" } }, "live")
      : e("span", { className: "chip", title: "Not yet live on rec.us" }, "pre-launch");

    const orgOptions = all.map(o => e("option", { key: o.slug, value: o.slug }, orgName(o)));

    /* ── THE DRILL-IN ─────────────────────────────────────────────────────
       Rendered by the SAME component as the list, on purpose. A separate
       top-level component would fetch the snapshot again and resolve the
       settings again, and the two copies would disagree about the tracked
       set the first time either changed — the one-reducer-N-readers rule
       this page already follows for the score. It also keeps the shell: the
       sidebar stays, and the breadcrumb goes back without a page load. */
    if (slug) {
      const o = everyOrg.find(x => x.slug === slug);
      const crumb = e("div", { className: "crumb", "data-feat-crumb": 1 },
        link("/ps/features", "Org Features"), " / ",

      if (!o) {

      const oMiss = notUsing(o.slug);
      const oUsage = (d.usage || {})[o.slug] || {};

        e("div", { className: "org-h" },
          e("h2", null, orgName(o)), launchTag(o), adminLink(o),
          e("div", { className: "links" }, o.slug)),

        /* EXCLUDED IS NEVER HIDDEN, and a deep link to an excluded org still

           than pretending not to exist. */
        excluded.has(o.slug) ? e("div", { className: "note", "data-feat-exclnote": 1,
            style: { color: "var(--warn-ink)", fontWeight: 600 } },
          "⚠ This organization is excluded in the settings, so it is not in the list or the fleet average.") : null,

        e("div", { className: "cards" },
          e("div", { className: "card" }, e("div", { className: "k" }, "Adoption"),
            e("div", { className: "v", "data-feat-orgscore": oScore == null ? "" : oScore,
                       style: { color: ofGradeColor(oScore) } },
              oScore == null ? "not measured" : oScore + "%"),
            oScore == null ? null : e("div", { className: "gradeline" },
              e(Grade, { pct: oScore, size: "lg", showSays: true })),
            e("div", { className: "d" }, (shown.length - oMiss.length) + " of " + shown.length + " tracked features")),
          /* THE CORE COUNTS LIVE HERE NOW. They came off the list because

          metrics.map(m => e("div", { className: "card", key: m.key },
            e("div", { className: "k" }, m.icon + " " + m.label),
            e("div", { className: "v", style: { fontSize: 20 } },
              window.RecPills.fmtNum(oUsage[m.key] == null ? null : Number(oUsage[m.key]))),
            e("div", { className: "d" }, m.description)))),

        /* THE GAPS LEAD. Dan: "Callout what the org is NOT using
           specifically." On a page about one account the unused list is the
           thing to act on, so it sits above the per-category detail rather
           than being assembled from it. */
        e("div", { className: "panel", "data-feat-gaps": oMiss.length },
          e("h2", null, oMiss.length ? "Not using — " + oMiss.length + " of " + shown.length + " tracked features"
                                     : "Using every tracked feature",
            e("span", { className: "hint" }, oMiss.length ? "the specific gaps, by group" : "nothing tracked is unused here")),
          oMiss.length
            ? e("div", { className: "gapwrap" }, groups.map(g => {
                const gm = g.keys.filter(k => !adoptedIn(o.slug, k));
                if (!gm.length) return null;
                return e("div", { key: g.cat, className: "gapgrp" },
                  e("div", { className: "gaphead" }, catShort(g.cat),
                    e("span", { className: "gapn" }, gm.length + "/" + g.keys.length)),
                  gm.map(k => e("div", { key: k, className: "gapitem",

          oMiss.length ? e("div", { className: "gapclear" },
            (() => {
              const clear = groups.filter(g => g.keys.every(k => adoptedIn(o.slug, k))).map(g => catShort(g.cat));

        /* EVERY CATEGORY, USED AND UNUSED, with the measured figure beside

        groups.map(g => {
          const gs = ofGroupScore(g.keys, k => adoptedIn(o.slug, k));
