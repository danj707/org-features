                      e("span", { className: "catdetail" }, detailOf(o.slug, k) || "in use")))
                  : e("div", { className: "catnone" }, "Nothing in this group yet.")),
              e("div", null,
                e("div", { className: "catlab off" }, "Not in use (" + unused.length + ")"),
                unused.length
                  /* THE DESCRIPTION IS ON SCREEN, not in a title attribute.
                     Dan, on the Apex page: "unclear on some of these features
                     like 'guest participation' and 'instructor
                     certifications'" — and both were in the not-in-use list.
                     A gap you cannot name is not an actionable gap, and the
                     catalog already carries a one-line answer for all 57
                     (median 78 characters). It goes on the NOT-IN-USE side
                     only: an in-use row already explains itself with its
                     measured figure, and a second line on all 56 rows would
                     double the length of the page. */
                  ? unused.map(k => e("div", { key: k, className: "catrow off" },
                      e("div", null,
                        e("span", { className: "catname" }, label(k)),
                        (byKey[k] && byKey[k].description)
                          ? e("div", { className: "catdesc" }, byKey[k].description)
                          : null)))
                  : e("div", { className: "catnone" }, "All of it is in use."))));
        }),

        showSettings ? e(FeatureSettings, {
          data: d, cfg,
          onClose: () => setShowSettings(false),
          onSaved: (next) => { setCfg(next); setCfgErr(null); setShowSettings(false); },
        }) : null);
    }

    /* ── THE OTHER SLICE: ONE ROW PER FEATURE ─────────────────────────────
       Everything else on this page asks "how much of the platform does this
       org use". This asks "how far has this feature spread", which is the
       same dataset transposed and a genuinely different question — a feature
       at 25% and an org at 25% are not comparable facts, which is why the
       grade comes off its own ramp.

       SAME COMPONENT AGAIN, so the tracked set, the exclusions and the
       snapshot are resolved once. */
    if (featureList) {
      const fall = ofFeatureRows(d, dv);
      /* THE SEARCH NARROWS THE TABLE AND NOTHING ELSE. The KPI row above it
         keeps describing the whole tracked set — a median that moved as you
         typed would be a different statistic every keystroke, and "median
         adoption 25%" over one matching row is not a median of anything. */
      const frows = fq ? fall.filter(r => ofFeatureMatch(r, fq)) : fall;
      /* DEFAULT ORDER IS MOST-ADOPTED FIRST. Alphabetical is right for the
         org table, where the reader is looking someone up; here nobody
         arrives looking for "Gift Cards", they arrive asking what is and is
         not landing. */
      const fsortVal = (r, k) => k === "name" ? r.name : k === "cat" ? r.cat
        : k === "trend" ? (r.trend && r.trend.ready ? r.trend.delta : null)
        : r[k];
      const fnumeric = (k) => k !== "name" && k !== "cat";
      const fsorted = ofSortRows(frows, fsort ? fsort[0] : "pct", fsort ? fsort[1] : -1,
                                 fsortVal, fnumeric(fsort ? fsort[0] : "pct"), r => r.name);
      const fth = (label2, key, extra) => e("th", Object.assign({
        onClick: () => setFsort(x => [key, x && x[0] === key ? -x[1] : ofFirstDir(fnumeric(key))]),
        style: { cursor: "pointer" },
        "data-feat-fth": key,
        "data-feat-fthdir": fsort && fsort[0] === key ? (fsort[1] < 0 ? "desc" : "asc") : "",
      }, extra || {}), label2 + (fsort && fsort[0] === key ? (fsort[1] < 0 ? " \u2193" : " \u2191") : ""));

      const pcts = fall.map(r => r.pct).filter(x => x != null).sort((x, y) => x - y);
      const median = pcts.length
        ? (pcts.length % 2 ? pcts[(pcts.length - 1) / 2]
           : Math.round((pcts[pcts.length / 2 - 1] + pcts[pcts.length / 2]) / 2))
        : null;
      const moving = fall.filter(r => r.trend && r.trend.ready && r.trend.delta !== 0);
      const up = moving.filter(r => r.trend.delta > 0).length;
      const down = moving.filter(r => r.trend.delta < 0).length;
      /* HOW MANY ROWS CAN EVEN HAVE A TREND, stated rather than left to be
         inferred from a column of dots. A feature measured for the first time
         today has no history, and "0 moving" over 57 features reads as a dead
         platform when the truth is that the series has just started. */
      const trendable = fall.filter(r => r.trend && r.trend.ready).length;

      return e("div", null,
        e(SliceTabs, { page: "featurelist" }),
        e(AsOf, { generatedAt: d.generatedAt,
          note: "Adoption is the share of the " + (fall[0] ? fall[0].liveOrgs : 0)
              + " organizations live on rec.us \u2014 pre-launch orgs have configured almost "
              + "nothing, and counting them makes every feature look unpopular" }),

        e("div", { className: "cards" },
          e("div", { className: "card ringcard", "data-feat-fcount": fall.length,
                     title: "Features this page is counting, after the settings" },
            e(Ring, { pct: allMeasured.length ? (shown.length / allMeasured.length) * 100 : null,
                      color: "var(--brand)", label: "Features tracked: " + fall.length }),
            e("div", { className: "ringtext" },
              e("div", { className: "k" }, "Features tracked"),
              e("div", { className: "v" }, fall.length),
              e("div", { className: "d" }, hidden.size ? hidden.size + " hidden by settings"
                                                       : allMeasured.length + " of " + total + " in the catalog"))),
          e("div", { className: "card ringcard", "data-feat-fmedian": median == null ? "" : median,
                     title: "The middle feature's reach across live organizations" },
            e(Ring, { pct: median, color: median == null ? null : ofFeatureGradeColor(median),
                      label: "Median adoption: " + (median == null ? "not measured" : median + "%") }),
            e("div", { className: "ringtext" },
              e("div", { className: "k" }, "Median adoption"),
              e("div", { className: "v" }, median == null ? "\u2014" : median + "%"),
              e("div", { className: "d" }, "half of the tracked features reach more than this"))),
          e("div", { className: "card", "data-feat-fmoving": up + "/" + down,
                     title: "Features whose share of live organizations has moved since the first comparable bake" },
            e("div", { className: "k" }, "Moving"),
            e("div", { className: "v" },
              e("span", { style: { color: "var(--good-ink-2)" } }, "\u25b2 " + up),
              e("span", { style: { color: "var(--faint)", fontWeight: 400 } }, "  \u00b7  "),
              e("span", { style: { color: up || down ? "var(--bad)" : "var(--faint)" } }, "\u25bc " + down)),
            e("div", { className: "d" }, trendable
              ? trendable + " of " + fall.length + " have enough history to say"
              : "no feature has two comparable measurements yet"))),

        (excluded.size || hidden.size) ? e("div", { className: "note", "data-feat-fscopenote": 1 },
          "Scoped by settings: " +
          [hidden.size ? hidden.size + " feature" + (hidden.size === 1 ? "" : "s") + " hidden" : null,
           excluded.size ? excluded.size + " organization" + (excluded.size === 1 ? "" : "s") + " excluded" : null]
            .filter(Boolean).join(" \u00b7 ") +
          ". An excluded organization leaves the denominator too, so these shares are not "
          + "comparable with a differently-scoped view.") : null,

        /* ABOVE THE TABLE IT PLOTS, and below the Moving card it expands —
           the chart's pills and the table's rows are the same population, so
           a reader who spots a line climbing scrolls straight to the row. */
        e(FeatureAdoptionChart, { rows: fall, history: dv.history,
                                  backfilled: dv.backfilled, backfillFrom: dv.backfillFrom }),

        e("div", { className: "panel" },
          e("h2", null, "Feature adoption across the fleet",
            e("span", { className: "hint" }, "click a column to sort \u00b7 click a row for the organizations behind it"),
            e("button", { onClick: () => setShowSettings(true), "data-feat-gear": 1,
                          title: "Choose which features and organizations this page counts",
                          style: { float: "right", marginTop: -2 } }, "\u2699")),
          e("div", { className: "filters" },
            e("input", { type: "text", value: fq, "data-feat-fq": fq,
              placeholder: "Search features \u2014 name, category or description\u2026",
              onChange: ev => setFq(ev.target.value) }),
            fq ? e("button", { onClick: () => setFq(""), "data-feat-fqclear": 1 }, "Clear") : null),
          /* WHAT THE SEARCH DID, stated. A table that silently went from 60
             rows to 1 looks like a broken page, and a reader who cannot see
             that the list is narrowed reads a match count as the fleet. */
          fq ? e("div", { className: "qvnote", "data-feat-fqnote": frows.length },
            e("b", null, "Search \u201c" + fq + "\u201d"), " \u00b7 ",
            frows.length + " of " + fall.length + " feature" + (fall.length === 1 ? "" : "s"),
            " \u00b7 matched on name, key, category and description \u00b7 ",
            e("a", { href: "#", onClick: ev => { ev.preventDefault(); setFq(""); } },
              "clear and go back to all " + fall.length)) : null,
          e("div", { className: "tablewrap stickywrap" },
            e("table", { className: "feattable" },
              e("thead", null, e("tr", null,
                fth("Feature", "name", { className: "l" }),
                fth("Adoption", "pct"),
                fth("Trend", "trend", { className: "trend" }),
                fth("Live orgs", "live"),
                fth("All orgs", "all"))),
              e("tbody", null, fsorted.map(r =>
                e("tr", { key: r.key, "data-feat-frow": r.key, style: { cursor: "pointer" },
                          onClick: () => nav("/ps/feature/" + encodeURIComponent(r.key)) },
                  e("td", { className: "l" },
                    e("b", null, r.name),
                    e("div", { className: "subslug" }, catShort(r.cat))),
                  e("td", { className: "num", "data-feat-adopt": r.pct == null ? "" : r.pct },
                    r.pct == null
                      ? e("span", { className: "zero" }, "no live orgs in view")
                      : e("span", { className: "scorecell" },
                          e(Grade, { pct: r.pct, ramp: "feature" }),
                          e("b", { style: { color: ofFeatureGradeColor(r.pct) } }, r.pct + "%"))),
                  e("td", { className: "trend" },
                    e(TrendCell, { t: r.trend,
                      /* THE REASON THIS ROW HAS NO LINE, in its own words. A
                         feature measured for the first time today genuinely
                         has no history, and the org trend's explanation
                         ("a different feature set") would send the reader
                         looking for a setting that is not the cause. */
                      why: "Not enough history for this feature yet. It is plotted only from "
                         + "bakes that measured it AND recorded a live-organization count, "
                         + "so a newly-added feature starts its series on the next bake." })),
                  e("td", { className: "num", "data-feat-flive": r.live },
                    e("span", { className: "pill gpill", style: ofRatioHeat(r.pct) },
                      r.live + "/" + r.liveOrgs)),
                  e("td", { className: "num", "data-feat-fall": r.all },
                    e("span", { className: "pill gpill", style: ofRatioHeat(r.pctAll) },
                      r.all + "/" + r.allOrgs))))))),
          frows.length ? null : e("div", { className: "note", "data-feat-fempty": fq || "none" },
            /* TWO DIFFERENT EMPTIES. "Nothing matches your search" and "the
               settings have hidden everything" have different fixes, and one
               message for both sends the reader to the wrong control. */
            fq ? e("span", null, "No feature matches \u201c", e("b", null, fq), "\u201d. ",
                   e("a", { href: "#", onClick: ev => { ev.preventDefault(); setFq(""); } },
                     "Clear the search"), " to see all " + fall.length + ".")
               : "Every measured feature is hidden by the settings, so there is nothing to rank.")),

        showSettings ? e(FeatureSettings, {
          data: d, cfg,
          onClose: () => setShowSettings(false),
          onSaved: (next) => { setCfg(next); setCfgErr(null); setShowSettings(false); },
        }) : null);
    }

    /* ── ONE FEATURE, EVERY ORGANIZATION ──────────────────────────────────
       The inverse of the drill-in above, and the half this page could not do
       at all until now: the table answers "what does this org use", and
       nothing answered "who uses this feature".

       SAME COMPONENT AGAIN, for the same reason the org drill-in is — one
       fetch, one settings resolution, one derived set. Two top-level
       components would each resolve the tracked set and would disagree about
       it the first time either changed.

       THE "NOT USING" LIST IS THE POINT. A count of users is a fact; the
       organizations that have not turned it on are the work, which is why
       they get their own panel and are split live from pre-launch — a
       pre-launch org has not configured anything yet, so folding it into an
       action list makes half the fleet look like a gap. */
    if (featureKey) {
      const f = byKey[featureKey];
      const fname = (f && (f.name || f.label)) || featureKey;
      const crumb = e("div", { className: "crumb", "data-feat-fcrumb": featureKey },
        link("/ps/features", "Org Features"), " / ", e("b", null, fname));
      if (!f) {
        return e("div", null, crumb,
          e("div", { className: "note" },
            "No feature with the key \u201c" + featureKey + "\u201d is in this catalog. ",
            "It may have been renamed, or the link predates it."));
      }

      const measuredHere = allMeasured.indexOf(featureKey) >= 0;
      const users = all.filter(o => adoptedIn(o.slug, featureKey)).map(decorate)
        .sort((x, y) => countOf(y.o.slug, featureKey) - countOf(x.o.slug, featureKey)
          // Name as the tie-break, so two loads of one page cannot disagree.
          || orgName(x.o).localeCompare(orgName(y.o)));
      const missLive = all.filter(o => o.launched && !adoptedIn(o.slug, featureKey));
      const missPre = all.filter(o => !o.launched && !adoptedIn(o.slug, featureKey));
      /* THROUGH `ofFleetUse`, which is the one definition of "live
         organizations using X" — the same number the printed report and any
         future ranking must read, and it was computed by nothing until now. */
      const fleet = ofFleetUse(d, dv, [featureKey]);
      const liveUsing = fleet.used[featureKey] || 0;
      const preOrgs = all.length - fleet.liveOrgs;
      const preUsing = users.length - liveUsing;
      const livePct = fleet.liveOrgs ? Math.round((liveUsing / fleet.liveOrgs) * 100) : null;
      const orgLink = (o) => link("/ps/features/" + encodeURIComponent(o.slug), orgName(o), "fnotorg");

      return e("div", null, crumb,
        e("div", { className: "org-h" },
          e("h2", null, fname),
          e("span", { className: "chip" }, f.category || "Uncategorised"),
          e("div", { className: "links" },
            link("/ps/features", "\u2190 back to all organizations"))),

        /* A FEATURE THE SETTINGS HAVE HIDDEN IS STILL REACHABLE — the same
           rule the excluded-org drill-in follows. It says why it is missing
           from the list rather than pretending not to exist, because the
           link may be one somebody was sent. */
        hidden.has(featureKey) ? e("div", { className: "note", "data-feat-fhidden": 1,
            style: { color: "var(--warn-ink)", fontWeight: 600 } },
          "\u26a0 This feature is hidden in the settings, so it is not counted in any adoption score. "
          + "The figures below are unaffected \u2014 they are about this feature alone.") : null,
        measuredHere ? null : e("div", { className: "note", "data-feat-funmeasured": 1,
            style: { color: "var(--warn-ink)", fontWeight: 600 } },
          "\u26a0 This feature is in the catalog but is NOT measured, so nobody can be shown as using it. "
          + (f.not_measurable || "")),

        e("div", { className: "cards" },
          e("div", { className: "card ringcard", "data-feat-fusers": users.length,
                     title: "Organizations in this view that have this feature configured or in use" },
            e(Ring, { pct: all.length ? (users.length / all.length) * 100 : null, color: "var(--brand-2)",
                      label: "Using it: " + users.length }),
            e("div", { className: "ringtext" },
              e("div", { className: "k" }, "Using it"),
              e("div", { className: "v" }, users.length),
              e("div", { className: "d" }, "of " + all.length + " organizations"))),
          /* LIVE IS ITS OWN CARD, and it is the one worth quoting. Half the
             fleet is mid-setup and has configured almost nothing, so a
             fleet-wide share makes every feature look unpopular — "62 of 73
             live organizations use this" is the sentence a Director cannot
             wave away. */
          e("div", { className: "card ringcard", "data-feat-flive": liveUsing,
                     title: "Organizations live on rec.us that use it \u2014 the honest denominator" },
            e(Ring, { pct: fleet.liveOrgs ? (liveUsing / fleet.liveOrgs) * 100 : null, color: "var(--brand)",
                      label: "Live orgs using it: " + liveUsing }),
            e("div", { className: "ringtext" },
              e("div", { className: "k" }, "Live on rec.us"),
              /* THE HEADLINE SHARE WEARS THE GRADE AND THE TREND, because
                 this is the same number the by-feature table ranks on and a
                 drill-in that states it differently from the list it was
                 opened from is two surfaces disagreeing on one click. */
              e("div", { className: "v" }, liveUsing,
                fleet.liveOrgs ? e("span", { style: { fontSize: 15, color: "var(--faint)", fontWeight: 600 } },
                  " \u00b7 " + livePct + "%") : null),
              fleet.liveOrgs ? e("div", { className: "gradeline" },
                e(Grade, { pct: livePct, ramp: "feature", size: "lg", showSays: true })) : null,
              e("div", { className: "d" }, "of " + fleet.liveOrgs + " live organizations"),
              e("div", { className: "d" },
                e(TrendCell, { t: ofFeatureTrend(dv.history, featureKey),
                  why: "Not enough history for this feature yet \u2014 it is plotted only from "
                     + "bakes that measured it AND recorded a live-organization count." })))),
          e("div", { className: "card ringcard", "data-feat-preusing": preUsing,
                     title: "Organizations not yet live that have already configured it" },
            e(Ring, { pct: preOrgs ? (preUsing / preOrgs) * 100 : null, color: "var(--faint)",
                      label: "Pre-launch orgs using it: " + preUsing }),
            e("div", { className: "ringtext" },
              e("div", { className: "k" }, "Pre-launch"),
              e("div", { className: "v" }, preUsing),
              e("div", { className: "d" }, "of " + preOrgs + " not yet live")))),

        /* WHAT THE NUMBER ACTUALLY COUNTS, on the page rather than in the
           SQL. Every figure above rests on one filter, and this project has
           already measured four different wrong ways to count this one; a
           reader who cannot see the definition has to take the count on
           trust. The catalog carries all of it, so nothing here is written
           twice. */
        e("div", { className: "panel", "data-feat-fabout": featureKey },
          e("h2", null, "What this measures"),
          e("div", { className: "fabout" },
            f.description ? e("p", { className: "fdesc" }, f.description) : null,
            f.why ? e("p", { className: "fwhy" }, e("b", null, "Why it matters. "), f.why) : null,
            f.adoption_definition ? e("div", { className: "fdef" },
              e("div", { className: "flab" }, "How adoption is counted"),
              e("div", null, f.adoption_definition)) : null,
            f.signal ? e("div", { className: "fdef" },
              e("div", { className: "flab" }, "Where the number comes from"),
              e("code", { className: "fsig" }, f.signal)) : null)),

        e("div", { className: "panel" },
          e("h2", null, "Using it",
            e("span", { className: "hint" },
              users.length ? "busiest first \u00b7 click a row for that organization" : "nobody yet")),
          users.length
            ? e("div", { className: "tablewrap" },
                e("table", { className: "feattable" },
                  e("thead", null, e("tr", null,
                    e("th", { className: "l" }, "Organization"),
                    e("th", { className: "l" }, "Measured"),
                    e("th", null, "Adoption"))),
                  e("tbody", null, users.map(r =>
                    e("tr", { key: r.o.slug, "data-feat-fuser": r.o.slug, style: { cursor: "pointer" },
                              onClick: () => nav("/ps/features/" + encodeURIComponent(r.o.slug)) },
                      e("td", { className: "l" },
                        e("b", null, orgName(r.o)), " ", launchTag(r.o), " ", adminLink(r.o),
                        e("div", { className: "subslug" }, r.o.slug)),
                      /* THE SNAPSHOT'S OWN SENTENCE, not a number re-phrased
                         here. The bake already decided how this metric reads
                         ("3 calendars synced"), and a second wording is how
                         two surfaces start describing one figure differently. */
                      e("td", { className: "l", "data-feat-fdetail": countOf(r.o.slug, featureKey) },
                        detailOf(r.o.slug, featureKey) || "in use"),
                      scoreCell(r))))))
            : e("div", { className: "note" },
                "No organization in this view uses " + fname + " yet."),
        ),

        /* THE ACTION LIST. Live organizations first and on their own, because
           "this org is live and does not have it" is a conversation and "this
           org has not opened yet" is not. */
        e("div", { className: "panel", "data-feat-fmiss": missLive.length + missPre.length },
          e("h2", null, "Not using it",
            e("span", { className: "hint" },
              missLive.length + " live \u00b7 " + missPre.length + " pre-launch")),
          e("div", { className: "fnot" },
            e("div", { className: "flab" }, "Live on rec.us \u2014 " + missLive.length),
            missLive.length
              ? e("div", { className: "fnotwrap", "data-feat-fmisslive": missLive.length },
                  missLive.map(o => e(React.Fragment, { key: o.slug }, orgLink(o))))
              : e("div", { className: "catnone" }, "Every live organization uses it."),
            e("div", { className: "flab", style: { marginTop: 12 } }, "Pre-launch \u2014 " + missPre.length),
            missPre.length
              ? e("div", { className: "fnotwrap", "data-feat-fmisspre": missPre.length },
                  missPre.map(o => e(React.Fragment, { key: o.slug }, orgLink(o))))
              : e("div", { className: "catnone" }, "Every pre-launch organization has already configured it."))),

        showSettings ? e(FeatureSettings, {
          data: d, cfg,
          onClose: () => setShowSettings(false),
          onSaved: (next) => { setCfg(next); setCfgErr(null); setShowSettings(false); },
        }) : null);
    }

    const a = cmpA ? all.find(o => o.slug === cmpA) : null;
    const b = cmpB ? all.find(o => o.slug === cmpB) : null;
    const A = a ? decorate(a) : null, B = b ? decorate(b) : null;
    const gap = (x, y) => shown.filter(k => adoptedIn(x.slug, k) && !adoptedIn(y.slug, k)).map(label);

    return e("div", null,
      /* WHEN THIS DATA IS FROM, stated on the page rather than inferred.
         The sidebar's snapshot line describes the PS/bugs snapshot, which is
         a DIFFERENT file on a different schedule — reading it here and
         assuming it covered these numbers is exactly how the features
         snapshot sat 16 days stale without anyone noticing. It reads the
         features snapshot's own `generatedAt`, and it states the AGE
         (measured) rather than claiming "refreshed daily" (a standing
         promise this project has already broken once). */
      /* BOTH WAYS. The strip was on the by-feature page alone at first, which
         left that slice reachable only by someone who already knew the URL —
         a one-way door, and the spec named it as one. */
      e(SliceTabs, { page: "features" }),
      e(AsOf, { generatedAt: d.generatedAt }),

      e("div", { className: "cards" },
        e("div", { className: "card ringcard", "data-feat-orgs": all.length,
                   title: "Organizations in this view, and how many are live on rec.us" },
          e(Ring, { pct: all.length ? (launched / all.length) * 100 : null,
                    color: "var(--brand-2)", label: "Organizations: " + all.length }),
          e("div", { className: "ringtext" },
            e("div", { className: "k" }, "Organizations"),
            e("div", { className: "v" }, all.length),
            e("div", { className: "d" }, launched + " live on rec.us \u00b7 " + (all.length - launched) + " pre-launch"))),
        /* RENAMED from "Fleet adoption" at Dan's request. */
        e("div", { className: "card ringcard", "data-feat-avg": avg == null ? "" : avg,
                   title: "The average adoption score across every scored organization in this view" },
          /* NO LETTER ON THE FLEET CARD, deliberately. A grade is a judgement
             about ONE organization; the fleet mean folds in 71 pre-launch orgs
             mid-setup, so grading it grades who happens to be onboarding this
             month rather than anything anyone can act on. */
          e(Ring, { pct: avg, color: avg == null ? null : ofGradeColor(avg),
                    label: "Feature Adoption: " + (avg == null ? "not measured" : avg + "%") }),
          e("div", { className: "ringtext" },
            e("div", { className: "k" }, "Feature Adoption"),
            e("div", { className: "v" }, avg == null ? "\u2014" : avg + "%"),
            e("div", { className: "d" }, scoredAll.length + " of " + all.length + " scored"))),
        e("div", { className: "card ringcard", "data-feat-shown": shown.length,
                   title: "How many of the measured features this page is counting" },
          e(Ring, { pct: allMeasured.length ? (shown.length / allMeasured.length) * 100 : null,
                    color: "var(--brand)", label: "Features tracked: " + shown.length + " of " + allMeasured.length }),
          e("div", { className: "ringtext" },
            e("div", { className: "k" }, "Features tracked"),
            e("div", { className: "v" }, shown.length + " / " + allMeasured.length),
          /* THE DENOMINATOR IS THE SCORE, so it is stated. A reader comparing
             86% today against 60% later needs to know whether the set moved. */
            e("div", { className: "d" },
              hidden.size
                ? hidden.size + " hidden by settings \u00b7 " + allMeasured.length + " of " + total + " measurable"
                : allMeasured.length + " of " + total + " catalog features measured")))),

      // EXCLUSIONS ARE NAMED, NEVER SILENT. A count that quietly drops orgs
      // is how a fleet figure stops being trusted.
      (excluded.size || hidden.size) ? e("div", { className: "note", "data-feat-scopenote": 1 },
        "Scoped by settings: " +
        [hidden.size ? hidden.size + " feature" + (hidden.size === 1 ? "" : "s") + " hidden" : null,
         excluded.size ? excluded.size + " organization" + (excluded.size === 1 ? "" : "s") + " excluded" : null]
          .filter(Boolean).join(" \u00b7 ") +
        ". Adoption scores are taken over the " + shown.length + " tracked feature" + (shown.length === 1 ? "" : "s") +
        ", so they are not comparable with a differently-scoped view. Nothing is deleted \u2014 changing the settings brings it all back.") : null,
      cfgErr ? e("div", { className: "note", style: { color: "var(--warn-ink)" } },
        "\u26a0 Settings could not be loaded (" + cfgErr + "), so nothing is hidden. This is the full view.") : null,

      e("div", { className: "panel" },
        e("h2", null, "Compare two organizations",
          e("span", { className: "hint" }, "org A on the left, org B on the right \u2014 one row per metric")),
        e("div", { className: "filters" },
          e("select", { value: cmpA, onChange: ev => setCmpA(ev.target.value), "data-feat-cmpa": cmpA || "none" },
            e("option", { value: "" }, "Organization A\u2026"), orgOptions),
          e("select", { value: cmpB, onChange: ev => setCmpB(ev.target.value), "data-feat-cmpb": cmpB || "none" },
            e("option", { value: "" }, "Organization B\u2026"), orgOptions),
          (cmpA || cmpB) ? e("button", { onClick: () => { setCmpA(""); setCmpB(""); } }, "Clear") : null),
        /* GENUINELY SIDE BY SIDE — Dan: "actually make it org 1 on the left,
           org 2 on the right. This isn't side by side, it's top and bottom."
           It was two table ROWS, which is a comparison you read vertically
           one column at a time.

           A THREE-COLUMN GRID rather than two independent cards: the metric
           label sits on the left and both values line up against it, so the
           eye travels along one row to compare one thing. Two stacked cards
           would put "Adoption" in two different places on screen and the
           reader would have to hunt for the pair. */
        (A && B) ? e("div", { className: "cmp", "data-feat-cmp": A.o.slug + "|" + B.o.slug },
          e("div", { className: "cmprow cmphead" },
            e("div", { className: "cmplab" }),
            [A, B].map((r, i2) => e("div", { key: i2, className: "cmpcol",
                                             "data-feat-cmpcol": i2 === 0 ? "a" : "b" },
              e("div", { className: "cmporg" }, e("b", null, orgName(r.o)), " ", launchTag(r.o), " ", adminLink(r.o)),
              e("div", { className: "subslug" }, r.o.slug)))),

          /* Adoption first, then the core counts, then a row per feature
             group — the same order as the table's columns, so the two
             surfaces read the same way round. */
          e("div", { className: "cmprow" },
            e("div", { className: "cmplab" }, "Adoption"),
            [A, B].map((r, i2) => e("div", { key: i2, className: "cmpcol cmpval" },
              r.score == null
                ? e("span", { className: "zero" }, "not measured")
                : e("span", { className: "scorecell" },
                    e(Grade, { pct: r.score }),
                    e("b", { style: { color: ofGradeColor(r.score), fontSize: 17 } }, r.score + "%"))))),

          metrics.map(m => e("div", { className: "cmprow", key: m.key },
            e("div", { className: "cmplab", title: m.description }, m.icon + " " + m.label),
            [A, B].map((r, i2) => e("div", { key: i2, className: "cmpcol cmpval" },
              pill(r, m.key))))),

          groups.map(g => {
            const ga = ofGroupScore(g.keys, k => adoptedIn(A.o.slug, k));
            const gb = ofGroupScore(g.keys, k => adoptedIn(B.o.slug, k));
            return e("div", { className: "cmprow", key: g.cat },
              e("div", { className: "cmplab", title: g.cat }, catShort(g.cat)),
              [ga, gb].map((gs, i2) => e("div", { key: i2, className: "cmpcol cmpval" },
                e("span", { className: "pill gpill", style: ofRatioHeat(gs && gs.pct) },
                  gs ? gs.used + "/" + gs.total : "—"))));
          }),

          /* THE GAP LISTS SIT UNDER THEIR OWN ORG, in the same two columns.
             They used to run the full width stacked, which is what made the
             panel read top-and-bottom even where the numbers did not. */
          A.o.slug === B.o.slug
            ? e("div", { className: "note" }, "That is the same organization in both slots.")
            : e("div", { className: "cmprow cmpgaps", "data-feat-gap": 1 },
                e("div", { className: "cmplab" }, "Only here"),
                [[A.o, B.o], [B.o, A.o]].map(([x, y], i2) => {
                  const g = gap(x, y);
                  return e("div", { key: i2, className: "cmpcol" },
                    g.length
                      ? e("div", { className: "cmponly" },
                          e("b", null, g.length + " feature" + (g.length === 1 ? "" : "s") + " "),
                          orgName(y) + " does not have: " + g.join(", "))
                      : e("div", { className: "cmponly none" },
                          "Nothing " + orgName(y) + " does not also have."));
                }))
        ) : e("div", { className: "note" }, "Pick an organization in both slots to compare them."),
      ),

      e("div", { className: "panel" },
        e("h2", null, "Feature adoption by organization",

  /* ── THE SETTINGS SHEET ─────────────────────────────────────────────────
     PORTALLED ONTO <body>, not rendered in place. The sibling project records

     text-transform, colour and flex-direction from it, and its Save button
     loses to the container's own button rule and renders inert — which reads
     as "the settings page doesn't work" rather than as a CSS problem. A modal
     also belongs on body for z-index and overflow.

     Editing is DRAFT-THEN-SAVE, never auto-save: this is shared state, so a
     half-made change must not reach everyone else the moment a box is
     ticked. Save is disabled until the draft actually differs from what the
     server holds, and the footnote says which of those two states you are
     in — a greyed button with no explanation is what invites "it didn't

  function FeatureSettings({ data, cfg, onClose, onSaved }) {
    const measured = data.measuredFeatures || [];
    const byKey = {};
    (data.features || []).forEach(f => { byKey[f.key] = f; });
    const nameOf = k => (byKey[k] && (byKey[k].name || k)) || k;

    const [hidden, setHidden] = useState(new Set(cfg.hiddenFeatures || []));
    const [excluded, setExcluded] = useState(new Set(cfg.excludedOrgs || []));
    const [orgQ, setOrgQ] = useState("");
    const [saving, setSaving] = useState(false);
    const [saveErr, setSaveErr] = useState(null);

    // Features grouped by their catalog category, which is the "type" the
    // catalog already carries — no second taxonomy invented here.
    const groups = [];
    (data.featureCategories || []).forEach(cat => {
      const keys = measured.filter(k => byKey[k] && byKey[k].category === cat);
      if (keys.length) groups.push([cat, keys]);
    });
    const grouped = new Set(groups.flatMap(([, ks]) => ks));
    const orphans = measured.filter(k => !grouped.has(k));
    if (orphans.length) groups.push(["Other", orphans]);

    const orgName = o => o.displayName || o.name || o.slug;
    const orgs = (data.orgs || []).slice().sort((x, y) => orgName(x).localeCompare(orgName(y)));
    const visibleOrgs = orgs.filter(o =>
      !orgQ || (orgName(o) + " " + o.slug).toLowerCase().includes(orgQ.toLowerCase()));

    const toggle = (set, setter, k) => {
      const n = new Set(set);
      if (n.has(k)) n.delete(k); else n.add(k);
      setter(n);
    };
    const sameSet = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
    const dirty = !sameSet(hidden, new Set(cfg.hiddenFeatures || []))
                || !sameSet(excluded, new Set(cfg.excludedOrgs || []));

    const save = () => {
      setSaving(true); setSaveErr(null);
      fetch("/api/org-features-settings", {
        method: "PUT", headers: { "content-type": "application/json" },
        body: JSON.stringify({ hiddenFeatures: [...hidden], excludedOrgs: [...excluded] }),
      })
        .then(r => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
        // The response is what was STORED, not what was sent, so an entry
        // that got clamped or de-duplicated is visible rather than assumed.

        .catch(err => { setSaveErr(err.message); setSaving(false); });

          e("button", { onClick: onClose, "aria-label": "Close" }, "\u2715")),

        e("div", { className: "ofs-body" },
          e("div", { className: "ofs-secthead" },
            "Features counted",
            e("span", null, hidden.size ? (measured.length - hidden.size) + " of " + measured.length + " tracked"

            e("span", { className: "ofs-acts" },

              e("a", { href: "#", onClick: ev => { ev.preventDefault(); setHidden(new Set(measured)); } }, "none"))),
          e("div", { className: "ofs-note" },
            "Unticking a feature hides its column from the checklist AND takes it out of the adoption score, so the score only counts what you care about. Nothing is deleted."),
          groups.map(([cat, keys]) => {

              e("div", { className: "ofs-grphead" },
                e("b", null, cat), " ",
                e("span", { className: "ofs-count" }, on + "/" + keys.length),
                e("span", { className: "ofs-acts" },
                  e("a", { href: "#", onClick: ev => { ev.preventDefault();
                    const n = new Set(hidden); keys.forEach(k => n.delete(k)); setHidden(n); } }, "all"),
                  " \u00b7 ",
                  e("a", { href: "#", onClick: ev => { ev.preventDefault();
                    const n = new Set(hidden); keys.forEach(k => n.add(k)); setHidden(n); } }, "none"))),
              e("div", { className: "ofs-grid" }, keys.map(k =>
                e("label", { key: k, className: "ofs-chk", title: (byKey[k] && byKey[k].description) || "" },
                  e("input", { type: "checkbox", checked: !hidden.has(k),
                               "data-feat-fchk": k,
                               onChange: () => toggle(hidden, setHidden, k) }),
                  e("span", null, nameOf(k))))));
          }),

          e("div", { className: "ofs-secthead", style: { marginTop: 18 } },
            "Organizations excluded",
            e("span", null, excluded.size ? excluded.size + " excluded of " + orgs.length

            excluded.size ? e("span", { className: "ofs-acts" },
              e("a", { href: "#", onClick: ev => { ev.preventDefault(); setExcluded(new Set()); } }, "clear")) : null),
          e("div", { className: "ofs-note" },
            "Tick an organization to drop it from this page entirely \u2014 the table, the pulldown, the comparison and the fleet average. For test and retired accounts."),
          // Already-excluded orgs are pinned to the top, or an org you
          // excluded last month is unfindable without remembering its name.
          excluded.size ? e("div", { className: "ofs-grid" }, [...excluded].sort().map(slug => {
            const o = orgs.find(x => x.slug === slug);

              e("input", { type: "checkbox", checked: true, "data-feat-ochk": slug,
                           onChange: () => toggle(excluded, setExcluded, slug) }),
              e("span", null, o ? orgName(o) : slug,
                // An entry whose org is no longer in the snapshot stays
                // listed and says so, or it could never be unticked.

          })) : null,
          e("input", { className: "ofs-search", type: "text", placeholder: "Search organizations\u2026",
                       value: orgQ, onChange: ev => setOrgQ(ev.target.value) }),
          e("div", { className: "ofs-grid ofs-scroll" }, visibleOrgs.filter(o => !excluded.has(o.slug)).map(o =>
            e("label", { key: o.slug, className: "ofs-chk", title: o.slug },

              e("span", null, orgName(o), o.launched ? null : e("span", { className: "ofs-gone" }, " pre-launch"))))),
          visibleOrgs.length ? null : e("div", { className: "ofs-note" }, "No organization matches that search.")),

        e("div", { className: "ofs-foot" },
          e("div", { className: "ofs-footnote", "data-feat-footnote": dirty ? "dirty" : "clean" },
            saveErr ? e("span", { style: { color: "var(--bad-ink)" } }, "Could not save: " + saveErr)

                            : "Nothing to save \u2014 tick or untick something first."),
          e("div", null,
            e("button", { onClick: onClose }, "Cancel"), " ",
            e("button", { className: "ofs-save", disabled: !dirty || saving, onClick: save,
                          "data-feat-save": dirty ? "on" : "off" },
              saving ? "Saving\u2026" : "Save"))),

        cfg.updatedAt ? e("div", { className: "ofs-meta" },
          "Last changed " + new Date(cfg.updatedAt).toLocaleString() +
          (cfg.updatedBy ? " by " + cfg.updatedBy : "")) : null));

    return ReactDOM.createPortal ? ReactDOM.createPortal(sheet, document.body) : sheet;
  }

            e("text", { x: 12, y: 20, fontSize: 10.5, fontWeight: 700, fill: "var(--muted)" }, "SOURCES"),
            box(12, 32, 150, 52, "rec prod replica", "via Metabase", "var(--info-bg-2)", "var(--spark)"),
            box(12, 94, 150, 52, "Airtable", "services · requests", "var(--info-bg-2)", "var(--spark)"),
            box(12, 156, 150, 52, "Linear · HubSpot", "bugs · accounts", "var(--info-bg-2)", "var(--spark)"),

            e("text", { x: 232, y: 20, fontSize: 10.5, fontWeight: 700, fill: "var(--muted)" }, "BAKE"),
            box(232, 32, 170, 176, "Scheduled Routine", "daily ~6am ET → commit", "var(--violet-bg)", "var(--violet-edge)"),

            e("text", { x: 472, y: 20, fontSize: 10.5, fontWeight: 700, fill: "var(--muted)" }, "REPO"),
            box(472, 32, 170, 176, "danj707/org-features", "3 snapshots committed", "var(--good-bg-2)", "var(--good-edge)"),

            e("text", { x: 12, y: 258, fontSize: 10.5, fontWeight: 700, fill: "var(--muted)" }, "RUNTIME"),
            box(232, 270, 170, 68, "Railway", "org-features service", "var(--orange-bg-2)", "var(--orange-edge)"),
            box(472, 270, 170, 68, "Postgres", "schema: orgfeatures", "var(--bad-bg-2)", "var(--bad-edge)"),
            box(682, 270, 166, 68, "Metabase", "live, per request", "var(--info-bg-2)", "var(--spark)"),

            box(232, 372, 170, 62, "Org Features", "public dashboard", "var(--fill)", "var(--line-2)"),
            box(472, 372, 170, 62, "CX Dashboard", "auth-gated", "var(--fill)", "var(--line-2)"),

            arrow(162, 58, 232, 100, "a1"),
            arrow(162, 120, 232, 120, "a2"),
            arrow(162, 182, 232, 140, "a3"),
            arrow(402, 120, 472, 120, "a4"),
            arrow(557, 208, 400, 270, "a5"),
            arrow(402, 304, 472, 304, "a6"),
            arrow(642, 304, 682, 304, "a7"),
            arrow(300, 338, 300, 372, "a8"),
            arrow(340, 338, 520, 372, "a9"),

            e("text", { x: 12, y: 300, fontSize: 10.5, fill: "var(--neutral-ink)" }, "accounts +"),
            e("text", { x: 12, y: 314, fontSize: 10.5, fill: "var(--neutral-ink)" }, "snapshot"),
            e("text", { x: 12, y: 328, fontSize: 10.5, fill: "var(--neutral-ink)" }, "overrides"),
            e("text", { x: 682, y: 356, fontSize: 10, fill: "var(--muted)" }, "Remittance only"),
            e("text", { x: 472, y: 356, fontSize: 10, fill: "var(--muted)" }, "accounts live here"))),
        e("div", { className: "note", style: { marginTop: 10 } },
          "Deploys: pushing to main builds on Railway and waits for this repo's CI check " +
          "suites before releasing.")));
  }

  /* ── UPDATES ─────────────────────────────────────────────────────────────
     Served from a committed file rather than typed into this page, so an entry
     arrives in the same commit as the change it describes and is reviewable in
     the diff. Newest first. */
  function Updates() {
    const [d, setD] = useState(null);
    const [err, setErr] = useState(null);
    useEffect(() => {
      fetch("/api/updates")
        .then(r => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
        .then(setD).catch(e => setErr(e.message));
    }, []);
    if (err) return e("div", { className: "note" }, "Could not load the update log: " + err);
    if (!d) return e("div", { className: "note" }, "Loading updates…");
    const items = (d.updates || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
    if (!items.length) return e("div", { className: "note" }, "Nothing logged yet.");
    return e("div", null, ...items.map((u, i) =>
      e("div", { className: "panel", key: i, "data-update-entry": u.date },
        e("div", { className: "note" }, u.date),
        e("h3", { style: { margin: "2px 0 8px" } }, u.title),
        u.body ? e("p", null, u.body) : null,
        Array.isArray(u.items) && u.items.length
          ? e("ul", { style: { margin: "6px 0 0 18px", padding: 0, fontSize: 13, lineHeight: 1.6 } },
              ...u.items.map((it, j) => e("li", { key: j }, it)))
          : null)));
  }

  function App() {
    const [data, setData] = useState(null);
    const [me, setMe] = useState(null);
    const [r, setR] = useState(route());
    useEffect(() => {
      fetch("/api/auth/me").then(x => {
        if (x.status === 401) { location.href = "/login"; return null; }
        return x.json();
      }).then(d => d && setMe(d.user));
      fetch("/api/ps-data").then(x => x.status === 401 ? null : x.json()).then(d => d && setData(d));
      const f = () => setR(route());
      window.addEventListener("popstate", f);
      return () => window.removeEventListener("popstate", f);
    }, []);
    const signOut = () => fetch("/api/auth/logout", { method: "POST" }).then(() => location.href = "/login");
    if (!data || !me) return e("div", { className: "note" }, "Loading…");

    const item = (href, label, active, cnt) => link(href, [label, cnt != null ? e("span", { key: "c", className: "cnt" }, cnt) : null], "item" + (active ? " active" : ""));
    const titles = { health: ["Account Health", "PS/CX snapshot of every account — bugs, adoption, requests, engagement"], bugs: ["Bug Management", "All open bugs · categorize, deduplicate, and jump to Linear"], reporting: ["CX Team Reporting", "Launch pipeline · live from the Airtable Services table"], remittance: ["Remittance", "Item Log exports by billing period — one CSV per organization"], org: ["Account Health", "Account drill-in"], admin: ["Admin", "User management"], features: ["Org Features", "Feature usage and adoption across every published organization"], featureorg: ["Org Features", "Feature adoption for one organization"], feature: ["Org Features", "One feature across every organization"], featurelist: ["Org Features", "How far each feature has spread across the fleet"], how: ["How This Works", "What this project is, where its data comes from, and how it is deployed"], updates: ["Updates", "A running log of what has shipped on this project"] };
    return e("div", { className: "layout" },
      e("nav", { className: "side" },
        /* Renamed PS -> CX at Dan's request. THE LABEL ONLY: the /ps/* routes,
           ps.html and the ps-data snapshot key all keep their names, because
           renaming those breaks every bookmark anyone holds and the store key
           the snapshot is written under. */
        e("div", { className: "logo" },
          e("img", { src: "/rec-logo.jpg", alt: "rec", width: 24, height: 24 }),
          e("span", null, "CX dashboard")),
        e("div", { className: "sec" }, "Account Health"),
        item("/ps", "Account Health", r.page === "health" || r.page === "org"),
        item("/ps/bugs", "Bug Management", r.page === "bugs", data.bugs.length),
        /* CX Reporting lives under CX Forecasting: the page is the launch
           pipeline — forecast revenue by quarter, ACV by stage. THE LABEL AND
           GROUPING ONLY; the route stays /ps/reporting so bookmarks hold. */
        e("div", { className: "sec" }, "CX Forecasting"),
        item("/ps/reporting", "CX Reporting", r.page === "reporting"),
        e("div", { className: "sec" }, "Finance"),
        item("/ps/remittance", "Remittance", r.page === "remittance"),
        e("div", { className: "sec" }, "Platform"),
        /* IN THE SHELL NOW. This was a plain <a href="/">, which is a FULL PAGE
           navigation out of this app into dashboard.html — the sidebar
           disappears and there is no way back. Every other item routes through
           link() -> pushState and keeps the shell, so this one does too.
           The standalone public dashboard at / is untouched and still works. */
        item("/ps/features", "Org Features", r.page === "features"),
        me.role === "admin" ? e(React.Fragment, null, e("div", { className: "sec" }, "Admin"), item("/ps/admin", "Users", r.page === "admin")) : null,
        e("div", { className: "sec" }, "About"),
        item("/ps/how", "How This Works", r.page === "how"),
        item("/ps/updates", "Updates", r.page === "updates"),
        e("div", { className: "foot" },
          /* WHERE DAN POINTED. It sits above the identity line rather than
             below the snapshot stamp because the stamp already ends in a
             variable-height staleness shout — a control under that moves
             down the sidebar on the days the bake is late. */
          e(ThemeToggle, null),
          e("div", null, "Signed in as ", e("b", { style: { color: "var(--nav-ink-strong)" } }, me.name), " (" + me.role + ")"),
          e("a", { href: "#", onClick: (ev) => { ev.preventDefault(); signOut(); }, style: { color: "var(--nav-accent)" } }, "Sign out"),
          e("div", { style: { marginTop: 8 }, "data-snap-age": snapAgeDays(data.generatedAt) },
            // NAMED, because this is the PS/bugs snapshot and it renders at
            // the foot of every page including Org Features, which is baked
            // from a different file on a different schedule. An unlabelled
            // "Snapshot <date>" there describes the wrong dataset.
            "PS snapshot " + new Date(data.generatedAt).toLocaleString(),
            // NEVER assert "refreshed daily" as a standing fact. This line
            // said exactly that for 38 days while nothing refreshed the
            // bugs half at all, which is how a page full of closed bugs
            // read as current. State the AGE, which is measured, and shout
            // when it is old enough to be misleading.
            snapStale(data.generatedAt)
              ? e("div", { style: { color: "var(--nav-warn)", fontWeight: 700, marginTop: 2 } },
                  "\u26a0 " + snapAgeDays(data.generatedAt) + " days old — statuses may have moved on")
              : e("span", null, " \u00b7 " + snapAgeLabel(data.generatedAt))))),
      e("main", null,
        e("header", { className: "top" }, e("h1", null, titles[r.page][0]), e("div", { className: "sub" }, titles[r.page][1])),
        e("div", { className: "wrap" },
          r.page === "health" ? e(Health, { data }) :
          r.page === "org" ? e(Org, { data, id: r.id }) :
          r.page === "bugs" ? e(Bugs, { data }) :
          r.page === "remittance" ? e(Remittance, null) :
          r.page === "admin" ? e(Admin, { me }) :
          r.page === "features" ? e(Features, { slug: null }) :
          r.page === "featureorg" ? e(Features, { slug: r.slug }) :
          r.page === "featurelist" ? e(Features, { featureList: true }) :
          r.page === "feature" ? e(Features, { featureKey: r.key }) :
          r.page === "how" ? e(HowItWorks, null) :
          r.page === "updates" ? e(Updates, null) :
          e(Reporting, { data }),
          e("div", { className: "foot" }, "Sources: Linear (bugs + customer tags) · HubSpot (status, health, engagement) · Airtable (feature requests) · rec prod replica (adoption). Intercom interactions/NPS not wired yet."))));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(App));
})();
</script>
</body>
</html>
