<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rec · PS Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛟</text></svg>">
<!-- THE THEME STAMP GOES ON BEFORE ANYTHING PAINTS, and that is the whole
     reason it is here rather than in the React app. Set from an effect and a
     dark-mode viewer gets a full-brightness white flash on every load and
     every route change, which is worse than having no toggle at all.

     NO STAMP MEANS "FOLLOW THE OS" — the media query in the stylesheet
     handles that case, so an unpinned viewer needs no JavaScript to get the
     right mode. This script only writes a stamp when someone has actually
     chosen, and it fails silently: localStorage throws in a locked-down
     browser, and a theme preference is not worth a blank page. -->
<script>
  try {
    var t = localStorage.getItem("psTheme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/feature-pills.js"></script>
<style>
  /* ── THEME TOKENS ────────────────────────────────────────────────────────
     Every themeable colour on this page is a token, declared once per mode.
     Both modes are SELECTED, not computed: a dark theme derived by flipping
     lightness produces muddy hues, and the categorical series steps below are
     the validated dark column of the data-viz reference palette rather than
     darkened copies of the light ones.

     THE DARK SURFACES ARE THE ONES THIS PAGE ALREADY HAD. The sidebar has
     always been navy and the CX capacity grid has always been slate on
     slate — so dark mode is not a new look invented here, it
     is the rest of the page catching up with the two regions that were
     already dark. That is also why the capacity grid needs no dark variants:
     it is already wearing them.

     WHY TOKENS RATHER THAN A SECOND STYLESHEET: an inline `style={{...}}`
     beats any stylesheet, and ~170 of this page's colour decisions are inline
     React styles. A second stylesheet could never reach them. A token can —
     `style={{ color: "var(--ink)" }}` resolves against the cascade at paint
     time, so the same declaration themes itself.

     The one place that CANNOT use a token is an SVG *presentation attribute*
     (`stroke="…"`, `fill="…"`), which does not resolve var(). Those either
     move into `style` or, where a render case reads the attribute, read from
     the JS palette pair (see OF_SERIES_COLORS / OF_SERIES_COLORS_DARK). */
  :root {
    color-scheme: light;
    /* surfaces */
    --bg: #f4f6fa; --card: #ffffff; --fill: #f8fafc; --fill-2: #f1f5f9;
    --track: #eef2f7; --nav: #10233d;
    /* The sidebar is dark in BOTH modes, so its ink is fixed. Reading
       --card here would flip the logo to slate-on-navy. */
    --nav-ink: #cbd5e1; --nav-ink-strong: #ffffff; --nav-warn: #fbbf24;
    /* ink, darkest to lightest */
    --ink: #1a2333; --ink-2: #334155; --muted: #64748b; --faint: #94a3b8;
    --on-accent: #ffffff;
    /* rules */
    --line: #e2e8f0; --line-2: #cbd5e1;
    /* brand */
    --brand: #0f6f5c; --brand-hover: #0c5b4b; --brand-2: #0d5c99;
    /* The masthead band. Its own tokens because a full-width fill and a
       12px control want different steps of the same hue: on dark the
       control has to lift off the surface while the band must not
       become a neon stripe across the top of the page. */
    --hdr-1: #0f6f5c; --hdr-2: #0d5c99;
    --nav-accent: #6ee7b7;
    /* status inks (kept under their original names — they are referenced by
       .zero and by the ring meters) */
    --good: #16a34a; --warn: #d97706; --bad: #dc2626; --none: #cbd5e1;
    /* semantic families: a tinted band, an ink that reads on it, an edge */
    --good-bg: #dcfce7; --good-bg-2: #ecfdf5; --good-ink: #166534;
    --good-ink-2: #15803d; --good-edge: #86efac;
    --warn-bg: #fffbeb; --warn-bg-2: #fef3c7; --warn-ink: #b45309;
    --warn-ink-2: #92400e; --warn-edge: #fcd34d; --warn-edge-2: #fde68a;
    --bad-bg: #fee2e2; --bad-bg-2: #fef2f2; --bad-ink: #b91c1c; --bad-edge: #fca5a5;
    --orange-bg: #ffedd5; --orange-bg-2: #fff7ed; --orange-ink: #c2410c;
    --orange-ink-2: #9a3412; --orange-ink-3: #ea580c; --orange-edge: #fdba74;
    --info-bg: #e0f2fe; --info-bg-2: #eef6ff; --info-ink: #075985; --info-edge: #93c5fd;
    --aqua-bg: #cffafe; --aqua-ink: #155e75;
    --pink-bg: #fce7f3; --pink-ink: #9d174d;
    --violet-bg: #f5f3ff; --violet-edge: #c4b5fd;
    --yellow-bg: #fef9c3; --yellow-ink: #a16207;
    --neutral-bg: #e2e8f0; --neutral-ink: #475569;
    --spark: #93c5fd; --spark-hot: #3b82f6;
    /* The metric pill's heat ramp, read by /feature-pills.js — which is
       shared with the light-only public dashboard, so both pages declare
       these names. The wash is translucent over the card; only its HUE and
       the two label inks are re-chosen per mode. */
    --pill-null-bg: #f8fafc; --pill-null-ink: #94a3b8;
    --pill-zero-bg: #ffffff; --pill-zero-ink: #cbd5e1;
    --pill-heat-rgb: 15,111,92;
    --pill-ink-strong: #ffffff; --pill-ink-soft: #0f3d33;
    /* the six categorical series slots, light column */
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
    --series-4: #eda100; --series-5: #e87ba4; --series-6: #008300;
  }
  /* THE TOGGLE SCOPE AND THE OS SETTING, in that order. The `[data-theme]`
     stamp must win both ways, so the media query is written with :where() —
     zero specificity — and guarded against an explicit light stamp. Without
     the guard a viewer on an OS-dark machine who picks LIGHT gets dark
     anyway, which is the toggle silently not working. */
  /* The dark column. Declared TWICE on purpose — the media query covers the
     OS setting, the [data-theme] scope covers the toggle. :where() gives the
     media block zero specificity and the :not() guard lets an explicit LIGHT
     stamp beat OS-dark, so the toggle wins in both directions. Without that
     guard a viewer on a dark machine who picks Light gets dark anyway, which
     reads as the toggle being broken. */
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0f172a; --card: #1e293b; --fill: #18243a; --fill-2: #27344a;
    --track: #2a3852; --nav: #0b1830;
    --nav-ink: #cbd5e1; --nav-ink-strong: #ffffff; --nav-warn: #fbbf24;
    --ink: #e6edf7; --ink-2: #c2cede; --muted: #93a3ba; --faint: #6b7c96;
    --on-accent: #ffffff;
    --line: #31405a; --line-2: #44556f;
    --brand: #14a184; --brand-hover: #17b895; --brand-2: #4b9fe8;
    --hdr-1: #0c4f43; --hdr-2: #0c3f66;
    --nav-accent: #6ee7b7;
    --good: #34d399; --warn: #fbbf24; --bad: #f87171; --none: #44556f;
    --good-bg: #12351f; --good-bg-2: #0f2c22; --good-ink: #6ee7b7;
    --good-ink-2: #34d399; --good-edge: #1c5b3a;
    --warn-bg: #3a2c10; --warn-bg-2: #3f310f; --warn-ink: #fbbf24;
    --warn-ink-2: #fcd34d; --warn-edge: #6b4f14; --warn-edge-2: #6b4f14;
    --bad-bg: #3b1717; --bad-bg-2: #331414; --bad-ink: #f87171; --bad-edge: #6d2626;
    --orange-bg: #3a2213; --orange-bg-2: #331d10; --orange-ink: #fb923c;
    --orange-ink-2: #fdba74; --orange-ink-3: #fb923c; --orange-edge: #6b3a1c;
    --info-bg: #122f45; --info-bg-2: #10283a; --info-ink: #7dd3fc; --info-edge: #2a5477;
    --aqua-bg: #0f3542; --aqua-ink: #67e8f9;
    --pink-bg: #3a1428; --pink-ink: #f9a8d4;
    --violet-bg: #221f45; --violet-edge: #4b3fa0;
    --yellow-bg: #3a3412; --yellow-ink: #facc15;
    --neutral-bg: #2f3d54; --neutral-ink: #aab8cc;
    --spark: #3b6ea8; --spark-hot: #60a5fa;
    /* A LIGHT teal on dark, so "more" is always FURTHER from the surface.
       Carrying the light hue over inverts the scale: the same deep teal that
       reads as a full pill on white reads as an empty one on slate. */
    --pill-null-bg: #18243a; --pill-null-ink: #6b7c96;
    --pill-zero-bg: #1e293b; --pill-zero-ink: #44556f;
    --pill-heat-rgb: 52,211,153;
    --pill-ink-strong: #06231d; --pill-ink-soft: #c2cede;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --series-4: #c98500; --series-5: #d55181; --series-6: #008300;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f172a; --card: #1e293b; --fill: #18243a; --fill-2: #27344a;
    --track: #2a3852; --nav: #0b1830;
    --nav-ink: #cbd5e1; --nav-ink-strong: #ffffff; --nav-warn: #fbbf24;
    --ink: #e6edf7; --ink-2: #c2cede; --muted: #93a3ba; --faint: #6b7c96;
    --on-accent: #ffffff;
    --line: #31405a; --line-2: #44556f;
    --brand: #14a184; --brand-hover: #17b895; --brand-2: #4b9fe8;
    --hdr-1: #0c4f43; --hdr-2: #0c3f66;
    --nav-accent: #6ee7b7;
    --good: #34d399; --warn: #fbbf24; --bad: #f87171; --none: #44556f;
    --good-bg: #12351f; --good-bg-2: #0f2c22; --good-ink: #6ee7b7;
    --good-ink-2: #34d399; --good-edge: #1c5b3a;
    --warn-bg: #3a2c10; --warn-bg-2: #3f310f; --warn-ink: #fbbf24;
    --warn-ink-2: #fcd34d; --warn-edge: #6b4f14; --warn-edge-2: #6b4f14;
    --bad-bg: #3b1717; --bad-bg-2: #331414; --bad-ink: #f87171; --bad-edge: #6d2626;
    --orange-bg: #3a2213; --orange-bg-2: #331d10; --orange-ink: #fb923c;
    --orange-ink-2: #fdba74; --orange-ink-3: #fb923c; --orange-edge: #6b3a1c;
    --info-bg: #122f45; --info-bg-2: #10283a; --info-ink: #7dd3fc; --info-edge: #2a5477;
    --aqua-bg: #0f3542; --aqua-ink: #67e8f9;
    --pink-bg: #3a1428; --pink-ink: #f9a8d4;
    --violet-bg: #221f45; --violet-edge: #4b3fa0;
    --yellow-bg: #3a3412; --yellow-ink: #facc15;
    --neutral-bg: #2f3d54; --neutral-ink: #aab8cc;
    --spark: #3b6ea8; --spark-hot: #60a5fa;
    /* A LIGHT teal on dark, so "more" is always FURTHER from the surface.
       Carrying the light hue over inverts the scale: the same deep teal that
       reads as a full pill on white reads as an empty one on slate. */
    --pill-null-bg: #18243a; --pill-null-ink: #6b7c96;
    --pill-zero-bg: #1e293b; --pill-zero-ink: #44556f;
    --pill-heat-rgb: 52,211,153;
    --pill-ink-strong: #06231d; --pill-ink-soft: #c2cede;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --series-4: #c98500; --series-5: #d55181; --series-6: #008300;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); }
  a { color: var(--brand-2); text-decoration: none; }
  .layout { display: flex; min-height: 100vh; }
  nav.side { width: 216px; flex: none; background: var(--nav); color: var(--line-2); padding: 18px 0; position: sticky; top: 0; height: 100vh; }
  nav.side .logo { color: var(--nav-ink-strong); font-weight: 800; font-size: 16px; padding: 4px 18px 14px; letter-spacing: .3px;
                   display: flex; align-items: center; gap: 8px; }
  nav.side .logo span { color: var(--nav-accent); }
  /* THE REAL REC MARK, not a redrawn one. This is the same asset the sibling
     rental-report project embeds in its admin header, extracted to a file
     here rather than inlined as a 4KB base64 string — it is cacheable and it
     keeps this block readable. A guessed logo and a guessed brand colour is
     how two of our own surfaces come to look like different products. */
  nav.side .logo img { height: 24px; width: 24px; border-radius: 5px; flex: none; display: block; }
  nav.side .sec { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); padding: 14px 18px 6px; }
  nav.side a.item { display: block; padding: 9px 18px; color: var(--line-2); font-size: 13.5px; font-weight: 600; border-left: 3px solid transparent; }
  nav.side a.item:hover { background: rgba(255,255,255,.06); color: var(--nav-ink-strong); }
  nav.side a.item.active { background: rgba(255,255,255,.08); color: var(--nav-ink-strong); border-left-color: var(--nav-accent); }
  nav.side a.item .cnt { float: right; background: rgba(255,255,255,.12); border-radius: 999px; font-size: 11px; padding: 1px 8px; }
  nav.side .foot { position: absolute; bottom: 14px; left: 18px; right: 12px; font-size: 11px; color: var(--muted); }
  main { flex: 1; min-width: 0; }
  /* ── The theme switch, in the sidebar foot ──────────────────────────────
     It lives on the nav, which is dark in BOTH modes, so it wears the nav's
     own fixed ink rather than --ink/--card: reading a themed token here
     would make the control invert while the surface under it did not. */
  .themesw { display: inline-flex; gap: 2px; padding: 2px; margin-bottom: 9px;
             background: rgba(255,255,255,.07); border-radius: 999px; }
  .themebtn { display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
              border: 0; background: none; color: var(--nav-ink); font: inherit;
              font-size: 11px; font-weight: 700; line-height: 1;
              padding: 5px 10px; border-radius: 999px; }
  .themebtn span { font-size: 11px; }
  .themebtn:hover { color: var(--nav-ink-strong); }
  /* THE LIVE ONE IS FILLED, not underlined or merely brighter — the page's
     own .slicetab and .qvchip already make that argument, and two buttons
     where neither is obviously "on" is the control reading as broken. */
  .themebtn.on { background: rgba(255,255,255,.16); color: var(--nav-ink-strong); }
  /* A KEYBOARD USER HAS TO SEE THE FOCUS. The default ring is a thin dark
     outline, which is invisible on navy. */
  .themebtn:focus-visible { outline: 2px solid var(--nav-accent); outline-offset: 1px; }
  header.top { background: linear-gradient(135deg, var(--hdr-1) 0%, var(--hdr-2) 100%); color: var(--on-accent); padding: 18px 24px; }
  header.top h1 { font-size: 19px; margin: 0 0 2px; }
  header.top .sub { opacity: .85; font-size: 12.5px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 18px 22px 60px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 4px 0 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  .card .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .card .v { font-size: 24px; font-weight: 800; margin-top: 2px; }
  .card .d { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 2px rgba(16,24,40,.04); overflow: hidden; margin-bottom: 20px; }
  .panel h2 { font-size: 15px; margin: 0; padding: 13px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panel h2 .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--fill); }
  .filters input[type=text] { flex: 1 1 220px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .filters select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; background: var(--card); color: var(--ink); }
  .filters label.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); padding: 6px 4px; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { background: var(--fill); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; position: sticky; top: 0; cursor: pointer; user-select: none; z-index: 1; }
  th.l, td.l { text-align: left; }

  td.wraptxt { white-space: normal; min-width: 260px; max-width: 480px; }

  td.num { font-variant-numeric: tabular-nums; }

  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-weight: 700; font-size: 11.5px; }
  .pill.p1 { background: var(--bad-bg); color: var(--bad-ink); }
  .pill.p2 { background: var(--orange-bg); color: var(--orange-ink); }
  .pill.p3 { background: var(--yellow-bg); color: var(--yellow-ink); }
  .pill.p4 { background: var(--line); color: var(--neutral-ink); }
  .pill.p0 { background: var(--fill-2); color: var(--faint); }
  .pill.status { background: var(--info-bg); color: var(--info-ink); }
  .pill.neg { background: var(--bad-bg); color: var(--bad-ink); font-weight: 600; }

  .pill.frdev { background: var(--pink-bg); color: var(--pink-ink); }

  /* The metric pills get their own modifier rather than widening .pill,
     which the bug-priority pills also use. Numeric cells need a floor width

  .pill.mpill { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; font-size: 11.5px; }

  /* ── The Org Features settings sheet ─────────────────────────────────────
     It is PORTALLED onto <body> (see FeatureSettings), so none of this has to
     fight a container's cascade — the sibling project has twice shipped a
     sheet rendered inside a styled toolbar whose rows came out uppercase and

     global button style on this page, so the sheet states its own. */
  .ofs-back { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 9999;
              display: flex; align-items: flex-start; justify-content: center; padding: 4vh 16px; overflow: auto; }
  .ofs { background: var(--card); color: var(--ink); border-radius: 14px; width: 100%; max-width: 720px;
         box-shadow: 0 24px 64px rgba(15,23,42,.28); display: flex; flex-direction: column; max-height: 92vh; }
  .ofs-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
              padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .ofs-head b { font-size: 15px; }
  .ofs-sub { font-size: 12px; color: var(--muted); margin-top: 2px; max-width: 52ch; }
  .ofs-head button { background: none; border: 0; font-size: 15px; color: var(--muted); cursor: pointer;
                     line-height: 1; padding: 4px 6px; border-radius: 6px; }
  .ofs-head button:hover { background: var(--fill-2); color: var(--ink); }
  .ofs-body { padding: 14px 16px; overflow-y: auto; }
  /* NOT STICKY, and that was tried. Two sticky headers in one scroll box at
     top:0 only hand over when the second one reaches the top — and the org
     section's own list scrolls inside a 232px box, so the second header
     never gets there. The result was "FEATURES COUNTED" pinned above the
     organization list. A stale pinned label is worse than no pinned label. */
  .ofs-secthead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
                  font-size: 11px; text-transform: uppercase; letter-spacing: .5px; font-weight: 700;
                  color: var(--muted); padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .ofs-secthead > span { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--ink-2); font-size: 12px; }
  .ofs-acts { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 12px; }
  .ofs-note { font-size: 12px; color: var(--muted); margin: 7px 0 10px; max-width: 68ch; }
  .ofs-grp { margin-bottom: 12px; }
  .ofs-grphead { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; margin-bottom: 4px; }
  .ofs-count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 11.5px; font-weight: 600; }
  .ofs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 2px 12px; }
  /* A label is the whole hit target, so the row highlights rather than only
     the 13px box, and long feature names wrap instead of being clipped. */
  .ofs-chk { display: flex; align-items: flex-start; gap: 7px; font-size: 12.5px; color: var(--ink-2);
             padding: 4px 6px; border-radius: 6px; cursor: pointer; line-height: 1.35; }
  .ofs-chk:hover { background: var(--fill-2); }
  .ofs-chk input { margin: 2px 0 0; flex: none; accent-color: var(--brand); }
  .ofs-chk.ofs-on { background: var(--warn-bg-2); color: var(--warn-ink-2); }
  .ofs-chk.ofs-on:hover { background: var(--warn-edge-2); }
  .ofs-gone { color: var(--muted); font-size: 11px; font-style: italic; }
  .ofs-search { width: 100%; padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px;
                font-size: 13px; margin: 8px 0 6px; color: var(--ink); background: var(--card); }
  /* The org list is the long one — 144 accounts — so it scrolls in its own
     box rather than pushing Save off the bottom of the sheet. */
  .ofs-scroll { max-height: 232px; overflow-y: auto; padding-right: 4px; }
  .ofs-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
              padding: 12px 16px; border-top: 1px solid var(--line); background: var(--fill);
              border-radius: 0 0 14px 14px; }
  .ofs-footnote { font-size: 12px; color: var(--muted); max-width: 46ch; }
  .ofs-foot button { padding: 7px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
                     color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }
  .ofs-foot button:hover { background: var(--fill-2); }
  .ofs-foot button.ofs-save { background: var(--brand); border-color: var(--brand); color: var(--on-accent); }
  .ofs-foot button.ofs-save:hover { background: var(--brand-hover); }
  /* A disabled Save says why in .ofs-footnote — greying it with no
     explanation is what invites "it didn't save". */
  .rm-gen { padding: 5px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
            color: var(--ink); font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .rm-gen:hover:not(:disabled) { background: var(--fill-2); border-color: var(--brand); color: var(--brand); }
  .rm-gen:disabled { color: var(--muted); cursor: progress; }
  /* Placeholder rates are marked on the control as well as in the file: the
     number it produces is not a real remittance yet. */
  .rm-gen.rm-draft::after { content: " · draft"; color: var(--muted); font-weight: 500; }
  .rm-actions { display: inline-flex; gap: 6px; align-items: center; }
  /* Email is SECONDARY to Generate. It sends to real people on one click, so it
     reads as the quieter of the two rather than competing for the same eye. */
  .rm-email { padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; background: transparent;
              color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .rm-email:hover:not(:disabled) { background: var(--fill-2); border-color: var(--brand); color: var(--brand); }
  .rm-email:disabled { color: var(--faint); cursor: progress; }
  .rm-sent { font-size: 11.5px; color: var(--good); margin-top: 3px; }
  /* Template pills. COLOUR IS NOT THE MESSAGE — each carries its own word, so a
     row reads without the legend and without colour vision. The two that this
     report cannot compute are the warning colours, because on those rows the
     pill IS the explanation for the missing button. */
  .tmpl-pills { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .tmpl-pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10.5px;
               font-weight: 700; letter-spacing: .02em; border: 1px solid transparent; white-space: nowrap; }
  .tmpl-normal  { background: var(--fill-2); color: var(--muted); border-color: var(--line); }
  .tmpl-tech    { background: var(--good-bg); color: var(--good-ink); border-color: var(--good-edge); }
  .tmpl-tickets { background: var(--warn-bg-2); color: var(--warn-ink-2); border-color: var(--warn-edge); }
  .tmpl-minimum { background: var(--bad-bg); color: var(--bad-ink); border-color: var(--bad-edge); }
  .ofs-foot button.ofs-save:disabled { background: var(--line); border-color: var(--line); color: var(--faint); cursor: not-allowed; }
  .ofs-meta { padding: 8px 16px 12px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
  /* The "Data as of" line. It sits above the KPI cards and must read as a
     provenance note, not as another metric — hence no card chrome. */
  .asof { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
          font-size: 12.5px; color: var(--muted); margin: 2px 0 14px; }
  .asof b { color: var(--ink); font-weight: 700; }
  .asof-age { color: var(--muted); }
  .asof-stale { color: var(--warn-ink); font-weight: 700; }
  .asof-stale a { color: var(--warn-ink); text-decoration: underline; }
  /* Pushed right and quiet: it is the same sentence every day, so it must
     not compete with the date, which is the part that changes. */
  .asof-src { margin-left: auto; font-size: 11.5px; color: var(--faint); }
  /* ── Org Features: the group table, the fingerprint, the drill-in ─────── */
  /* Twelve group columns plus name and adoption. The name column is capped so
     the group columns are not squeezed to nothing, and the table scrolls in
     .tablewrap rather than compressing — the same fix the sibling project's
     programs table needed. */
  /* The quick-view chip row, beside the single-org pulldown. Buttons rather
     than links: each one changes the table's state, it does not navigate. */
  .qv { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .qvchip { display: inline-flex; align-items: baseline; gap: 5px; cursor: pointer;
            background: var(--card); border: 1px solid var(--line); border-radius: 999px;
            padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .qvchip:hover { background: var(--fill-2); }
  .qvchip.on { background: var(--brand); border-color: var(--brand); color: var(--on-accent); }
  .qvn { font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .qvchip.on .qvn { color: rgba(255,255,255,.8); }
  /* The adoption chart. The pill row IS the legend — each selected pill
     carries its series colour, the feature's name and its current share, so
     identity never rests on the colour alone (three of the six series colours
     sit below 3:1 on this white card). */
  .fchart-ranges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
                   padding: 12px 16px 0; }
  .fchart-rangelab { font-size: 11px; font-weight: 700; color: var(--muted);
                     text-transform: uppercase; letter-spacing: .4px; margin-right: 2px; }
  .fchart-range[disabled] { opacity: .4; cursor: not-allowed; }
  /* Quiet, and it wraps rather than pushing the search box off the row —
     it is an explanation, not another control. */
  .fchart-rangenote { font-size: 11.5px; color: var(--muted); }
  .fchart-q { margin-left: auto; min-width: 190px; padding: 5px 10px; font-size: 12.5px;
              border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink-2); }
  .fchart-pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
                  padding: 12px 16px 10px; border-bottom: 1px solid var(--line); }
  .fchart-pill { gap: 6px; }
  .fchart-pill.locked { opacity: .45; cursor: not-allowed; }
  .fchart-dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  .fchart-more { color: var(--brand-2); }
  .fchart-wrap { position: relative; padding: 10px 16px 2px; }
  .fchart { display: block; width: 100%; height: auto; }
  .fchart-ax { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  /* Text wears text tokens, never the series colour — the line and its end dot
     carry identity, the label stays readable ink. */
  .fchart-end { font-size: 11.5px; fill: var(--ink); font-weight: 600; }
  .fchart-endv { fill: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  .fchart-tip { position: absolute; top: 14px; transform: translateX(-50%); pointer-events: none;
                background: var(--card); border: 1px solid var(--line); border-radius: 8px;
                box-shadow: 0 4px 14px rgba(16,24,40,.10); padding: 7px 10px; font-size: 12px;
                min-width: 130px; z-index: 5; }
  .fchart-tipd { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  /* Values lead, names follow. */
  .fchart-tipr { display: flex; align-items: center; gap: 6px; white-space: nowrap; line-height: 1.55; }
  .fchart-tipr b { font-variant-numeric: tabular-nums; min-width: 30px; }
  .fchart-tipr span:last-child { color: var(--muted); }
  .qvnote { font-size: 12px; color: var(--muted); padding: 8px 16px;
            background: var(--fill); border-bottom: 1px solid var(--line); }
  .qvnote b { color: var(--ink); }
  /* A/B comparison: a three-column grid, so both values line up against one
     label and the eye travels along a row to compare one thing. */
  .cmp { padding: 4px 16px 14px; }
  .cmprow { display: grid; grid-template-columns: minmax(120px, 190px) 1fr 1fr; gap: 0 14px;
            align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--fill-2); }
  .cmprow:last-child { border-bottom: 0; }
  .cmphead { align-items: end; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .cmplab { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .cmpcol { min-width: 0; }
  .cmpval { font-variant-numeric: tabular-nums; }
  .cmporg { font-size: 14px; }
  .cmpgaps { align-items: start; padding-top: 10px; }
  .cmponly { font-size: 11.5px; color: var(--ink-2); line-height: 1.45; }
  .cmponly b { color: var(--warn-ink); }
  .cmponly.none { color: var(--good-ink); font-style: italic; }
  @media (max-width: 700px) { .cmprow { grid-template-columns: 1fr; gap: 2px; } }

  /* Ring meters. The ring is the plot; the figure sits beside it because a
     five-character value ("56 / 56") cannot be read inside a 76px circle. */
  .ringcard { display: flex; align-items: center; gap: 14px; }
  .ring { flex: none; display: block; }
  .ringtext { min-width: 0; }
  .ringcard .v { font-size: 26px; line-height: 1.1; }
  .ringcard .d { margin-top: 3px; }
  .subslug { font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 1px;
             overflow: hidden; text-overflow: ellipsis; }
  .feattable { min-width: max-content; }
  /* STICKY HEADERS ACTUALLY STICK. Dan: "once I scroll down a bit, all the
     column headers are gone."

     `th { position: sticky; top: 0 }` was already there and could never work:
     `.tablewrap` sets `overflow-x: auto`, and CSS does not allow
     `overflow-y: visible` beside it — the used value becomes `auto`, so the
     wrap IS the sticky ancestor. With no height limit the wrap never scrolls
     vertically, so `top: 0` pins the header to the top of a box that is
     scrolling away with the page. Nothing sticks.

     So the feature table gets its own vertical viewport. 144 orgs is a long
     table either way; now the header stays over it. */
  .stickywrap { max-height: calc(100vh - 150px); overflow: auto; }
  /* AND THE HEADER NEEDS ITS OWN BACKGROUND AND EDGE. Under
     `border-collapse: collapse` a sticky cell's borders are painted with the
     table, not with the cell, so they scroll out from under it — the rule has
     to be a shadow. */
  .stickywrap thead th { position: sticky; top: 0; z-index: 2;
                         background: var(--fill-2); border-bottom: none;
                         box-shadow: inset 0 -1px 0 var(--line), 0 1px 0 var(--line); }
  .feattable th, .feattable td { padding: 7px 8px; }
  .feattable th:hover { background: var(--track); color: var(--ink); }
  /* THE ORG CELL WRAPS. Every `td` in this app is `white-space: nowrap`, so a
     260px max-width on a cell that cannot wrap CLIPS NOTHING — it overflows,
     and the org's name, launch tag and admin link ran straight over the
     adoption figure in the next column ("Aardvark City Parks and Rec
     pre-launch admin ↗2%"). The items keep their own nowrap, so what wraps is
     the line and never a word. */
  .feattable td.l { max-width: 280px; white-space: normal; }
  .feattable td.l > b { white-space: nowrap; }
  /* THE PILL IS THE SAME SHAPE AT EVERY VALUE, including 0. It carries its
     own border because the band supplies a borderColor — the previous ramp
     faded to a white fill on a white row, i.e. no pill, which is why one
     column rendered two different shapes for one kind of value. */
  .pill.gpill { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums;
                font-size: 11.5px; border: 1px solid transparent; padding: 2px 8px; }
  /* The adoption GRADE badge. Monospace digits are wrong here — a single
     letter wants to read as a mark, so it is a bordered chip sized to the
     surface it sits on. */
  .grade { display: inline-flex; align-items: baseline; gap: 6px; font-weight: 800;
           font-size: 12px; line-height: 1; letter-spacing: .5px; padding: 3px 7px;
           border: 1px solid; border-radius: 5px; }
  .grade i { font-style: normal; font-weight: 500; font-size: 11px; color: var(--muted);
             letter-spacing: 0; }
  .grade-lg { font-size: 20px; padding: 6px 11px; border-radius: 7px; }
  .grade-lg i { font-size: 12px; }
  /* The letter LEADS and the percentage follows it — the whole ask was
     something readable without knowing the scale. */
  .scorecell { display: inline-flex; align-items: center; gap: 7px; justify-content: flex-end; }
  .scorecell b { font-variant-numeric: tabular-nums; }
  .gradeline { margin-top: 8px; }
  /* The trend column: the signed delta over the line, like the catalyst table
     Dan pointed at. Fixed width so 144 rows do not each size their own
     column and make the sparklines incomparable. */
  .trendcell { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .trendcell b { font-size: 11px; font-variant-numeric: tabular-nums; line-height: 1; }
  .trendline { display: block; }
  .trendnone { color: var(--line-2); }
  .feattable td.trend, .feattable th.trend { width: 76px; }
  .adminlink { font-size: 11px; font-weight: 600; color: var(--brand-2); white-space: nowrap; }
  .adminlink:hover { text-decoration: underline; }

  /* ONE BAND PER ORG. Dan, on the flat gap line: "Orgs run together
     vertically, not enough separation here." Every `td` in this app carries
     the same 1px bottom rule, so the boundary INSIDE an org (summary row to
     gap row) looked exactly like the boundary BETWEEN two orgs — three
     identical hairlines per screen-inch and nothing saying which pair
     belonged together.

     The pair is a <tbody> now, which is what gives the band a hover state and
     a single heavy edge. The inner rule is removed rather than lightened: a
     faint line still reads as a division. */
  .feattable tbody.orgband td { border-bottom: none; }
  .feattable tbody.orgband tr.gap-row td { border-bottom: 2px solid var(--line-2); padding-bottom: 15px; }
  .feattable tbody.orgband tr:first-child td { padding-top: 14px; }
  /* Hovering EITHER row lights the whole band, or the summary and its own
     gaps highlight as two separate objects. */
  .tablewrap tbody.orgband:hover td { background: var(--fill-2); }
  /* A RULE BETWEEN THE TWO HALVES OF A BAND. Dan: "How about a HR to separate
     out the org name section from the 'not using' area, it just all runs
     together."

     This is NOT a reversal of removing the inner hairline — that fix was that
     the inner and outer edges were the SAME 1px weight, so nothing said which
     pair belonged together. The hierarchy is now three weights: no rule under
     the summary's own cells, a LIGHT dashed rule above the gaps, and the
     band's heavy 2px edge below. The divider has to be lighter than the band
     edge or the complaint comes straight back. */
  .gap-row td { padding-top: 9px; white-space: normal; text-align: left;
                border-top: 1px dashed var(--line); }

  /* THE GAP STACK: one group per LINE, with the label in a fixed column.
     Dan: "The two rows of not using are just a mash up of words." They were —
     the previous version was a flex row that wrapped, so `Payments Promo
     codes, Deposits` ran straight into `Comms SMS, Broadcasts` mid-sentence
     and the eye had nothing to anchor on. A grid with a fixed label column is
     the whole fix: every line starts in the same place, the ratio sits in its
     own tabular column, and the names never wrap past their own row. */
  .gapstack { display: grid; grid-template-columns: 116px 46px minmax(0, 1fr);
              gap: 3px 12px; align-items: baseline; font-size: 11.5px;
              line-height: 1.5; max-width: 1080px; padding-left: 2px; }
  .gapeyebrow { grid-column: 1 / -1; font-weight: 700; color: var(--warn-ink);
                text-transform: uppercase; font-size: 10px; letter-spacing: .5px;
                margin-bottom: 1px; }
  .gapeyebrow.ok { color: var(--good-ink); }
  .gapcat { font-weight: 700; color: var(--muted); text-transform: uppercase;
            font-size: 10px; letter-spacing: .4px; }
  .gapratio { font-variant-numeric: tabular-nums; color: var(--faint); font-weight: 700;
              text-align: right; }
  .gapnames { color: var(--ink-2); min-width: 0; }
  .gapnames i { color: var(--faint); font-style: normal; }
  .gaptrim { grid-column: 2 / -1; color: var(--faint); font-style: italic; }
  @media (max-width: 760px) { .gapstack { grid-template-columns: 96px 40px minmax(0, 1fr); } }
  /* The drill-in's gap panel: grouped, so a reader sees WHERE the gaps are
     rather than one long alphabetical list. */
  .gapwrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
             gap: 12px; padding: 12px 16px; }
  .gapgrp { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .gaphead { display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
             background: var(--warn-bg); color: var(--warn-ink-2); font-size: 11px; font-weight: 700;
             text-transform: uppercase; letter-spacing: .4px; padding: 5px 8px;
             border-bottom: 1px solid var(--line); }
  .gapn { font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .gapitem { font-size: 12.5px; color: var(--ink-2); padding: 4px 8px; border-bottom: 1px solid var(--fill-2); }
  .gapitem:last-child { border-bottom: 0; }
  .gapclear { padding: 0 16px 12px; font-size: 12px; color: var(--muted); }
  .gapclear b { color: var(--good-ink); }

  /* Per-category: in use on the left with its measured figure, not in use on
     the right. Two columns rather than one list, because "what they have" and
     "what they don't" are two different questions being asked at once. */
  .catcols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; padding: 10px 16px 14px; }
  @media (max-width: 780px) { .catcols { grid-template-columns: 1fr; } }
  .catlab { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
            padding-bottom: 5px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
  .catlab.on { color: var(--good-ink); }
  .catlab.off { color: var(--warn-ink); }
  .catrow { display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
            font-size: 12.5px; padding: 4px 0; border-bottom: 1px solid var(--fill); }
  .catrow.off { display: block; }
  .catrow.off .catname { color: var(--ink-2); }
  .catname { font-weight: 600; color: var(--ink); }
  .catdetail { color: var(--muted); font-size: 11.5px; text-align: right;
               font-variant-numeric: tabular-nums; }
  .catdesc { font-size: 11px; color: var(--muted); font-weight: 400; line-height: 1.4;
             margin-top: 1px; max-width: 46ch; }
  .catnone { font-size: 12px; color: var(--faint); font-style: italic; padding: 4px 0; }

  /* ── the per-feature page ─────────────────────────────────────────────
     The provenance block is deliberately readable prose at body size rather
     than a tooltip: every count on that page rests on one filter, and this
     project has already measured four different wrong ways to count the
     newest one. A definition behind a hover is a definition nobody reads. */
  .fabout { padding: 14px 16px; }
  .fdesc { margin: 0 0 8px; font-size: 14px; line-height: 1.5; color: var(--ink); }
  .fwhy { margin: 0 0 12px; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
  .fdef { margin-top: 10px; }
  .flab { font-size: 11px; color: var(--muted); text-transform: uppercase;
          letter-spacing: .4px; font-weight: 700; margin-bottom: 3px; }
  .fdef > div:last-child { font-size: 12.5px; line-height: 1.55; color: var(--neutral-ink); }
  .fsig { display: block; font-size: 11.5px; line-height: 1.5; color: var(--neutral-ink);
          background: var(--fill); border: 1px solid var(--line); border-radius: 8px;
          padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
  /* The two slices of one dataset. A tab that only looks like a link is a
     tab nobody clicks, so the active one is filled rather than underlined —
     the same treatment .qvchip.on already uses for an active view. */
  .slicetabs { display: flex; gap: 8px; margin: 2px 0 14px; flex-wrap: wrap; }
  .slicetab { display: block; border: 1px solid var(--line); border-radius: 10px;
              padding: 7px 13px; background: var(--card); color: var(--ink);
              font-size: 13px; font-weight: 700; text-decoration: none; line-height: 1.25; }
  .slicetab i { display: block; font-style: normal; font-size: 11px; font-weight: 400;
                color: var(--muted); margin-top: 1px; }
  .slicetab:hover { background: var(--fill-2); text-decoration: none; }
  .slicetab.on { background: var(--brand); border-color: var(--brand); color: var(--on-accent); }
  .slicetab.on i { color: rgba(255,255,255,.75); }
  .fnot { padding: 12px 16px; }
  /* A WRAPPED ROW OF NAMES, not a table. This list runs to 120 organizations
     on a feature nobody has adopted, and a 120-row table of one column is a
     scroll rather than a list you can read in one look. */
  .fnotwrap { display: flex; flex-wrap: wrap; gap: 5px; }
  .fnotorg { display: inline-block; background: var(--fill-2); border: 1px solid var(--line);
             border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--ink-2);
             text-decoration: none; }
  .fnotorg:hover { background: var(--line); text-decoration: none; }
  @media (max-width: 860px) { nav.side { display: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  const e = React.createElement;
  const { useState, useEffect, useMemo } = React;
  const fmt = (n) => n == null ? "—" : Number(n).toLocaleString("en-US");
  const days = (iso) => iso ? Math.round((Date.now() - new Date(iso)) / 864e5) : null;

  const STATUS_ORDER = ["Launched R&R","Launched Pilot","Configuration","Discovery","Delayed/Deferred"];
  const PRI_CLASS = { "Urgent": "p1", "High": "p2", "Medium": "p3", "Low": "p4", "No priority": "p0" };

  // ---------------- snapshot freshness ----------------
  // At module scope, and pure, so a spec can RUN these rather than regex
  // over them: a regex passes just as happily on an inverted comparison.
  // SNAP_STALE_DAYS is 2, not 1 — the bake runs at 6am ET and a reader in
  // the morning before it lands is looking at yesterday's snapshot, which
  // is normal and must not cry wolf. Two days means a refresh was missed.
  const SNAP_STALE_DAYS = 2;
  function snapAgeDays(iso) {
    if (!iso) return null;
    const t = Date.parse(iso);
    if (isNaN(t)) return null;                 // an unparseable date is not "0 days old"
    return Math.max(0, Math.floor((Date.now() - t) / 864e5));
  }
  function snapStale(iso) {
    const d = snapAgeDays(iso);
    // A snapshot whose date cannot be read is treated as stale, not fresh.
    // Failing the other way is what let this go unnoticed for five weeks.
    return d === null || d >= SNAP_STALE_DAYS;
  }
  function snapAgeLabel(iso) {
    const d = snapAgeDays(iso);
    if (d === null) return "date unreadable";
    return d === 0 ? "today" : d === 1 ? "yesterday" : d + " days old";
  }


  // ---------------- org features: groups, links, ratios ----------------
  // At module scope and pure, so a spec can RUN them. A regex over a
  // comparison passes just as happily when the comparison is inverted.

  /* SHORT COLUMN LABELS. The catalog's category names are up to 25 characters
     ("Registration & Eligibility") and there are twelve columns — the long
     names force the table several screens wide. The spec fails if a category
     in the data has no short label, because the fallback is the long name and
     the symptom is a table nobody can read. */
  const CAT_SHORT = {
    "Registration & Eligibility": "Registration",
    "Programs & Scheduling": "Programs",
    "Memberships & Passes": "Memberships",
    "Facilities & Rentals": "Facilities",
    "Payments & Pricing": "Payments",
    "Integrations & Admin": "Integrations",
    "Communications": "Comms",
    "Leagues & Teams": "Leagues",
    "Store & POS": "Store / POS",
    "Events & Ticketing": "Events",
    "AI & Automation": "AI",
    /* NEW 2026-09-07. Dan: "missing a whole section on settings, like
       permits, waivers, forms, desk locations, etc." All thirteen were
       already measured but scattered across five functional categories, so
       the setup picture could not be read anywhere. `Forms & Waivers` is gone
       with them — forms and waivers ARE the settings he named, and a category
       with no features left is a column that can never render. */
    "Settings & Configuration": "Settings",
  };
  function catShort(name) { return CAT_SHORT[name] || name; }

  /* How much of the gap the stack shows inline before deferring to the
     drill-in. THREE GROUPS, because each one now owns a whole LINE rather
     than sharing a wrapped paragraph — four lines of gaps under a two-line
     summary is more org than fits on a screen, and the third-worst group is
     already well past the thing worth acting on. FOUR NAMES per line is what
     the name column holds at a normal width: the median tracked feature name
     is 24 characters and the longest is 43 ("Alternate IDs / External System
     Integration"), so five would wrap and reintroduce the mash-up this
     layout exists to fix. Whatever is trimmed is COUNTED on screen. */
  const GAP_GROUPS_SHOWN = 3;
  const GAP_NAMES_SHOWN = 4;

  /* THE GAP CLUSTERS, at module scope so a spec can RUN this rather than
     regex over it — the previous version was an inline IIFE inside the row
     map, and an assertion that a sort is MENTIONED is not an assertion that
     anything is ordered. Returns keys, not labels: the catalog lives in the
     component, and a helper that needed it could not be tested without one.

     `isAdopted` is scoped to one org by the caller. A group with nothing
     missing is dropped entirely — a line reading "Payments 7/7" belongs in
     the columns above, not in a list of what to turn on. */
  function ofGapClusters(groups, isAdopted, groupsShown, namesShown) {
    const cl = (groups || [])
      .map(g => {
        const keys = g.keys || [];
        const gone = keys.filter(k => !isAdopted(k));
        return { cat: g.cat, gone, used: keys.length - gone.length, total: keys.length };
      })
      .filter(x => x.gone.length)
      /* DEEPEST GAP FIRST BY COUNT — the biggest block of work, which is what
         the reader is here to find. Ties break on the smaller share in use,
         so a group with nothing configured beats one that is half done, and
         then on name so two runs of the same snapshot cannot disagree about
         which three lines are shown. */
      .sort((x, y) => y.gone.length - x.gone.length
                   || (x.used / x.total) - (y.used / y.total)
                   || String(x.cat).localeCompare(String(y.cat)));
    const head = cl.slice(0, groupsShown);
    const tail = cl.slice(head.length);
    return {
      head: head.map(x => ({
        cat: x.cat, used: x.used, total: x.total,
        keys: x.gone.slice(0, namesShown),
        more: Math.max(0, x.gone.length - namesShown),
      })),
      restGroups: tail.length,
      restFeatures: tail.reduce((n, x) => n + x.gone.length, 0),
    };
  }

  /* The org's page in the Rec admin. NULL without an id, so the link is
     ABSENT rather than pointing at /admin/o/undefined — a link that 404s is
     worse than no link, and the snapshot's org id is the uuid this path
     wants (the same trap as check-ins, where `Member ID` is a 6-char rec_id
     that looks identical and 404s). */
  /* `/home` IS PART OF THE PATH. Dan corrected this: /admin/o/<uuid> alone
     is not the org's admin page — the landing route is
     /admin/o/<uuid>/home, and his own example is
     https://www.rec.us/admin/o/aeba47d0-c97f-49cb-a0e9-93c5af3a68fa/home
     A link that resolves to the wrong place is worse than no link, and this
     is the kind of thing only the person clicking it can tell you. */
  const REC_ADMIN_PATH = "/home";
  function ofRecAdminUrl(orgId) {
    return orgId ? "https://www.rec.us/admin/o/" + orgId + REC_ADMIN_PATH : null;
  }

  /* A category's adoption for one org. NULL when the category has no tracked
     features — settings can hide every feature in a group, and 0/0 is not
     "uses none of it". Same absent-is-not-zero rule as everywhere else. */
  function ofGroupScore(keys, isAdopted) {
    if (!keys || !keys.length) return null;
    const used = keys.filter(isAdopted).length;
    return { used, total: keys.length, pct: Math.round((used / keys.length) * 100) };
  }

  /* A RATIO ramp, deliberately not the pill scale. `heat()` is a LOG ramp
     over counts, where the question is "how big is this next to the biggest";
     here every cell is already a share of its own denominator, so a banded
     ramp is the honest one and 4/4 must look the same in a group of four as
     8/8 does in a group of eight.

     THE BANDS ARE DAN'S, verbatim: "green for 100%, orange for 60-90%, and
     red for <60%". 90-99 is not 100, so it is orange — a near-miss is still a
     gap, and inventing a fourth band for it would be inventing a rule he did
     not give.

     EVERY CELL GETS A PILL. The previous ramp faded to a WHITE pill at 0%,
     which on a white row is no pill at all — so one column rendered two
     different shapes for the same kind of value and Dan asked "why do some of
     the feature options have pills and others dont?". A 0/7 is a measurement
     and reads as one now.

     NULL IS STILL DIFFERENT, and that is not the same question. An empty
     group (every feature in it hidden by the settings) is UNMEASURED, so it
     gets the grey outline rather than a red pill claiming nobody uses
     something nobody is counting. */
  const RATIO_BANDS = [
    { min: 100, background: "var(--good-bg)", color: "var(--good-ink)", borderColor: "var(--good-edge)" },
    { min: 60,  background: "var(--orange-bg)", color: "var(--orange-ink-2)", borderColor: "var(--orange-edge)" },
    { min: 0,   background: "var(--bad-bg)", color: "var(--bad-ink)", borderColor: "var(--bad-edge)" },
  ];
  function ofRatioHeat(pct) {
    if (pct == null) return { background: "var(--fill)", color: "var(--faint)", borderColor: "var(--line)" };
    const b = RATIO_BANDS.find(x => pct >= x.min) || RATIO_BANDS[RATIO_BANDS.length - 1];
    return { background: b.background, color: b.color, borderColor: b.borderColor,
             fontWeight: 700 };
  }

  /* ---------------- org features: quick views ----------------
     Ten one-click scans, next to the single-org pulldown. Dan: "I need 'top
     orgs by adoption', 'lowest orgs by adoption', top 'sms users', top event
     users, that type of thing... so I can quickly scan which orgs are doing
     what."

     A quick view does TWO things — it scopes and it sorts — because "top SMS
     users" means both "only orgs sending SMS" and "busiest first". Scoping
     without sorting gives an alphabetical list of twenty orgs and no answer.

     WHICH FEATURES ARE HERE WAS MEASURED, not guessed. A "top users" scan is
     only worth a click where a handful of orgs dominate; `facility_rentals`
     is on 110 of 144 orgs and `group_reservation_windows` on 116, so a chip
     for either lists most of the platform and tells you nothing. Every
     feature below is on 16-57 orgs, with the top five holding 59-96% of the
     volume. Counts are from the 2026-09-07 bake:

       sms_messaging           20 orgs  (top 5 = 88% of sends)
       ticket_sales            23       (96%)
       rental_permits          23       (87%)
       competitions_leagues    24       (76%)
       payment_plans           37       (72%)
       ai_assistant            57       (59%)
       ai_routines             17       (84%)
       auto_renew_memberships  16       (76%)

     `ticket_sales` rather than `events` for the ticketing chip: an `event`
     row is a CONFIGURED event, so ranking by it puts whoever drafted the
     most events on top, while a confirmed ticket is a sale. */
  const OF_QUICK_VIEWS = [
    { id: "top",        label: "Top adoption",        kind: "rank", dir: -1, limit: 25,
      title: "The 25 highest adoption scores" },
    /* LIVE ONLY, and that is the point of the view rather than a detail. A
       pre-launch org at 2% is mid-configuration and not a finding; a LIVE org
       at 25% is. Without the filter this view is just the 71 unlaunched orgs. */
    { id: "lowest",     label: "Lowest adoption",     kind: "rank", dir: 1, limit: 25, liveOnly: true,
      title: "The 25 lowest adoption scores among organizations live on rec.us" },
    /* The other side of the same coin: of the orgs not yet live, who is
       furthest through configuration. */
    { id: "prelaunch",  label: "Pre-launch progress", kind: "rank", dir: -1, limit: 25, launched: false,
      title: "Organizations not yet live on rec.us, best configured first" },
    { id: "sms",        label: "SMS",                 kind: "feature", key: "sms_messaging",
      title: "Organizations sending SMS, by volume" },
    { id: "tickets",    label: "Selling tickets",     kind: "feature", key: "ticket_sales",
      title: "Organizations with confirmed ticket sales, by volume" },
    { id: "seb",        label: "Seb",                 kind: "feature", key: "ai_assistant",
      title: "Organizations using the AI assistant, by turns" },
    { id: "routines",   label: "Seb routines",        kind: "feature", key: "ai_routines",
      title: "Organizations with scheduled AI routines" },
    { id: "autorenew",  label: "Auto-renew",          kind: "feature", key: "auto_renew_memberships",
      title: "Organizations with auto-renewing membership plans" },
    { id: "plans",      label: "Payment plans",       kind: "feature", key: "payment_plans",
      title: "Organizations offering payment plans / installments" },
    { id: "leagues",    label: "Leagues",             kind: "feature", key: "competitions_leagues",
      title: "Organizations running competitions or leagues" },
    { id: "permits",    label: "Rental permits",      kind: "feature", key: "rental_permits",
      title: "Organizations issuing facility rental permits" },
  ];
  /* ── ANY FEATURE, NOT JUST THE EIGHT WITH A CHIP ────────────────────────
     The chips above are a measured shortlist and they are still the right
     shortlist — but they are also the ONLY way this page could be filtered by
     feature, so forty-nine of the fifty-seven tracked features had no control
     at all. "How many organizations use calendar sync" was unanswerable on a
     page whose entire subject is which organizations use what.

     A picked feature SYNTHESISES a view of exactly the shape a chip carries,
     so the chips and the picker both go through `ofApplyQuickView` and there
     is ONE scoping-and-sorting path rather than two that can drift apart —
     the same one-reducer-N-readers rule `ofDerive` already follows for the
     score. The id is namespaced `f:<key>` so it can never collide with a
     chip's own id, and `ofFeatureViewKey` is the single reader of that
     spelling: a second place that parses the prefix is a second chance to
     get it wrong. */
  function ofFeatureViewId(key) { return key ? "f:" + key : ""; }
  function ofFeatureViewKey(id) { const m = /^f:(.+)$/.exec(id || ""); return m ? m[1] : null; }
  function ofQuickView(id, label) {
    const v = OF_QUICK_VIEWS.find(x => x.id === id);
    if (v) return v;
    const key = ofFeatureViewKey(id);
    if (!key) return null;
    const name = (typeof label === "function" ? label(key) : null) || key;
    /* NO `limit`, deliberately. A ranked view is capped at 25 because "top
       adoption" is a leaderboard; "who uses calendar sync" is a complete
       answer and truncating it at 25 would silently drop organizations from
       a count the reader is about to act on. */
    return { id, key, kind: "feature", label: name, synthetic: true,
             title: "Organizations using " + name + ", by volume" };
  }

  /* A RING METER — Dan asked for "donut charts", and this is that shape done
     honestly. The dataviz guidance is blunt that a single ratio against a
     limit is a METER on a same-ramp track and NOT a two-slice pie, and all
     three tiles here are single ratios (35% of tracked features, 73 of 138
     live, 56 of 56 measured). So: one data arc on one recessive track, with
     the number in the middle. No second slice competing for attention, which
     is the actual anti-pattern.

     THE ARC CARRIES THE COLOUR AND THE NUMBER STAYS IN INK. "Text wears text
     tokens, never the series colour" — the ring sits millimetres from the
     figure, so nothing is lost by not painting both.

     Pure SVG: no library, so it cannot fail to load, and it scales with the
     card rather than being a fixed bitmap. */
  function Ring({ pct, label, color, size, stroke }) {
    const S2 = size || 76, W = stroke || 9, R = (S2 - W) / 2, C = 2 * Math.PI * R;
    // A null ratio draws the track ALONE. "We could not measure this" must
    // not render as a confident zero — the same absent-is-not-zero rule the
    // rest of this page follows.
    const p = pct == null ? null : Math.max(0, Math.min(100, pct));
    return e("svg", { width: S2, height: S2, viewBox: "0 0 " + S2 + " " + S2,
                      className: "ring", role: "img",
                      "aria-label": label || ((p == null ? "not measured" : p + "%")) },
      e("circle", { cx: S2 / 2, cy: S2 / 2, r: R, fill: "none", stroke: "var(--track)", strokeWidth: W }),
      p == null ? null : e("circle", {
        cx: S2 / 2, cy: S2 / 2, r: R, fill: "none",
        stroke: color || "var(--brand)", strokeWidth: W, strokeLinecap: "round",
        strokeDasharray: C.toFixed(2),
        strokeDashoffset: (C * (1 - p / 100)).toFixed(2),
        // Start at twelve o'clock and run clockwise, which is how a
        // progress ring is read.
        transform: "rotate(-90 " + (S2 / 2) + " " + (S2 / 2) + ")" }));
  }

  /* One tile: the ring on the left, the figure and its context on the right.
     The figure is NOT inside the ring — at 76px a five-character value
     ("56 / 56") does not fit inside a 9px-stroked circle without shrinking to
     unreadable, and a KPI's number should be the biggest thing on the tile. */
  function RingCard({ k, pct, value, sub, color, title }) {
    return e("div", { className: "card ringcard", title: title || "" },
      e(Ring, { pct, color, label: k + ": " + value }),
      e("div", { className: "ringtext" },
        e("div", { className: "k" }, k),
        e("div", { className: "v", "data-ring-v": value }, value),
        sub ? e("div", { className: "d" }, sub) : null));
  }

  /* Column sort for the org table. PURE and taking its accessor as an
     argument, so a spec can run it — the mistake that matters is a direction,
     and a regex over a comparator cannot see one.

     FIRST CLICK ON A NUMBER GOES DESCENDING, on a name ascending. Clicking
     "Payments" means "who uses the most of it", and making the reader click
     twice for the obvious question is the kind of small wrongness that makes
     a control feel broken. `numeric` says which kind of column it is.

     A NULL NEVER SORTS AS A VALUE. An unmeasured org has no score, and
     letting null compare as 0 puts "we cannot tell" at one end of the list
     under a heading that claims to rank. Nulls go LAST in both directions,
     which is the only arrangement that is honest either way round. */
  function ofSortRows(rows, key, dir, getVal, numeric, tieBreak) {
    /* THE TIE-BREAK IS AN ARGUMENT so one sorter serves both tables. It used
       to reach into `r.o.displayName`, which a FEATURE row does not have —
       a second copy of this for the feature table would be a second place for
       a direction to be wrong, and a direction is the only mistake here that
       matters. */
    const tb = tieBreak || (r => String((r.o && (r.o.displayName || r.o.name || r.o.slug)) || ""));
    const withNull = [], withVal = [];
    for (const r of rows) {
      const v = getVal(r, key);
      (v == null ? withNull : withVal).push({ r, v });
    }
    withVal.sort((a, b) => {
      const c = numeric ? (a.v - b.v)
        : String(a.v).localeCompare(String(b.v), undefined, { numeric: true, sensitivity: "base" });
      // Name as the tie-break, so two runs of one sort cannot disagree.
      return (c || 0) * dir || tb(a.r).localeCompare(tb(b.r));
    });
    withNull.sort((a, b) => tb(a.r).localeCompare(tb(b.r)));
    return withVal.concat(withNull).map(x => x.r);
  }
  // The first direction a column takes when it has not been clicked yet.
  function ofFirstDir(numeric) { return numeric ? -1 : 1; }

  /* Scope and order for one quick view. PURE, and taking its inputs as
     arguments, so a spec can RUN it over fixtures — a regex over a comparator
     passes just as happily when the comparison is inverted, which is the one
     mistake that matters here ("lowest" showing the top).

     `rows` are already decorated ({ o, score, usage }) and already scoped to
     the settings, so a quick view can never widen past an exclusion. */
  function ofApplyQuickView(view, rows, countOf) {
    if (!view) return { rows, note: null, capped: false };
    let out = rows.slice();

    if (view.kind === "rank") {
      /* AN UNSCORED ORG IS NOT THE LOWEST-ADOPTION ORG. `scoreOf` returns
         null when the bake never measured that org, and letting a null sort
         to one end would put "we cannot tell" at the top of a list titled
         "Lowest adoption". Same absent-is-not-zero rule as everywhere else. */
      out = out.filter(r => r.score != null);
      if (view.liveOnly) out = out.filter(r => r.o.launched);
      if (view.launched === false) out = out.filter(r => !r.o.launched);
      // Name as the tie-break, so two runs of the same view cannot disagree.
      out.sort((a, b) => (a.score - b.score) * view.dir
        || (a.o.displayName || a.o.name || a.o.slug).localeCompare(b.o.displayName || b.o.name || b.o.slug));
    } else {
      // A "top users" view keeps only orgs that USE the thing — otherwise
      // "top SMS users" is a list of 124 organizations sending none.
      out = out.filter(r => countOf(r.o.slug, view.key) > 0);
      out.sort((a, b) => countOf(b.o.slug, view.key) - countOf(a.o.slug, view.key)
        || (a.o.displayName || a.o.name || a.o.slug).localeCompare(b.o.displayName || b.o.name || b.o.slug));
    }

    const total = out.length;
    const capped = view.limit != null && total > view.limit;
    if (capped) out = out.slice(0, view.limit);
    return { rows: out, total, capped };
  }

  /* ── THE TWO SLICES OF ONE DATASET ────────────────────────────────────
     Dan: "Right now it's scoped to orgs, but we need a different slice of the
     metric, by feature. Build that out as a separate tab on the same Org
     Features page if needed."

     A separate ROUTE rather than local tab state, so the slice is linkable,
     survives a refresh and can be sent to someone — the same reason the org
     drill-in is a route. The strip is what makes each findable from the
     other; without it the feature slice is a URL only its author knows. */
  const OF_SLICES = [
    { href: "/ps/features", page: "features", label: "By organization",
      hint: "how much of the platform each organization uses" },
    { href: "/ps/feature", page: "featurelist", label: "By feature",
      hint: "how far each feature has spread across the fleet" },
  ];
  /* ── WHEN THIS DATA IS FROM ───────────────────────────────────────────
     ONE definition, because both slices read the same snapshot and a second
     copy is a second place for the stale warning to go missing. It did: the
     by-feature page shipped its own as-of line without the link, and the
     spec's slice caught it by matching the new copy instead of the old one.

     It states the AGE, measured, rather than claiming "refreshed daily" — a
     standing promise this project has already broken once. The sidebar's
     snapshot line describes the PS/bugs snapshot, a different file on a
     different schedule, and reading that instead is how the features snapshot
     sat 16 days stale without anyone noticing. */
  function AsOf({ generatedAt, note }) {
    return e("div", { className: "asof", "data-feat-asof": snapAgeDays(generatedAt) },
      e("span", null, e("b", null, "Data as of "),
        generatedAt ? new Date(generatedAt).toLocaleString("en-US",
          { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" })
          : "an unreadable date"),
      snapStale(generatedAt)
        // A WARNING WHOSE FIX A HUMAN MUST PERFORM CARRIES THE LINK to perform
        // it. The bake is a GitHub Action, so a missed refresh is a red X on a
        // page one click away.
        ? e("span", { className: "asof-stale" }, "\u26a0 " + snapAgeLabel(generatedAt),
            " \u2014 the nightly bake may have failed. ",
            e("a", { href: "https://github.com/danj707/org-features/actions/workflows/refresh-features.yml",
                     target: "_blank", rel: "noopener" }, "Check the last run"))
        : e("span", { className: "asof-age" }, "\u00b7 " + snapAgeLabel(generatedAt)),
      e("span", { className: "asof-src" },
        note || "Baked from the production read replica, daily at 6am ET"));
  }

  function SliceTabs({ page }) {
    return e("div", { className: "slicetabs", "data-of-slice": page },
      OF_SLICES.map(sl => link(sl.href,
        e(React.Fragment, null, sl.label, e("i", null, sl.hint)),
        "slicetab" + (sl.page === page ? " on" : ""))));
  }

  // ---------------- theme ----------------
  /* THE PURE HALF IS SEPARATE FROM THE BROWSER HALF, so the rules can be run
     by a spec rather than regexed. `themeStamp` and `themeEffective` take
     what they need as arguments and touch nothing; only the three wrappers
     under them reach for localStorage, matchMedia and the <html> element. */
  const THEME_KEY = "psTheme";
  /* AN UNRECOGNISED STORED VALUE IS NO CHOICE AT ALL, not a default to light.
     Anything but the two names we write falls back to following the OS, so a
     corrupted or hand-edited key degrades to the same behaviour as a viewer
     who has never touched the toggle. */
  function themeStamp(stored) { return stored === "light" || stored === "dark" ? stored : null; }
  /* WHAT THE VIEWER IS ACTUALLY LOOKING AT — a pinned choice if there is one,
     otherwise whatever the OS says. The control labels itself from THIS, not
     from the stored value, or an unpinned viewer on a dark machine would see
     a control claiming Light while the page is dark. */
  function themeEffective(stored, osDark) { return themeStamp(stored) || (osDark ? "dark" : "light"); }

  function themeStored() {
    try { return themeStamp(localStorage.getItem(THEME_KEY)); } catch (_) { return null; }
  }
  function themeOsDark() {
    try { return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }
    catch (_) { return false; }
  }
  /* WRITES THE STAMP THE SAME WAY THE <head> SCRIPT DOES. Two writers of one
     attribute is how a toggle and a reload come to disagree about the theme,
     so the shape is identical: the two names set it, anything else removes
     it and hands the page back to the media query. */
  function themeApply(t) {
    const el = document.documentElement;
    if (themeStamp(t)) el.setAttribute("data-theme", t); else el.removeAttribute("data-theme");
  }

  /* The OS listener only speaks while NOTHING is pinned. A viewer who chose
     Light and then unlocks a dark laptop must stay light — that is what
     choosing means — so the handler re-reads the stored value rather than
     trusting a captured one. */
  function useTheme() {
    const [t, setT] = React.useState(() => themeEffective(themeStored(), themeOsDark()));
    React.useEffect(() => {
      let mq;
      try { mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)"); } catch (_) {}
      if (!mq) return;
      const on = () => { if (!themeStored()) setT(themeOsDark() ? "dark" : "light"); };
      if (mq.addEventListener) mq.addEventListener("change", on); else if (mq.addListener) mq.addListener(on);
      return () => {
        if (mq.removeEventListener) mq.removeEventListener("change", on);
        else if (mq.removeListener) mq.removeListener(on);
      };
    }, []);
    const set = (next) => {
      try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
      themeApply(next);
      setT(next);
    };
    return [t, set];
  }

  /* TWO BUTTONS, NOT ONE. A single button has to be labelled either with the
     mode you are in or the mode you would get, and every reader guesses the
     other one — the same argument .slicetab already makes for filling the
     active tab rather than underlining it. Both options are on screen, the
     live one is filled, and there is nothing to work out. */
  function ThemeToggle() {
    const [theme, setTheme] = useTheme();
    const opt = (id, label, glyph) => e("button", {
      key: id, type: "button", className: "themebtn" + (theme === id ? " on" : ""),
      "aria-pressed": theme === id, title: "Switch to " + label.toLowerCase() + " mode",
      onClick: () => setTheme(id),
    }, e("span", { "aria-hidden": "true" }, glyph), label);
    return e("div", { className: "themesw", role: "group", "aria-label": "Colour theme",
                      "data-of-theme": theme },
      opt("light", "Light", "\u2600"), opt("dark", "Dark", "\u263e"));
  }

  function route() {
    const p = location.pathname;
    if (p.startsWith("/ps/bugs")) return { page: "bugs" };
    if (p.startsWith("/ps/reporting")) return { page: "reporting" };
    if (p.startsWith("/ps/remittance")) return { page: "remittance" };
    if (p.startsWith("/ps/admin")) return { page: "admin" };
    /* ONE FEATURE ACROSS EVERY ORG, on its own prefix rather than nested
       inside the drill-in's. The drill-in below already owns every path
       under the plural prefix, so a nested spelling would make this a matter
       of which regex is tested first — and an ordering dependency between
       two routes is the shape that quietly sends one of them to the wrong
       page. A different prefix cannot collide at all. (The spec asserts the
       nested spelling is absent, so it must not be written out even in a
       comment.) */
    if (p === "/ps/feature" || p === "/ps/feature/") return { page: "featurelist" };
    const fk = p.match(/^\/ps\/feature\/(.+)$/);
    if (fk) return { page: "feature", key: decodeURIComponent(fk[1]) };
    /* BEFORE the bare prefix test, which would otherwise swallow the slug
       and land every drill-in back on the list. */
    const fm = p.match(/^\/ps\/features\/(.+)$/);
    if (fm) return { page: "featureorg", slug: decodeURIComponent(fm[1]) };
    if (p.startsWith("/ps/features")) return { page: "features" };
    if (p.startsWith("/ps/how")) return { page: "how" };
    if (p.startsWith("/ps/updates")) return { page: "updates" };
    const m = p.match(/^\/ps\/org\/(.+)$/);
    if (m) return { page: "org", id: decodeURIComponent(m[1]) };
    return { page: "health" };
  }
  function nav(to) { history.pushState({}, "", to); window.dispatchEvent(new Event("popstate")); }
  function link(href, children, cls) {
    return e("a", { href, className: cls, onClick: (ev) => { ev.preventDefault(); nav(href); } }, children);
  }

  /* ACCOUNT HEALTH'S OWN score ramp, and deliberately not the Org Features
     one below. `a.adoptionScore` there comes from ps-data and is a different
     measurement on a different scale; routing both through one function would
     couple two unrelated numbers, so that a grade ramp tuned to the feature
     fleet silently re-coloured a HubSpot figure. */
  function scoreColor(p) { return p >= 70 ? "var(--good)" : p >= 40 ? "var(--warn)" : "var(--bad)"; }

  /* ---------------- the adoption GRADE ----------------
     Dan: "yeah the percentage is nice, but I want a letter grade, something
     that's easy to digest as a noob."

     THE RAMP IS CURVED TO THE FLEET, NOT THE AMERICAN SCHOOL SCALE, and that
     is a measurement rather than a preference. Measured 2026-09-07 over all
     144 orgs: the best org on the platform scores 96% and the best LIVE one
     89%, the live median is 57% and the live mean 50%. On a 90/80/70/60 ramp
     NO live org earns an A and 44 of 73 get an F — a scale whose modal grade
     is F carries no information, and it is indefensible on a page handed to a
     Director.

     At 75/60/45/25 the 73 live orgs spread A 8 · B 21 · C 18 · D 14 · F 12,
     so an A really is the top tenth of the fleet and an F means a LAUNCHED org
     has configured under a quarter of the platform.

     ANYTHING THAT PRINTS A GRADE MUST PRINT WHAT IT IS GRADED AGAINST. A bare
     "C" reads as an absolute judgement against a 100% nobody reaches, so
     GRADE_BASIS travels with it. */
  const GRADE_RAMP = [
    { min: 75, letter: "A", color: "var(--good-ink-2)", band: "var(--good-bg)",
      says: "Getting nearly everything out of the platform" },
    { min: 60, letter: "B", color: "var(--good)", band: "var(--good-bg-2)",
      says: "Strong adoption, with room in a few areas" },
    { min: 45, letter: "C", color: "var(--warn-ink)", band: "var(--warn-bg)",
      says: "The core is in place; several areas are untouched" },
    { min: 25, letter: "D", color: "var(--orange-ink-3)", band: "var(--orange-bg-2)",
      says: "Running on a fraction of what is available" },
    { min: 0,  letter: "F", color: "var(--bad)", band: "var(--bad-bg-2)",
      says: "Most of the platform is not configured yet" },
  ];
  const GRADE_BASIS = "Graded against what organizations on rec.us actually reach today, "
    + "not a 90/80/70 school scale — the highest score on the whole platform is 96%.";
  /* NULL, NEVER AN F. An org with no adoption record, or a settings state with
     nothing ticked, is UNMEASURED — and "we cannot tell" printed as an F is
     the worst possible reading of it. Same rule as every other absent-is-not-
     zero gate in this app. */
  function ofGrade(pct) {
    if (pct == null || typeof pct !== "number" || !isFinite(pct)) return null;
    return GRADE_RAMP.find(g => pct >= g.min) || GRADE_RAMP[GRADE_RAMP.length - 1];
  }
  function ofGradeColor(pct) { const g = ofGrade(pct); return g ? g.color : "var(--faint)"; }

  /* ---------------- the FEATURE adoption grade ----------------
     Dan: "we also need a way to track feature adoption in general, like a
     sparkline or metric showing 'Calendar Sync - 15% adoption, F-, trending
     up'... Right now it's scoped to orgs, but we need a different slice."

     A SEPARATE RAMP, AND THAT IS THE LOAD-BEARING DECISION. The ramp above is
     curved to what an ORGANIZATION scores across 57 features; this one is
     curved to how far a FEATURE spreads across 73 live organizations. They are
     different questions over different denominators, and routing both through
     one constant means a ramp tuned to one silently re-grades the other — the
     same reason Account Health keeps `scoreColor` rather than reusing
     `ofGradeColor`.

     CURVED TO THE QUINTILES OF THE MEASURED DISTRIBUTION. Over the 60
     measured features against 73 live orgs (2026-09-11): min 0%, median 50%,
     mean 48.8%, max 99% — facility rentals, on 72 of 73. The 20/40/60/80th
     percentiles fall at 22 / 41 / 59 / 81, so the ramp is the round numbers
     nearest them and each grade is about a fifth of the catalog: A 12 · B 10 ·
     C 14 · D 13 · F 11.

     IT STARTED IDENTICAL TO THE ORG RAMP AND NO LONGER IS, which is the
     argument for the separate constant making itself. Adding three features
     on 2026-09-11 — two of them barely adopted — made F the commonest grade
     on the old thresholds (F 15 against A 14), and a scale whose modal grade
     is F carries no information. Sharing one constant with the org ramp would
     have meant re-curving THAT to fix THIS. The spec measures the spread
     rather than trusting this paragraph, which is how the problem was caught.

     THE COPY IS NOT THE ORG COPY. "Getting nearly everything out of the
     platform" is a sentence about an organization and nonsense about a
     feature, so every `says` here is about fleet penetration instead. */
  const FEATURE_GRADE_RAMP = [
    { min: 80, letter: "A", color: "var(--good-ink-2)", band: "var(--good-bg)",
      says: "Standard equipment — nearly every live organization has this" },
    { min: 60, letter: "B", color: "var(--good)", band: "var(--good-bg-2)",
      says: "Widely adopted, with a real tail left to convert" },
    { min: 40, letter: "C", color: "var(--warn-ink)", band: "var(--warn-bg)",
      says: "About half the fleet; the rest is addressable" },
    { min: 20, letter: "D", color: "var(--orange-ink-3)", band: "var(--orange-bg-2)",
      says: "Early — a minority have turned it on" },
    { min: 0,  letter: "F", color: "var(--bad)", band: "var(--bad-bg-2)",
      says: "Barely adopted — new, niche, or not landing" },
  ];
  const FEATURE_GRADE_BASIS = "Graded against how far features actually spread on rec.us, "
    + "not a 90/80/70 school scale — the bands are the quintiles of the catalog, so the "
    + "most-adopted feature reaches 99% of live organizations and the median reaches 50%.";
  // NULL, NEVER AN F — same absent-is-not-zero rule as the org grade.
  function ofFeatureGrade(pct) {
    if (pct == null || typeof pct !== "number" || !isFinite(pct)) return null;
    return FEATURE_GRADE_RAMP.find(g => pct >= g.min) || FEATURE_GRADE_RAMP[FEATURE_GRADE_RAMP.length - 1];
  }
  function ofFeatureGradeColor(pct) { const g = ofFeatureGrade(pct); return g ? g.color : "var(--faint)"; }
  /* The badge. `size` so one component serves a table cell, a KPI card and the
     printed report rather than three that drift apart. */
  /* ONE COMPONENT, TWO SCALES. How a grade is DRAWN is shared — a pill, the
     band colour, the basis in the tooltip — and which ramp it is read off is
     an argument, because the org scale and the feature scale are different
     measurements that must be free to move apart. */
  function Grade({ pct, size, showSays, ramp, basis }) {
    const g = ramp === "feature" ? ofFeatureGrade(pct) : ofGrade(pct);
    if (!g) return null;
