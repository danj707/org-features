        e("div", { className: "card" }, e("div", { className: "k" }, "Tagged to accounts"), e("div", { className: "v" }, bugs.filter(b => b.customers.length).length), e("div", { className: "d" }, "have ≥1 Linear customer attached")),
        e("div", { className: "card" }, e("div", { className: "k" }, "Created WoW"), e("div", { className: "v", style: { paddingTop: 4 } }, e(Spark, { series: wow.map(w => ({ month: w.label, count: w.count })) })), e("div", { className: "d" }, "8-week trend"))),
      e("div", { className: "panel" },
        e("h2", null, "Open bugs", e("span", { className: "hint" }, "search before filing — avoid duplicates · click through to Linear to tag more customers")),
        e("div", { className: "filters" },
          e("input", { type: "text", placeholder: "Search title, ID, account… (dupe check)", value: q, onChange: ev => setQ(ev.target.value) }),
          e("select", { value: team, onChange: ev => setTeam(ev.target.value) }, e("option", { value: "" }, "All teams"), teams.map(t => e("option", { key: t, value: t }, t))),
          e("select", { value: pri, onChange: ev => setPri(ev.target.value) }, e("option", { value: "" }, "All priorities"), ["Urgent", "High", "Medium", "Low", "No priority"].map(p => e("option", { key: p, value: p }, p))),
          e("select", { value: who, onChange: ev => setWho(ev.target.value) }, e("option", { value: "" }, "All reporters"), reporters.map(r => e("option", { key: r, value: r }, r))),
          e("label", { className: "chk" }, e("input", { type: "checkbox", checked: onlyCust, onChange: ev => setOnlyCust(ev.target.checked) }), "has account")),
        e("div", { className: "tablewrap" }, e("table", null,
          e("thead", null, e("tr", null, e("th", { className: "l" }, "Bug"), e("th", { className: "l" }, "Priority"), e("th", { className: "l" }, "Status"), e("th", { className: "l" }, "Team"), e("th", null, "Age"), e("th", { className: "l" }, "Accounts"), e("th", { className: "l" }, "Reporter"))),
          e("tbody", null, filtered.map(b => e("tr", { key: b.id },
            e("td", { className: "wraptxt l" }, e("a", { href: b.url, target: "_blank", title: "Open in Linear (tag customers there)" }, e("b", null, b.id), " ", b.title)),
            e("td", { className: "l" }, e("span", { className: "pill " + PRI_CLASS[b.priority] }, b.priority)),
            e("td", { className: "l" }, b.status),
            e("td", { className: "l" }, b.team),
            e("td", { className: "num", style: b.ageDays > 90 ? { color: "#dc2626", fontWeight: 700 } : null }, b.ageDays + "d"),
            e("td", { className: "l", style: { whiteSpace: "normal", maxWidth: 240 } }, b.customers.length ? b.customers.map((c, i) => e("span", { key: i, className: "chip" }, c)) : e("span", { className: "zero" }, "—")),
            e("td", { className: "l", style: { color: "#64748b" } }, b.createdBy || "—")))))),
        filtered.length === 0 ? e("div", { className: "note" }, "No bugs match — good sign, or loosen the filters.") : null));
  }

  // ---------------- CX Reporting (launch Gantt) ----------------
  function Reporting({ data }) {
    const launched = data.accounts.filter(a => a.closeDate && a.status).slice()
      .sort((x, y) => new Date(x.closeDate) - new Date(y.closeDate));
    const min = launched.length ? new Date(launched[0].closeDate) : new Date();
    const max = new Date();
    const span = Math.max(1, max - min);
    const COLORS = { "Launched R&R": "#16a34a", "Launched Pilot": "#4ade80", "Configuration": "#f59e0b", "Discovery": "#93c5fd", "Delayed/Deferred": "#dc2626" };
    return e(React.Fragment, null,
      e("div", { className: "panel" },
        e("h2", null, "Launch timeline ", e("span", { className: "tag-sample" }, "stand-in data"),
          e("span", { className: "hint" }, "bar = close date → today, colored by current account status. Real launch dates live on HubSpot deals — wiring that is a v2 task.")),
        e("div", { className: "gantt" }, launched.map(a => {
          const left = ((new Date(a.closeDate) - min) / span) * 100;
          return e("div", { className: "grow", key: a.hubspotId },
            e("div", { className: "nm" }, a.name),
            e("div", { className: "gbar" }, e("i", { style: { left: left + "%", right: 0, background: COLORS[a.status] || "#94a3b8" } })));
        })),
        e("div", { className: "legend" }, Object.entries(COLORS).map(([k, v]) => e("span", { key: k }, e("i", { style: { background: v } }), k)))),
      e("div", { className: "panel" },
        e("h2", null, "Coming next"),
        e("div", { className: "note" }, "Team-level reporting lands here: launches per quarter, bug time-spent WoW, Intercom support-case volume by type, NPS. Tell Claude what to prioritize.")));
  }

  // ---------------- Admin · user management ----------------
  function Admin({ me }) {
    const [users, setUsers] = useState(null);
    const [err, setErr] = useState("");
    const load = () => fetch("/api/admin/users").then(r => r.json()).then(d => setUsers(d.users || []));
    useEffect(() => { load(); }, []);
    const update = (id, patch) => {
      setErr("");
      fetch("/api/admin/users/" + id, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch) })
        .then(r => r.json().then(d => { if (!r.ok) setErr(d.error || "update failed"); load(); }));
    };
    if (!users) return e("div", { className: "note" }, "Loading…");
    return e("div", { className: "panel" },
      e("h2", null, "Users", e("span", { className: "hint" }, "admins can view everything and manage users; users can view dashboards")),
      err ? e("div", { className: "note", style: { color: "#dc2626" } }, err) : null,
      e("div", { className: "tablewrap" }, e("table", null,
        e("thead", null, e("tr", null, e("th", { className: "l" }, "Name"), e("th", { className: "l" }, "Email"), e("th", { className: "l" }, "Role"), e("th", { className: "l" }, "Status"), e("th", { className: "l" }, "Joined"))),
        e("tbody", null, users.map(u => e("tr", { key: u.id },
          e("td", { className: "name" }, u.name, u.id === me.id ? e("span", { className: "hint" }, " (you)") : null),
          e("td", { className: "l" }, u.email),
          e("td", { className: "l" }, e("select", { value: u.role, disabled: u.id === me.id, onChange: ev => update(u.id, { role: ev.target.value }) },
            e("option", { value: "user" }, "user"), e("option", { value: "admin" }, "admin"))),
          e("td", { className: "l" }, e("label", { className: "chk" },
            e("input", { type: "checkbox", checked: u.active, disabled: u.id === me.id, onChange: ev => update(u.id, { active: ev.target.checked }) }), u.active ? "active" : "deactivated")),
          e("td", { className: "l", style: { color: "#64748b" } }, (u.createdAt || "").slice(0, 10))))))));
  }

  function App() {
    const [data, setData] = useState(null);
    const [me, setMe] = useState(null);
    const [r, setR] = useState(route());
    useEffect(() => {
      fetch("/api/auth/me").then(x => {
        if (x.status === 401) { location.href = "/login"; return null; }
        return x.json();
      }).then(d => d && setMe(d.user));
      fetch("/api/ps-data").then(x => x.status === 401 ? null : x.json()).then(d => d && setData(d));
      const f = () => setR(route());
      window.addEventListener("popstate", f);
      return () => window.removeEventListener("popstate", f);
    }, []);
    const signOut = () => fetch("/api/auth/logout", { method: "POST" }).then(() => location.href = "/login");
    if (!data || !me) return e("div", { className: "note" }, "Loading…");

    const item = (href, label, active, cnt) => link(href, [label, cnt != null ? e("span", { key: "c", className: "cnt" }, cnt) : null], "item" + (active ? " active" : ""));
    const titles = { health: ["Account Health", "PS/CX snapshot of every account — bugs, adoption, requests, engagement"], bugs: ["Bug Management", "All open bugs · categorize, deduplicate, and jump to Linear"], reporting: ["CX Team Reporting", "Launches and team-level metrics"], org: ["Account Health", "Account drill-in"], admin: ["Admin", "User management"] };
    return e("div", { className: "layout" },
      e("nav", { className: "side" },
        e("div", { className: "logo" }, "rec ", e("span", null, "· PS dashboard")),
        e("div", { className: "sec" }, "Partner success"),
        item("/ps", "Account Health", r.page === "health" || r.page === "org"),
        item("/ps/bugs", "Bug Management", r.page === "bugs", data.bugs.length),
        item("/ps/reporting", "CX Reporting", r.page === "reporting"),
        e("div", { className: "sec" }, "Platform"),
        e("a", { className: "item", href: "/" }, "Org Features →"),
        me.role === "admin" ? e(React.Fragment, null, e("div", { className: "sec" }, "Admin"), item("/ps/admin", "Users", r.page === "admin")) : null,
        e("div", { className: "foot" },
          e("div", null, "Signed in as ", e("b", { style: { color: "#cbd5e1" } }, me.name), " (" + me.role + ")"),
          e("a", { href: "#", onClick: (ev) => { ev.preventDefault(); signOut(); }, style: { color: "#6ee7b7" } }, "Sign out"),
          e("div", { style: { marginTop: 8 } }, "Snapshot " + new Date(data.generatedAt).toLocaleString() + " · refreshed daily"))),
      e("main", null,
        e("header", { className: "top" }, e("h1", null, titles[r.page][0]), e("div", { className: "sub" }, titles[r.page][1])),

          e("div", { className: "foot" }, "Sources: Linear (bugs + customer tags) · HubSpot (status, health, engagement) · Airtable (feature requests) · rec prod replica (adoption). Intercom interactions/NPS not wired yet."))));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(e(App));
})();
