  /* ── ORG FEATURES, IN THE SHELL ──────────────────────────────────────────
     Reads /api/data, the same public snapshot the standalone dashboard reads,
     so there is ONE source and the two surfaces cannot disagree about an
     adoption score. Rows expand in place rather than linking out: the whole
     point of this view is that the nav item stops throwing you out of the
     shell, and a drill-in that navigated away would reintroduce that. */
  /* ── ORG FEATURES SETTINGS ──────────────────────────────────────────────
     SHARED BY EVERY USER (Dan's call), so it lives server-side rather than in
     localStorage and the sheet says so on screen. It is a VIEW preference and
     never a gate: hiding a feature or excluding an org changes what this page
     shows and what its score is taken over, and changes nothing about the
     bake — everything hidden is still in /api/data. That is why the default
     is "show everything" and why a failed load falls back to it rather than
     to empty. Failing the other way would render an empty dashboard and look
     like the snapshot had gone. */
  const OF_DEFAULT_SETTINGS = { hiddenFeatures: [], excludedOrgs: [] };

  function Features({ slug }) {
    const [d, setD] = useState(null);
    const [err, setErr] = useState(null);
    const [cfg, setCfg] = useState(null);        // null until the fetch settles
    const [cfgErr, setCfgErr] = useState(null);
    const [only, setOnly] = useState("");
    const [qv, setQv] = useState("");
    // [key, dir] or null. Null means "whatever the quick view or the default
    // alphabetical order says" — a header click OVERRIDES the order but never
    // the scope, so sorting inside "Top SMS users" still shows only those 20.
    const [sort, setSort] = useState(null);
    const [cmpA, setCmpA] = useState("");
    const [cmpB, setCmpB] = useState("");
    const [open, setOpen] = useState(null);
    const [showSettings, setShowSettings] = useState(false);

    useEffect(() => {
      fetch("/api/data")
        .then(r => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
        .then(setD).catch(e => setErr(e.message));
      fetch("/api/org-features-settings")
        .then(r => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
        .then(x => setCfg(x))
        .catch(e => { setCfgErr(e.message); setCfg(OF_DEFAULT_SETTINGS); });
    }, []);

    if (err) return e("div", { className: "note" }, "Could not load the features snapshot: " + err);
    if (!d || !cfg) return e("div", { className: "note" }, "Loading feature adoption\u2026");

    const hidden = new Set(cfg.hiddenFeatures || []);
    const excluded = new Set(cfg.excludedOrgs || []);

    const total = (d.features || []).length;
    const byKey = {};
    (d.features || []).forEach(f => { byKey[f.key || f.id || f.name] = f; });
    const label = k => (byKey[k] && (byKey[k].name || byKey[k].label)) || k;

    // The measured set, minus whatever is unticked. THE SCORE IS TAKEN OVER
    // THIS, which is the whole point of the setting — "how adopted is this
    // org" only means something against the features you care about.
    const allMeasured = d.measuredFeatures || [];
    const shown = allMeasured.filter(k => !hidden.has(k));

    const adoptedIn = (slug, k) => {
      const v = ((d.adoption || {})[slug] || {})[k];
      return !!(v && (v === true || v.adopted === true || Number(v.count) > 0));
    };
    const scoreOf = (slug) => {
      const a = (d.adoption || {})[slug];
      if (!a) return null;                      // unmeasured is not zero
      if (!shown.length) return null;           // nothing ticked is not 0%
      return Math.round((shown.filter(k => adoptedIn(slug, k)).length / shown.length) * 100);
    };

    const orgName = o => o.displayName || o.name || o.slug;
    const everyOrg = (d.orgs || []).slice().sort((a, b) => orgName(a).localeCompare(orgName(b)));
    // Excluded orgs leave EVERY surface — the table, the pulldown, both
    // compare slots, the fleet average and the count — or the page disagrees
    // with itself about how many orgs there are.
    const all = everyOrg.filter(o => !excluded.has(o.slug));

    /* GROUPS ARE DERIVED FROM THE CATALOG, in the catalog's own order, and
       only over TRACKED features — a group whose features the settings have
       all hidden gets no column at all rather than a permanent 0/0. */
    const groups = (d.featureCategories || [])
      .map(cat => ({ cat, keys: shown.filter(k => byKey[k] && byKey[k].category === cat) }))
      .filter(g => g.keys.length > 0);

    const notUsing = (s2) => shown.filter(k => !adoptedIn(s2, k));
    const detailOf = (s2, k) => (((d.adoption || {})[s2] || {})[k] || {}).detail || "";

    const adminLink = (o) => {
      const href = ofRecAdminUrl(o.id);
      return href ? e("a", { className: "adminlink", href, target: "_blank", rel: "noopener",
                             title: "Open " + orgName(o) + " in the Rec admin",
                             // The row itself navigates to the drill-in, so a
                             // click on the link must not do both.
                             onClick: ev => ev.stopPropagation() }, "admin \u2197") : null;
    };

    const decorate = o => ({ o, score: scoreOf(o.slug), usage: (d.usage || {})[o.slug] || {} });
    const countOf = (s2, k) => Number((((d.adoption || {})[s2] || {})[k] || {}).count || 0);

    /* THE QUICK VIEW IS APPLIED TO `all`, which is already settings-scoped,
       so no view can widen the page past an excluded org. The default order
       stays ALPHABETICAL — a quick view re-sorts, it does not redefine how
       the list opens. */
    const view = ofQuickView(qv);
    const qvOut = ofApplyQuickView(view, all.filter(o => !only || o.slug === only).map(decorate), countOf);

    /* A HEADER CLICK OVERRIDES THE ORDER, NOT THE SCOPE. Sorting inside "Top
       SMS users" re-orders those 20 orgs; it does not bring the other 124
       back. The quick view is applied first and this re-sorts its output. */
    const groupPct = (r, cat) => {
      const g = groups.find(x => x.cat === cat);
      const gs = g && ofGroupScore(g.keys, k => adoptedIn(r.o.slug, k));
      return gs ? gs.pct : null;
    };
    const sortVal = (r, key) =>
      key === "name" ? (r.o.displayName || r.o.name || r.o.slug)
      : key === "score" ? r.score
      : groupPct(r, key);
    const numericCol = (key) => key !== "name";
    const rows = sort
      ? ofSortRows(qvOut.rows, sort[0], sort[1], sortVal, numericCol(sort[0]))
      : qvOut.rows;

    /* One header renderer for all fourteen columns, so the arrow and the
       click cannot drift apart — the same idiom the Account Health table
       already uses, and deliberately identical so the two tables behave the
       same way under a click. */
    const sortTh = (label, key, extra) => e("th", Object.assign({
      onClick: () => setSort(s2 => [key, s2 && s2[0] === key ? -s2[1] : ofFirstDir(numericCol(key))]),
      style: { cursor: "pointer" },
      "data-feat-th": key,
      "data-feat-thdir": sort && sort[0] === key ? (sort[1] < 0 ? "desc" : "asc") : "",
    }, extra || {}), label + (sort && sort[0] === key ? (sort[1] < 0 ? " \u2193" : " \u2191") : ""));

    /* A CHIP WITH NOTHING BEHIND IT IS NOT OFFERED, and one whose feature the
       settings have hidden is not either — the settings scope this page, so a
       chip for an untracked feature would rank orgs on something the score
       ignores. Counts come from the same reducer that does the filtering, or
       the chip promises a number the click does not deliver. */
    const qvChips = OF_QUICK_VIEWS
      .filter(v => v.kind !== "feature" || shown.indexOf(v.key) >= 0)
      .map(v => ({ v, n: ofApplyQuickView(v, all.map(decorate), countOf).total }))
      .filter(x => x.n > 0);

    const scoredAll = all.map(decorate).filter(r => r.score != null);
    const avg = scoredAll.length
      ? Math.round(scoredAll.reduce((s, r) => s + r.score, 0) / scoredAll.length) : null;
    const launched = all.filter(o => o.launched).length;

    const metrics = (d.coreMetrics || []).filter(m => m.key || m.id)
      .map(m => ({ key: m.key || m.id, label: m.label || m.key, icon: m.icon || "", description: m.description || "" }));
    const metricKeys = metrics.map(m => m.key);

    const maxes = window.RecPills.columnMaxes(all.map(decorate), metricKeys, (r, k) => r.usage[k]);
    const pill = (r, k) => e("span", { className: "pill mpill", style: window.RecPills.heat(
      r.usage[k] == null ? null : Number(r.usage[k]), maxes[k]) },
      window.RecPills.fmtNum(r.usage[k] == null ? null : Number(r.usage[k])));

    const scoreCell = r => e("td", { className: "num", "data-feat-score": r.score == null ? "" : r.score },
      r.score == null
        ? e("span", { className: "zero" }, "not measured")
        : e("span", { style: { color: scoreColor(r.score), fontWeight: 700 } }, r.score + "%"));

    const launchTag = o => o.launched
      ? e("span", { className: "chip", style: { background: "#dcfce7", borderColor: "#86efac", color: "#166534" } }, "live")
      : e("span", { className: "chip", title: "Not yet live on rec.us" }, "pre-launch");

    const orgOptions = all.map(o => e("option", { key: o.slug, value: o.slug }, orgName(o)));

    /* ── THE DRILL-IN ─────────────────────────────────────────────────────
       Rendered by the SAME component as the list, on purpose. A separate
       top-level component would fetch the snapshot again and resolve the
       settings again, and the two copies would disagree about the tracked
       set the first time either changed — the one-reducer-N-readers rule
       this page already follows for the score. It also keeps the shell: the
       sidebar stays, and the breadcrumb goes back without a page load. */
    if (slug) {
      const o = everyOrg.find(x => x.slug === slug);
      const crumb = e("div", { className: "crumb", "data-feat-crumb": 1 },
        link("/ps/features", "Org Features"), " / ",
        e("b", null, o ? orgName(o) : slug));
      if (!o) {
        return e("div", null, crumb,
          e("div", { className: "note" },
            "No organization with the slug “" + slug + "” is in this snapshot. ",
            "It may have been renamed, or added since the last bake."));
      }
      const oScore = scoreOf(o.slug);
      const oMiss = notUsing(o.slug);
      const oUsage = (d.usage || {})[o.slug] || {};
      return e("div", null, crumb,
        e("div", { className: "org-h" },
          e("h2", null, orgName(o)), launchTag(o), adminLink(o),
          e("div", { className: "links" }, o.slug)),

        /* EXCLUDED IS NEVER HIDDEN, and a deep link to an excluded org still
           works — it is reachable from the settings sheet and from a link
           somebody was sent. It says why it is missing from the list rather
           than pretending not to exist. */
        excluded.has(o.slug) ? e("div", { className: "note", "data-feat-exclnote": 1,
            style: { color: "#b45309", fontWeight: 600 } },
          "⚠ This organization is excluded in the settings, so it is not in the list or the fleet average.") : null,

        e("div", { className: "cards" },
          e("div", { className: "card" }, e("div", { className: "k" }, "Adoption"),
            e("div", { className: "v", "data-feat-orgscore": oScore == null ? "" : oScore,
                       style: { color: oScore == null ? "#94a3b8" : scoreColor(oScore) } },
              oScore == null ? "not measured" : oScore + "%"),
            e("div", { className: "d" }, (shown.length - oMiss.length) + " of " + shown.length + " tracked features")),
          /* THE CORE COUNTS LIVE HERE NOW. They came off the list because
             they measure SIZE rather than adoption; on one org's page size
             is exactly the context you want beside the gaps. */
          metrics.map(m => e("div", { className: "card", key: m.key },
            e("div", { className: "k" }, m.icon + " " + m.label),
            e("div", { className: "v", style: { fontSize: 20 } },
              window.RecPills.fmtNum(oUsage[m.key] == null ? null : Number(oUsage[m.key]))),
            e("div", { className: "d" }, m.description)))),

        /* THE GAPS LEAD. Dan: "Callout what the org is NOT using
           specifically." On a page about one account the unused list is the
           thing to act on, so it sits above the per-category detail rather
           than being assembled from it. */
        e("div", { className: "panel", "data-feat-gaps": oMiss.length },
          e("h2", null, oMiss.length ? "Not using — " + oMiss.length + " of " + shown.length + " tracked features"
                                     : "Using every tracked feature",
            e("span", { className: "hint" }, oMiss.length ? "the specific gaps, by group" : "nothing tracked is unused here")),
          oMiss.length
            ? e("div", { className: "gapwrap" }, groups.map(g => {
                const gm = g.keys.filter(k => !adoptedIn(o.slug, k));
                if (!gm.length) return null;
                return e("div", { key: g.cat, className: "gapgrp" },
                  e("div", { className: "gaphead" }, catShort(g.cat),
                    e("span", { className: "gapn" }, gm.length + "/" + g.keys.length)),
                  gm.map(k => e("div", { key: k, className: "gapitem",
                                         title: (byKey[k] && byKey[k].description) || "" },
                    label(k),
                    (byKey[k] && byKey[k].description)
                      ? e("div", { className: "catdesc" }, byKey[k].description) : null)));
              }))
            : e("div", { className: "note" },
                "Every feature this page tracks is in use at " + orgName(o) + "."),
          /* A FULLY-ADOPTED GROUP IS NOT A GAP, so it is not listed above —
             but "no gaps in Forms & Waivers" is itself worth seeing, and
             without this the panel silently omits whole groups. */
          oMiss.length ? e("div", { className: "gapclear" },
            (() => {
              const clear = groups.filter(g => g.keys.every(k => adoptedIn(o.slug, k))).map(g => catShort(g.cat));
              return clear.length
                ? e("span", null, e("b", null, "Fully adopted: "), clear.join(", "))
                : e("span", null, "No group is fully adopted yet.");
            })()) : null),

        /* EVERY CATEGORY, USED AND UNUSED, with the measured figure beside
           each thing in use — that figure is the snapshot's own `detail`
           string ("4,573 sections with age rules"), so the page never
           re-derives a number the bake already phrased. */
        groups.map(g => {
          const gs = ofGroupScore(g.keys, k => adoptedIn(o.slug, k));
          const used = g.keys.filter(k => adoptedIn(o.slug, k));
          const unused = g.keys.filter(k => !adoptedIn(o.slug, k));
          return e("div", { className: "panel", key: g.cat, "data-feat-cat": g.cat },
            e("h2", null, g.cat,
              e("span", { className: "hint" }, gs.used + " of " + gs.total + " in use"),
              e("span", { className: "pill gpill", style: ofRatioHeat(gs.pct) }, gs.pct + "%")),
            e("div", { className: "catcols" },
              e("div", null,
                e("div", { className: "catlab on" }, "In use (" + used.length + ")"),
                used.length
                  ? used.map(k => e("div", { key: k, className: "catrow" },
                      e("span", { className: "catname" }, label(k)),
                      e("span", { className: "catdetail" }, detailOf(o.slug, k) || "in use")))
                  : e("div", { className: "catnone" }, "Nothing in this group yet.")),
              e("div", null,
                e("div", { className: "catlab off" }, "Not in use (" + unused.length + ")"),
                unused.length
                  /* THE DESCRIPTION IS ON SCREEN, not in a title attribute.
                     Dan, on the Apex page: "unclear on some of these features
                     like 'guest participation' and 'instructor
                     certifications'" — and both were in the not-in-use list.
                     A gap you cannot name is not an actionable gap, and the
                     catalog already carries a one-line answer for all 57
                     (median 78 characters). It goes on the NOT-IN-USE side
                     only: an in-use row already explains itself with its
                     measured figure, and a second line on all 56 rows would
                     double the length of the page. */
                  ? unused.map(k => e("div", { key: k, className: "catrow off" },
                      e("div", null,
                        e("span", { className: "catname" }, label(k)),
                        (byKey[k] && byKey[k].description)
                          ? e("div", { className: "catdesc" }, byKey[k].description)
                          : null)))
                  : e("div", { className: "catnone" }, "All of it is in use."))));
        }),

        showSettings ? e(FeatureSettings, {
          data: d, cfg,
          onClose: () => setShowSettings(false),
          onSaved: (next) => { setCfg(next); setCfgErr(null); setShowSettings(false); },
        }) : null);
    }

    const a = cmpA ? all.find(o => o.slug === cmpA) : null;
    const b = cmpB ? all.find(o => o.slug === cmpB) : null;
    const A = a ? decorate(a) : null, B = b ? decorate(b) : null;
    const gap = (x, y) => shown.filter(k => adoptedIn(x.slug, k) && !adoptedIn(y.slug, k)).map(label);

    return e("div", null,
      /* WHEN THIS DATA IS FROM, stated on the page rather than inferred.
         The sidebar's snapshot line describes the PS/bugs snapshot, which is
         a DIFFERENT file on a different schedule — reading it here and
         assuming it covered these numbers is exactly how the features
         snapshot sat 16 days stale without anyone noticing. It reads the
         features snapshot's own `generatedAt`, and it states the AGE
         (measured) rather than claiming "refreshed daily" (a standing
         promise this project has already broken once). */
      e("div", { className: "asof", "data-feat-asof": snapAgeDays(d.generatedAt) },
        e("span", null, e("b", null, "Data as of "),
          d.generatedAt ? new Date(d.generatedAt).toLocaleString("en-US",
            { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" })
            : "an unreadable date"),
        snapStale(d.generatedAt)
          // A WARNING WHOSE FIX A HUMAN MUST PERFORM CARRIES THE LINK to
          // perform it. The bake is a GitHub Action now, so a missed refresh
          // is a red X on a page one click away.
          ? e("span", { className: "asof-stale" }, "\u26a0 " + snapAgeLabel(d.generatedAt),
              " \u2014 the nightly bake may have failed. ",
              e("a", { href: "https://github.com/danj707/org-features/actions/workflows/refresh-features.yml",
                       target: "_blank", rel: "noopener" }, "Check the last run"))
          : e("span", { className: "asof-age" }, "\u00b7 " + snapAgeLabel(d.generatedAt)),
        e("span", { className: "asof-src" },
          "Baked from the production read replica, daily at 6am ET")),

      e("div", { className: "cards" },
        e("div", { className: "card ringcard", "data-feat-orgs": all.length,
                   title: "Organizations in this view, and how many are live on rec.us" },
          e(Ring, { pct: all.length ? (launched / all.length) * 100 : null,
                    color: "#0d5c99", label: "Organizations: " + all.length }),
          e("div", { className: "ringtext" },
            e("div", { className: "k" }, "Organizations"),
            e("div", { className: "v" }, all.length),
            e("div", { className: "d" }, launched + " live on rec.us \u00b7 " + (all.length - launched) + " pre-launch"))),
        /* RENAMED from "Fleet adoption" at Dan's request. */
        e("div", { className: "card ringcard", "data-feat-avg": avg == null ? "" : avg,
                   title: "The average adoption score across every scored organization in this view" },
          e(Ring, { pct: avg, color: avg == null ? null : scoreColor(avg),
                    label: "Feature Adoption: " + (avg == null ? "not measured" : avg + "%") }),
          e("div", { className: "ringtext" },
            e("div", { className: "k" }, "Feature Adoption"),
            e("div", { className: "v" }, avg == null ? "\u2014" : avg + "%"),
            e("div", { className: "d" }, scoredAll.length + " of " + all.length + " scored"))),
        e("div", { className: "card ringcard", "data-feat-shown": shown.length,
                   title: "How many of the measured features this page is counting" },
          e(Ring, { pct: allMeasured.length ? (shown.length / allMeasured.length) * 100 : null,
                    color: "#0f6f5c", label: "Features tracked: " + shown.length + " of " + allMeasured.length }),
          e("div", { className: "ringtext" },
            e("div", { className: "k" }, "Features tracked"),
            e("div", { className: "v" }, shown.length + " / " + allMeasured.length),
          /* THE DENOMINATOR IS THE SCORE, so it is stated. A reader comparing
             86% today against 60% later needs to know whether the set moved. */
            e("div", { className: "d" },
              hidden.size
                ? hidden.size + " hidden by settings \u00b7 " + allMeasured.length + " of " + total + " measurable"
                : allMeasured.length + " of " + total + " catalog features measured")))),

      // EXCLUSIONS ARE NAMED, NEVER SILENT. A count that quietly drops orgs
      // is how a fleet figure stops being trusted.
      (excluded.size || hidden.size) ? e("div", { className: "note", "data-feat-scopenote": 1 },
        "Scoped by settings: " +
        [hidden.size ? hidden.size + " feature" + (hidden.size === 1 ? "" : "s") + " hidden" : null,
         excluded.size ? excluded.size + " organization" + (excluded.size === 1 ? "" : "s") + " excluded" : null]
          .filter(Boolean).join(" \u00b7 ") +
        ". Adoption scores are taken over the " + shown.length + " tracked feature" + (shown.length === 1 ? "" : "s") +
        ", so they are not comparable with a differently-scoped view. Nothing is deleted \u2014 changing the settings brings it all back.") : null,
      cfgErr ? e("div", { className: "note", style: { color: "#b45309" } },
        "\u26a0 Settings could not be loaded (" + cfgErr + "), so nothing is hidden. This is the full view.") : null,

      e("div", { className: "panel" },
        e("h2", null, "Compare two organizations",
          e("span", { className: "hint" }, "org A on the left, org B on the right \u2014 one row per metric")),
        e("div", { className: "filters" },
          e("select", { value: cmpA, onChange: ev => setCmpA(ev.target.value), "data-feat-cmpa": cmpA || "none" },
            e("option", { value: "" }, "Organization A\u2026"), orgOptions),
          e("select", { value: cmpB, onChange: ev => setCmpB(ev.target.value), "data-feat-cmpb": cmpB || "none" },
            e("option", { value: "" }, "Organization B\u2026"), orgOptions),
          (cmpA || cmpB) ? e("button", { onClick: () => { setCmpA(""); setCmpB(""); } }, "Clear") : null),
        /* GENUINELY SIDE BY SIDE — Dan: "actually make it org 1 on the left,
           org 2 on the right. This isn't side by side, it's top and bottom."
           It was two table ROWS, which is a comparison you read vertically
           one column at a time.

           A THREE-COLUMN GRID rather than two independent cards: the metric
           label sits on the left and both values line up against it, so the
           eye travels along one row to compare one thing. Two stacked cards
           would put "Adoption" in two different places on screen and the
           reader would have to hunt for the pair. */
        (A && B) ? e("div", { className: "cmp", "data-feat-cmp": A.o.slug + "|" + B.o.slug },
          e("div", { className: "cmprow cmphead" },
            e("div", { className: "cmplab" }),
            [A, B].map((r, i2) => e("div", { key: i2, className: "cmpcol",
                                             "data-feat-cmpcol": i2 === 0 ? "a" : "b" },
              e("div", { className: "cmporg" }, e("b", null, orgName(r.o)), " ", launchTag(r.o), " ", adminLink(r.o)),
              e("div", { className: "subslug" }, r.o.slug)))),

          /* Adoption first, then the core counts, then a row per feature
             group — the same order as the table's columns, so the two
             surfaces read the same way round. */
          e("div", { className: "cmprow" },
            e("div", { className: "cmplab" }, "Adoption"),
            [A, B].map((r, i2) => e("div", { key: i2, className: "cmpcol cmpval" },
              r.score == null
                ? e("span", { className: "zero" }, "not measured")
                : e("span", { style: { color: scoreColor(r.score), fontWeight: 800, fontSize: 17 } },
                    r.score + "%")))),

          metrics.map(m => e("div", { className: "cmprow", key: m.key },
            e("div", { className: "cmplab", title: m.description }, m.icon + " " + m.label),
            [A, B].map((r, i2) => e("div", { key: i2, className: "cmpcol cmpval" },
              pill(r, m.key))))),

          groups.map(g => {
            const ga = ofGroupScore(g.keys, k => adoptedIn(A.o.slug, k));
            const gb = ofGroupScore(g.keys, k => adoptedIn(B.o.slug, k));
            return e("div", { className: "cmprow", key: g.cat },
              e("div", { className: "cmplab", title: g.cat }, catShort(g.cat)),
              [ga, gb].map((gs, i2) => e("div", { key: i2, className: "cmpcol cmpval" },
                e("span", { className: "pill gpill", style: ofRatioHeat(gs && gs.pct) },
                  gs ? gs.used + "/" + gs.total : "—"))));
          }),

          /* THE GAP LISTS SIT UNDER THEIR OWN ORG, in the same two columns.
             They used to run the full width stacked, which is what made the
             panel read top-and-bottom even where the numbers did not. */
          A.o.slug === B.o.slug
            ? e("div", { className: "note" }, "That is the same organization in both slots.")
            : e("div", { className: "cmprow cmpgaps", "data-feat-gap": 1 },
                e("div", { className: "cmplab" }, "Only here"),
                [[A.o, B.o], [B.o, A.o]].map(([x, y], i2) => {
                  const g = gap(x, y);
                  return e("div", { key: i2, className: "cmpcol" },
                    g.length
                      ? e("div", { className: "cmponly" },
                          e("b", null, g.length + " feature" + (g.length === 1 ? "" : "s") + " "),
                          orgName(y) + " does not have: " + g.join(", "))
                      : e("div", { className: "cmponly none" },
                          "Nothing " + orgName(y) + " does not also have."));
                }))
        ) : e("div", { className: "note" }, "Pick an organization in both slots to compare them."),
      ),

      e("div", { className: "panel" },
        e("h2", null, "Feature adoption by organization",
          e("span", { className: "hint" }, "click a column to sort \u00b7 click a row for the full breakdown"),
          e("button", { onClick: () => setShowSettings(true), "data-feat-gear": 1,
                        title: "Choose which features and organizations this page counts",
                        style: { float: "right", marginTop: -2 } }, "⚙")),
        e("div", { className: "filters" },
          e("select", { value: only, onChange: ev => { setOnly(ev.target.value); if (ev.target.value) { setQv(""); setSort(null); } },
                        "data-feat-only": only || "all" },
            e("option", { value: "" }, "All organizations (" + all.length + ")"), orgOptions),
          /* ONE ACTIVE VIEW AT A TIME, and picking one clears the single-org
             pulldown (and vice versa). Two controls producing one state is a
             control that looks broken — the same rule as the season and
             status pickers in the sibling project. Clicking the active chip
             clears it, so there is no separate "off" chip. */
          e("div", { className: "qv", "data-feat-qv": qv || "none" }, qvChips.map(({ v, n }) =>
            e("button", { key: v.id, title: v.title,
                          className: "qvchip" + (qv === v.id ? " on" : ""),
                          "data-feat-qvchip": v.id,
                          onClick: () => { setQv(qv === v.id ? "" : v.id); setOnly(""); setSort(null); } },
              v.label,
              // The count is what the click will actually show. A ranked view
              // is capped rather than scoped, so it says the cap instead.
              e("span", { className: "qvn" }, v.kind === "feature" ? n : "top " + v.limit))))),
        /* THE ACTIVE VIEW STATES WHAT IT IS SHOWING. A re-sorted, re-scoped
           table that looks like the full list is how a reader takes 25 rows
           for 144 — the same reason the settings scope note exists. */
        view ? e("div", { className: "qvnote", "data-feat-qvnote": view.id },
          e("b", null, view.title), " \u00b7 ",
          /* THE NOTE MUST NOT CLAIM AN ORDER IT NO LONGER SETS. A view says
             "by volume"; once a column is clicked the table is in that
             column's order, and a note still promising the view's ranking is
             two surfaces disagreeing on one screen. */
          sort ? e("span", null, "re-sorted by the ", e("b", null, sort[0] === "name" ? "organization"
                    : sort[0] === "score" ? "adoption" : catShort(sort[0])),
                  " column \u00b7 ") : null,
          qvOut.capped
            ? "showing " + rows.length + " of " + qvOut.total
            : "showing all " + rows.length,
          " \u00b7 ",
          e("a", { href: "#", onClick: ev => { ev.preventDefault(); setQv(""); setSort(null); } },
            "clear and go back to all " + all.length + " alphabetically")) : null,
        /* WITHOUT A VIEW, a manual sort still needs somewhere to say so and a
           way back — otherwise the only clue is a small arrow in a header. */
        (sort && !view) ? e("div", { className: "qvnote", "data-feat-sortnote": sort[0] },
          e("b", null, "Sorted by " + (sort[0] === "name" ? "organization"
            : sort[0] === "score" ? "adoption" : catShort(sort[0]))),
          " " + (sort[1] < 0 ? "high to low" : "low to high"), " \u00b7 ",
          e("a", { href: "#", onClick: ev => { ev.preventDefault(); setSort(null); } },
            "back to alphabetical")) : null,
        e("div", { className: "tablewrap" },
          e("table", { className: "feattable" },
            e("thead", null, e("tr", null,
              sortTh("Organization", "name", { className: "l" }),
              sortTh("Adoption", "score"),
              /* ONE COLUMN PER FEATURE GROUP, replacing the six raw count
                 pills. The counts were a measure of SIZE — Apex has 98,197
                 registrations and Aspen has none, which says which org is
                 big, not which features either has configured. This page is
                 about adoption, so every column is now a share of its own
                 group and the core counts moved to the drill-in, where size
                 is context rather than the headline. */
              groups.map(g => sortTh(catShort(g.cat), g.cat,
                { key: g.cat,
                  title: g.cat + " \u2014 " + g.keys.length + " tracked feature" + (g.keys.length === 1 ? "" : "s")
                       + " \u00b7 click to sort by how much of it is in use" })))),
            rows.map(r => {
              const miss = notUsing(r.o.slug);
              const open2 = () => nav("/ps/features/" + encodeURIComponent(r.o.slug));
              /* THE PAIR IS ONE <tbody>, not a Fragment. A table may carry many,
                 and it is what lets the band own a single heavy bottom edge and
                 ONE hover state — as two <tr>s in a shared tbody, the summary and
                 its own gaps highlighted as separate objects and every internal
                 hairline looked exactly like the boundary between two orgs. */
              return e("tbody", { key: r.o.slug, className: "orgband" },
                e("tr", { onClick: open2, style: { cursor: "pointer" }, "data-feat-row": r.o.slug,
                          "data-feat-launched": r.o.launched ? "1" : "0" },
                  e("td", { className: "l" },
                    e("b", null, orgName(r.o)), " ", launchTag(r.o), " ", adminLink(r.o),
                    /* .subslug, NOT .note. The global .note is the CENTRED
                       EMPTY-STATE style with 26px of vertical padding — using
                       it for a slug is what made every row three lines tall
                       with the slug adrift in the middle, which is the "ton of
                       space" in Dan's screenshot. */
                    e("div", { className: "subslug" }, r.o.slug)),
                  scoreCell(r),
                  groups.map(g => {
                    const gs = ofGroupScore(g.keys, k => adoptedIn(r.o.slug, k));
                    return e("td", { key: g.cat, className: "num" },
                      e("span", { className: "pill gpill", style: ofRatioHeat(gs && gs.pct),
                                  "data-feat-grp": g.cat + ":" + (gs ? gs.used + "/" + gs.total : "") },
                        gs ? gs.used + "/" + gs.total : "—"));
                  })),
                /* THE GAP STACK — one group per LINE, worst first.

                   THREE VERSIONS OF THIS ROW HAVE NOW BEEN REJECTED, and each
                   rejection named a different fault worth keeping:

                   1. a strip of 56 unlabelled dots in twelve boxes —
                      "pretty unreadable". It DUPLICATED the group columns
                      directly above it, less legibly, and telling which box
                      was which meant hovering.
                   2. a wrapped flex LINE of clusters — "The two rows of not
                      using are just a mash up of words". True: at a normal
                      width `Payments Promo codes, Deposits` ran into
                      `Comms SMS, Broadcasts` mid-sentence, with nothing for
                      the eye to anchor on.

                   So the names get a GRID: a fixed label column, the group's
                   own ratio in a tabular column beside it, and the missing
                   feature names on their own line. Every line starts in the
                   same place down the whole table, which is what makes three
                   groups readable where a wrapped paragraph of the same words
                   was not. */
                e("tr", { key: "gaps", className: "gap-row", onClick: open2, style: { cursor: "pointer" } },
                  e("td", { colSpan: 2 + groups.length },
                    (() => {
                      if (!miss.length) {
                        return e("div", { className: "gapstack", "data-feat-miss": 0 },
                          e("div", { className: "gapeyebrow ok" }, "Using every tracked feature"));
                      }
                      const cl = ofGapClusters(groups, k => adoptedIn(r.o.slug, k),
                                               GAP_GROUPS_SHOWN, GAP_NAMES_SHOWN);
                      return e("div", { className: "gapstack", "data-feat-miss": miss.length },
                        /* THE TOTAL LEADS, and it is stated against the
                           denominator. "Not using 31" alone is a number with
                           no scale; the three lines under it are a sample of
                           it, not the whole of it, and a reader who cannot
                           see that reads 31 gaps as 11. */
                        e("div", { className: "gapeyebrow" },
                          "Not using " + miss.length + " of " + shown.length),
                        cl.head.map(x => [
                          e("div", { key: x.cat + ":c", className: "gapcat" }, catShort(x.cat)),
                          /* The group's own share, so the line says how DEEP
                             the gap is — 0/4 and 3/4 are different problems
                             and both list names. Same used/total as the
                             column above it and the drill-in, deliberately:
                             three spellings of one ratio is how a reader
                             stops trusting any of them. */
                          e("div", { key: x.cat + ":r", className: "gapratio",
                                     "data-feat-gapratio": catShort(x.cat) + ":" + x.used + "/" + x.total },
                            x.used + "/" + x.total),

                        /* WHAT WAS TRIMMED IS STATED. A capped list that does
                           not say it is capped reads as the whole answer,
                           which is how 55 gaps look like 12. It sits in the
                           NAME column, not the label column, so it reads as a
                           footnote to the list rather than a fourth group. */
                        cl.restGroups
                          ? e("div", { key: "trim", className: "gaptrim",
                                       "data-feat-gaptrim": cl.restFeatures + "/" + cl.restGroups },

                          : null);
                    })())));
            }))),

          view ? "No organization matches “" + view.label + "” in this snapshot."
               : "No organizations match.")),

  /* ── THE SETTINGS SHEET ─────────────────────────────────────────────────
     PORTALLED ONTO <body>, not rendered in place. The sibling project records
     this twice: a panel that renders inside a styled container inherits
     text-transform, colour and flex-direction from it, and its Save button
     loses to the container's own button rule and renders inert — which reads
     as "the settings page doesn't work" rather than as a CSS problem. A modal
     also belongs on body for z-index and overflow.

     Editing is DRAFT-THEN-SAVE, never auto-save: this is shared state, so a
     half-made change must not reach everyone else the moment a box is
     ticked. Save is disabled until the draft actually differs from what the
     server holds, and the footnote says which of those two states you are
     in — a greyed button with no explanation is what invites "it didn't
     save". */
  function FeatureSettings({ data, cfg, onClose, onSaved }) {
    const measured = data.measuredFeatures || [];
    const byKey = {};
    (data.features || []).forEach(f => { byKey[f.key] = f; });
    const nameOf = k => (byKey[k] && (byKey[k].name || k)) || k;

    const [hidden, setHidden] = useState(new Set(cfg.hiddenFeatures || []));
    const [excluded, setExcluded] = useState(new Set(cfg.excludedOrgs || []));
    const [orgQ, setOrgQ] = useState("");
    const [saving, setSaving] = useState(false);
    const [saveErr, setSaveErr] = useState(null);

    // Features grouped by their catalog category, which is the "type" the
    // catalog already carries — no second taxonomy invented here.
    const groups = [];
    (data.featureCategories || []).forEach(cat => {
      const keys = measured.filter(k => byKey[k] && byKey[k].category === cat);
      if (keys.length) groups.push([cat, keys]);
    });
    const grouped = new Set(groups.flatMap(([, ks]) => ks));
    const orphans = measured.filter(k => !grouped.has(k));
    if (orphans.length) groups.push(["Other", orphans]);

    const orgName = o => o.displayName || o.name || o.slug;
    const orgs = (data.orgs || []).slice().sort((x, y) => orgName(x).localeCompare(orgName(y)));
    const visibleOrgs = orgs.filter(o =>
      !orgQ || (orgName(o) + " " + o.slug).toLowerCase().includes(orgQ.toLowerCase()));

    const toggle = (set, setter, k) => {
      const n = new Set(set);
      if (n.has(k)) n.delete(k); else n.add(k);
      setter(n);
    };
    const sameSet = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
    const dirty = !sameSet(hidden, new Set(cfg.hiddenFeatures || []))
                || !sameSet(excluded, new Set(cfg.excludedOrgs || []));

    const save = () => {
      setSaving(true); setSaveErr(null);
      fetch("/api/org-features-settings", {
        method: "PUT", headers: { "content-type": "application/json" },
        body: JSON.stringify({ hiddenFeatures: [...hidden], excludedOrgs: [...excluded] }),
      })
        .then(r => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
        // The response is what was STORED, not what was sent, so an entry
        // that got clamped or de-duplicated is visible rather than assumed.
        .then(saved => onSaved(saved))
        .catch(err => { setSaveErr(err.message); setSaving(false); });
    };

    const sheet = e("div", { className: "ofs-back", onClick: ev => { if (ev.target === ev.currentTarget) onClose(); } },
      e("div", { className: "ofs", "data-feat-settings": 1, role: "dialog", "aria-label": "Org Features settings" },
        e("div", { className: "ofs-head" },
          e("div", null,
            e("b", null, "Org Features settings"),
            e("div", { className: "ofs-sub" },
              "Shared by everyone on the CX dashboard \u2014 saving changes this page for all users.")),
          e("button", { onClick: onClose, "aria-label": "Close" }, "\u2715")),

        e("div", { className: "ofs-body" },
          e("div", { className: "ofs-secthead" },
            "Features counted",
            e("span", null, hidden.size ? (measured.length - hidden.size) + " of " + measured.length + " tracked"
                                        : "all " + measured.length + " tracked"),
            e("span", { className: "ofs-acts" },
              e("a", { href: "#", onClick: ev => { ev.preventDefault(); setHidden(new Set()); } }, "all"),
              " \u00b7 ",
              e("a", { href: "#", onClick: ev => { ev.preventDefault(); setHidden(new Set(measured)); } }, "none"))),
          e("div", { className: "ofs-note" },
            "Unticking a feature hides its column from the checklist AND takes it out of the adoption score, so the score only counts what you care about. Nothing is deleted."),
          groups.map(([cat, keys]) => {
            const on = keys.filter(k => !hidden.has(k)).length;
            return e("div", { className: "ofs-grp", key: cat },
              e("div", { className: "ofs-grphead" },
                e("b", null, cat), " ",
                e("span", { className: "ofs-count" }, on + "/" + keys.length),
                e("span", { className: "ofs-acts" },
                  e("a", { href: "#", onClick: ev => { ev.preventDefault();
                    const n = new Set(hidden); keys.forEach(k => n.delete(k)); setHidden(n); } }, "all"),
                  " \u00b7 ",
                  e("a", { href: "#", onClick: ev => { ev.preventDefault();
                    const n = new Set(hidden); keys.forEach(k => n.add(k)); setHidden(n); } }, "none"))),
              e("div", { className: "ofs-grid" }, keys.map(k =>
                e("label", { key: k, className: "ofs-chk", title: (byKey[k] && byKey[k].description) || "" },
                  e("input", { type: "checkbox", checked: !hidden.has(k),
                               "data-feat-fchk": k,
                               onChange: () => toggle(hidden, setHidden, k) }),
                  e("span", null, nameOf(k))))));
          }),

          e("div", { className: "ofs-secthead", style: { marginTop: 18 } },
            "Organizations excluded",
            e("span", null, excluded.size ? excluded.size + " excluded of " + orgs.length
                                          : "none excluded of " + orgs.length),
            excluded.size ? e("span", { className: "ofs-acts" },
              e("a", { href: "#", onClick: ev => { ev.preventDefault(); setExcluded(new Set()); } }, "clear")) : null),
          e("div", { className: "ofs-note" },
            "Tick an organization to drop it from this page entirely \u2014 the table, the pulldown, the comparison and the fleet average. For test and retired accounts."),
          // Already-excluded orgs are pinned to the top, or an org you
          // excluded last month is unfindable without remembering its name.
          excluded.size ? e("div", { className: "ofs-grid" }, [...excluded].sort().map(slug => {
            const o = orgs.find(x => x.slug === slug);
            return e("label", { key: slug, className: "ofs-chk ofs-on" },
              e("input", { type: "checkbox", checked: true, "data-feat-ochk": slug,
                           onChange: () => toggle(excluded, setExcluded, slug) }),
              e("span", null, o ? orgName(o) : slug,
                // An entry whose org is no longer in the snapshot stays
                // listed and says so, or it could never be unticked.
                o ? null : e("span", { className: "ofs-gone" }, " not in this snapshot")));
          })) : null,
          e("input", { className: "ofs-search", type: "text", placeholder: "Search organizations\u2026",
                       value: orgQ, onChange: ev => setOrgQ(ev.target.value) }),
          e("div", { className: "ofs-grid ofs-scroll" }, visibleOrgs.filter(o => !excluded.has(o.slug)).map(o =>
            e("label", { key: o.slug, className: "ofs-chk", title: o.slug },
              e("input", { type: "checkbox", checked: false, "data-feat-ochk": o.slug,
                           onChange: () => toggle(excluded, setExcluded, o.slug) }),
              e("span", null, orgName(o), o.launched ? null : e("span", { className: "ofs-gone" }, " pre-launch"))))),
          visibleOrgs.length ? null : e("div", { className: "ofs-note" }, "No organization matches that search.")),

        e("div", { className: "ofs-foot" },
          e("div", { className: "ofs-footnote", "data-feat-footnote": dirty ? "dirty" : "clean" },
            saveErr ? e("span", { style: { color: "#b91c1c" } }, "Could not save: " + saveErr)
                    : dirty ? "Save applies this to everyone on the CX dashboard."
                            : "Nothing to save \u2014 tick or untick something first."),
          e("div", null,
            e("button", { onClick: onClose }, "Cancel"), " ",
            e("button", { className: "ofs-save", disabled: !dirty || saving, onClick: save,
                          "data-feat-save": dirty ? "on" : "off" },
              saving ? "Saving\u2026" : "Save"))),

        cfg.updatedAt ? e("div", { className: "ofs-meta" },
          "Last changed " + new Date(cfg.updatedAt).toLocaleString() +
          (cfg.updatedBy ? " by " + cfg.updatedBy : "")) : null));

    return ReactDOM.createPortal ? ReactDOM.createPortal(sheet, document.body) : sheet;
  }

  /* ── UPDATES ─────────────────────────────────────────────────────────────
     Served from a committed file rather than typed into this page, so an entry
     arrives in the same commit as the change it describes and is reviewable in
     the diff. Newest first. */
  function Updates() {
    const [d, setD] = useState(null);
    const [err, setErr] = useState(null);
    useEffect(() => {
      fetch("/api/updates")
        .then(r => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
        .then(setD).catch(e => setErr(e.message));
    }, []);
    if (err) return e("div", { className: "note" }, "Could not load the update log: " + err);
    if (!d) return e("div", { className: "note" }, "Loading updates…");
    const items = (d.updates || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
    if (!items.length) return e("div", { className: "note" }, "Nothing logged yet.");
    return e("div", null, ...items.map((u, i) =>
      e("div", { className: "panel", key: i, "data-update-entry": u.date },
        e("div", { className: "note" }, u.date),
        e("h3", { style: { margin: "2px 0 8px" } }, u.title),
        u.body ? e("p", null, u.body) : null,
        Array.isArray(u.items) && u.items.length
          ? e("ul", { style: { margin: "6px 0 0 18px", padding: 0, fontSize: 13, lineHeight: 1.6 } },
              ...u.items.map((it, j) => e("li", { key: j }, it)))
          : null)));
  }

           navigation out of this app into dashboard.html — the sidebar

           link() -> pushState and keeps the shell, so this one does too.

        me.role === "admin" ? e(React.Fragment, null, e("div", { className: "sec" }, "Admin"), item("/ps/admin", "Users", r.page === "admin")) : null,

        e("div", { className: "foot" },
          e("div", null, "Signed in as ", e("b", { style: { color: "#cbd5e1" } }, me.name), " (" + me.role + ")"),
          e("a", { href: "#", onClick: (ev) => { ev.preventDefault(); signOut(); }, style: { color: "#6ee7b7" } }, "Sign out"),

            snapStale(data.generatedAt)

      e("main", null,
