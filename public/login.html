<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rec · PS Dashboard — Sign in</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛟</text></svg>">
<style>
  :root { --ink:#1a2333; --muted:#64748b; --line:#e2e8f0; --brand:#0f6f5c; --brand-2:#0d5c99; --bad:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center;
         background: linear-gradient(135deg,#0f6f5c 0%,#0d5c99 100%); color:var(--ink); }
  .box { background:#fff; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.25); width:380px; max-width:92vw; padding:28px 28px 24px; }
  h1 { font-size:19px; margin:0 0 2px; } .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; }
  .tabs button { flex:1; padding:8px; border:1px solid var(--line); background:#f8fafc; border-radius:8px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; }
  .tabs button.on { background:#0f6f5c; border-color:#0f6f5c; color:#fff; }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  input:focus { outline:2px solid #0f6f5c33; border-color:var(--brand); }
  .go { width:100%; margin-top:18px; padding:11px; background:var(--brand); color:#fff; border:0; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; }
  .go:disabled { opacity:.6; }
  .err { color:var(--bad); font-size:12.5px; margin-top:10px; min-height:16px; }
  .hint { color:var(--muted); font-size:11.5px; margin-top:14px; text-align:center; }
</style>
</head>
<body>
<div class="box">
  <h1>rec · PS dashboard</h1>
  <div class="sub">Partner Success · internal</div>
  <div class="tabs">
    <button id="t-login" class="on" onclick="setMode('login')">Sign in</button>
    <button id="t-signup" onclick="setMode('signup')">Create account</button>
  </div>
  <form id="f" onsubmit="return go(event)">
    <div id="fld-name" style="display:none"><label>Name</label><input id="name" autocomplete="name" placeholder="Dan Jenner"></div>
    <label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@rec.us" required>
    <div id="fld-password"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <div id="fld-code" style="display:none"><label>Team signup code</label><input id="code" placeholder="ask Dan for the code"></div>
    <button class="go" id="btn">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <div class="hint"><a href="#" id="forgot" onclick="setMode(mode === 'forgot' ? 'login' : 'forgot'); return false">Forgot your password?</a><br>New here? Create an account with the team signup code.<br>Looking for the public adoption dashboard? <a href="/">It's here</a>.</div>
</div>
<script>
  let mode = "login";
  function setMode(m) {
    mode = m;
    document.getElementById("t-login").className = m === "login" ? "on" : "";
    document.getElementById("t-signup").className = m === "signup" ? "on" : "";
    document.getElementById("fld-name").style.display = m === "signup" ? "" : "none";
    document.getElementById("fld-code").style.display = m === "signup" ? "" : "none";
    document.getElementById("fld-password").style.display = m === "forgot" ? "none" : "";
    document.getElementById("password").required = m !== "forgot";
    document.getElementById("btn").textContent = m === "signup" ? "Create account" : m === "forgot" ? "Email me a reset link" : "Sign in";
    document.getElementById("forgot").textContent = m === "forgot" ? "Back to sign in" : "Forgot your password?";
    document.getElementById("password").autocomplete = m === "signup" ? "new-password" : "current-password";
    const err = document.getElementById("err");
    err.textContent = ""; err.style.color = "";
  }
  async function go(ev) {
    ev.preventDefault();
    const btn = document.getElementById("btn"), err = document.getElementById("err");
    btn.disabled = true; err.textContent = ""; err.style.color = "";
    const body = { email: document.getElementById("email").value };
    if (mode !== "forgot") body.password = document.getElementById("password").value;
    if (mode === "signup") {
      body.name = document.getElementById("name").value;
      body.code = document.getElementById("code").value;
    }
    try {
      const r = await fetch("/api/auth/" + mode, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const d = await r.json();
      if (!r.ok) { err.textContent = d.error || "Something went wrong."; btn.disabled = false; return; }
      if (mode === "forgot") { err.style.color = "#0f6f5c"; err.textContent = d.message; btn.disabled = false; return; }
      location.href = "/ps";
    } catch { err.textContent = "Network error — try again."; btn.disabled = false; }
    return false;
  }
</script>
</body>
</html>
